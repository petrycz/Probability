<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Probability, from First Principles</title>
<style>
  :root{--bg:#0d1420;--grid:#172233;--panel:#131d2c;--panel2:#182437;--ink:#e9eef6;
    --muted:#8095ab;--muted2:#5d6f85;--accent:#7ab8ff;--good:#3fb98f;--good2:#1e4a3d;--bad:#e2664f;--bad2:#4a2620;
    --gold:#e8b84b;--line:#243347;--rad:15px;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:26px 26px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;}
  .wrap{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 14px calc(24px + env(safe-area-inset-bottom));}
  header{position:sticky;top:0;z-index:10;padding:calc(12px + env(safe-area-inset-top)) 0 9px;background:linear-gradient(var(--bg) 80%,transparent);}
  .htop{display:flex;align-items:center;gap:10px;margin-bottom:9px;min-height:24px;}
  .back{color:var(--accent);font-size:14px;cursor:pointer;font-weight:500;padding:4px 2px;}
  .kick{font-weight:600;font-size:12px;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .kick.course{color:var(--accent);text-transform:uppercase;letter-spacing:.7px;font-size:11px;}
  .step{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);}
  .pbar{height:5px;border-radius:4px;background:var(--panel);overflow:hidden;border:1px solid var(--line);}
  .pbar i{display:block;height:100%;background:var(--accent);transition:width .3s;}
  main{flex:1;}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--rad);padding:18px 15px;box-shadow:0 16px 38px -26px rgba(0,0,0,.8);animation:in .3s cubic-bezier(.2,.7,.2,1);margin-top:6px;}
  @keyframes in{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:none;}}
  h1{font-weight:800;font-size:22px;letter-spacing:-.4px;margin:2px 2px 6px;line-height:1.2;}
  h2{font-weight:750;font-size:19px;letter-spacing:-.3px;margin:0 0 11px;line-height:1.28;}
  .lede{color:var(--muted);font-size:14px;line-height:1.55;margin:0 2px 15px;}
  p{font-size:15.5px;line-height:1.62;color:#d6e0ee;margin:0 0 13px;}
  p.small{font-size:13.5px;color:var(--muted);}
  em{color:var(--ink);font-style:italic;} b,strong{color:var(--ink);font-weight:650;}
  .mono{font-family:var(--mono);color:var(--accent);font-size:.94em;}
  .cy{color:var(--accent);} .gld{color:var(--gold);} .grn{color:var(--good);} .rd{color:var(--bad);}
  .eqbox{font-family:var(--mono);font-size:14.5px;line-height:1.8;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0;color:#dbe6f4;overflow-x:auto;}
  .eqbox .hl{color:var(--gold);}
  .mathrow{text-align:center;margin:14px 0;font-family:var(--mono);font-size:15px;overflow-x:auto;white-space:nowrap;}
  sub,sup{font-size:.72em;}
  canvas{width:100%;height:auto;display:block;border-radius:12px;background:#0a111b;border:1px solid var(--line);touch-action:none;}
  .readout{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .rdc{flex:1;min-width:78px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;}
  .rdc .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .rdc .v{font-family:var(--mono);font-weight:700;font-size:16px;margin-top:2px;}
  .ctrls{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap;}
  .slabel{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:74px;}
  input[type=range]{flex:1;min-width:140px;accent-color:var(--accent);height:30px;}
  .task{background:rgba(232,184,75,.08);border:1px solid rgba(232,184,75,.28);border-radius:11px;padding:12px 13px;margin:14px 0;font-size:14.5px;line-height:1.55;color:#f0e2c2;}
  .task b{color:var(--gold);font-size:11px;letter-spacing:.5px;text-transform:uppercase;display:block;margin-bottom:5px;}
  .defn{background:rgba(122,184,255,.07);border:1px solid rgba(122,184,255,.30);border-radius:11px;padding:12px 14px;margin:13px 0;font-size:14.5px;line-height:1.6;color:#dbe6f4;}
  .defn .dt{color:var(--accent);font-size:11px;letter-spacing:.5px;text-transform:uppercase;display:block;margin-bottom:6px;font-weight:700;}
  .defn+.defn{margin-top:9px;}
  .entry{display:flex;gap:9px;align-items:center;margin-top:12px;}
  .entry input{flex:1;background:var(--panel2);border:1.5px solid var(--line);border-radius:11px;color:var(--ink);font-family:var(--mono);font-size:16px;padding:12px 13px;outline:none;min-width:0;}
  .entry input:focus{border-color:var(--accent);}
  .miniout{margin-top:9px;font-size:13.5px;line-height:1.5;} .miniout.ok{color:var(--good);} .miniout.no{color:var(--bad);}
  .choices{display:grid;grid-template-columns:1fr;gap:9px;margin-top:13px;}
  .seg{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 2px;}
  .segb{font-family:var(--mono);font-size:13px;font-weight:600;padding:9px 12px;border-radius:9px;background:var(--panel2);border:1.5px solid var(--line);color:var(--muted);cursor:pointer;}
  .segb.on{border-color:var(--accent);color:var(--accent);background:#0e2530;}
  .ucircle{position:relative;}
  .choice{background:var(--panel2);border:1.5px solid var(--line);border-radius:11px;padding:13px;cursor:pointer;font-size:14px;line-height:1.4;transition:.12s;}
  .choice .cm{font-family:var(--mono);}
  .choice.correct{border-color:var(--good);background:var(--good2);color:#c7f4e3;} .choice.wrong{border-color:var(--bad);background:var(--bad2);color:#f6cdc4;} .choice.dim{opacity:.45;} .choice.locked{cursor:default;}
  .code{background:#0a1019;border:1px solid var(--line);border-radius:11px;margin:13px 0;overflow:hidden;}
  .code .ch{font-family:var(--mono);font-size:11px;color:var(--muted);padding:7px 12px;border-bottom:1px solid var(--line);background:#0c131e;letter-spacing:.4px;}
  .code pre{margin:0;padding:12px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#cfe0f2;-webkit-overflow-scrolling:touch;}
  .prob{border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin:13px 0;background:var(--panel2);}
  .prob .ph{font-weight:700;font-size:13px;color:var(--accent);letter-spacing:.3px;margin-bottom:7px;}
  .prob .lvl{float:right;font-size:10px;color:var(--muted2);border:1px solid var(--line);border-radius:20px;padding:1px 7px;letter-spacing:.4px;}
  details{margin-top:10px;border-top:1px dashed var(--line);padding-top:9px;}
  summary{cursor:pointer;color:var(--gold);font-size:13px;font-weight:600;list-style:none;}
  summary::-webkit-details-marker{display:none;} summary::before{content:'▸ ';}
  details[open] summary::before{content:'▾ ';}
  .sol{font-size:14px;line-height:1.6;color:#d0dcea;margin-top:9px;} .sol p{font-size:14px;margin:0 0 9px;}
  .reveal{margin-top:15px;border-left:3px solid var(--good);background:rgba(63,185,143,.07);border-radius:0 11px 11px 0;padding:12px 14px;animation:in .3s ease;}
  .reveal .rh{font-weight:750;font-size:13px;color:var(--good);margin-bottom:6px;}
  .reveal p{font-size:14px;color:#d7e6df;margin:0 0 8px;} .reveal p:last-child{margin:0;}
  .reveal .note{font-family:var(--mono);font-size:13px;color:var(--accent);}
  .flash{position:fixed;left:50%;top:calc(16% + env(safe-area-inset-top));transform:translateX(-50%);background:var(--good);color:#06231a;font-weight:750;font-size:14px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;z-index:50;}
  .flash.show{animation:flash 1.1s ease;}
  @keyframes flash{0%{opacity:0;transform:translate(-50%,6px);}15%{opacity:1;transform:translate(-50%,0);}80%{opacity:1;}100%{opacity:0;transform:translate(-50%,-8px);}}
  footer{position:sticky;bottom:0;padding:11px 0 calc(6px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 32%);display:flex;gap:10px;align-items:center;}
  .btn{font-weight:650;font-size:15px;border:none;border-radius:11px;padding:14px 18px;cursor:pointer;transition:.1s;font-family:var(--sans);}
  .btn:active{transform:scale(.98);}
  .btn.primary{flex:1;background:var(--accent);color:#08131b;} .btn.primary:disabled{background:var(--panel2);color:var(--muted2);cursor:default;}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .btn.hint{background:transparent;color:var(--gold);border:1px solid var(--line);}
  .hintbox{font-size:13.5px;line-height:1.55;color:#f0e2c2;background:rgba(232,184,75,.08);border:1px solid rgba(232,184,75,.25);border-radius:10px;padding:11px 13px;margin-top:12px;display:none;}
  .hintbox.show{display:block;}
  .mcard{cursor:pointer;transition:border-color .15s,transform .08s;} .mcard.lock{opacity:.55;cursor:default;}
  .mtop{display:flex;align-items:center;gap:9px;} .mnum{font-family:var(--mono);font-size:12px;color:var(--muted2);}
  .mstat{margin-left:auto;font-weight:650;font-size:11px;padding:3px 9px;border-radius:999px;}
  .mstat.done{color:var(--good);background:var(--good2);} .mstat.todo{color:var(--accent);background:rgba(122,184,255,.14);} .mstat.soon{color:var(--muted2);background:#141e2c;}
  .mtitle{font-weight:750;font-size:17px;margin:8px 0 5px;} .msub{color:var(--muted);font-size:13.5px;line-height:1.5;}
  .rvlink{color:var(--gold);cursor:pointer;font-size:12px;white-space:nowrap;}
  a.rvlink{text-decoration:none;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;}}
  .katex{font-size:1.03em;}
  .eqbox .katex-display{margin:0;}
  .eqbox .katex-display>.katex{white-space:normal;}
</style>

<body>
<div class="wrap">
  <header>
    <div class="htop"><span class="back" id="backBtn" style="display:none">‹ Menu</span><span class="kick course" id="kick">Probability, from First Principles</span><span class="step" id="stepLbl"></span></div>
    <div class="pbar" id="pbarWrap" style="display:none"><i id="pfill" style="width:0%"></i></div>
  </header>
  <main><div id="stage"></div><div class="hintbox" id="hintbox"></div></main>
  <footer id="footer" style="display:none"><button class="btn ghost" id="prevBtn" style="display:none">Back</button><button class="btn hint" id="hintBtn">Hint</button><button class="btn primary" id="contBtn" disabled>Continue</button></footer>
</div>
<div class="flash" id="flash">✓</div><script>
"use strict";
const stage=document.getElementById('stage'),hintBtn=document.getElementById('hintBtn'),contBtn=document.getElementById('contBtn'),
      hintbox=document.getElementById('hintbox'),flashEl=document.getElementById('flash'),footer=document.getElementById('footer');
let view='menu',curM=0,beat=0,unlocked=false,hints=[],hintIdx=0,recallReturn=null;
const completed={};
const MODULES=[
 {id:'p0',title:'Outcomes, Events & Counting',sub:'Sample spaces and events, the three axioms, equally likely outcomes, permutations and combinations, and inclusion–exclusion.',ready:true,
  outro:`A probability is the share of trials on which an event happens in the long run, so probabilities lie between 0 and 1 and the outcomes' probabilities add to 1 — summed over a list, integrated under a density on a line, or taken as a volume over a plane. When the outcomes are equally likely, probability reduces to counting, and permutations, combinations, and inclusion–exclusion do the counting.`,
  beats:[p0_intro,p0_shapes,p0_recall,p0_events]},
 {id:'p1',title:'Conditioning, Independence & Bayes',sub:'Conditional probability as a restricted world, the multiplication rule, total probability, Bayes’ theorem, and independence.',ready:false,outro:'',beats:[]},
 {id:'p2',title:'Discrete Random Variables',sub:'Pmf and cdf, expectation and variance, indicators and linearity; Bernoulli, binomial, geometric, categorical, and Poisson.',ready:false,outro:'',beats:[]},
 {id:'p3',title:'Continuous Random Variables',sub:'Densities as limits of histograms; uniform, exponential, Gaussian, and lognormal; transforming a variable with the $|g\'|$ factor.',ready:false,outro:'',beats:[]},
 {id:'p4',title:'Joint Distributions',sub:'Marginals and conditionals, covariance and correlation, the covariance matrix, the multivariate Gaussian, and the Jacobian density formula.',ready:false,outro:'',beats:[]},
 {id:'p5',title:'Limit Theorems & Monte Carlo',sub:'Markov, Chebyshev, and Hoeffding; the law of large numbers; the central limit theorem; Monte Carlo and importance sampling; fat tails.',ready:false,outro:'',beats:[]},
 {id:'p6',title:'Information Theory',sub:'Entropy, cross-entropy, KL divergence, mutual information, and perplexity — and softmax with cross-entropy as the loss of a language model.',ready:false,outro:'',beats:[]},
 {id:'p7',title:'Random Walks & Poisson Processes',sub:'Gambler’s ruin and the $(q/p)^z$ catch-up probability, Poisson arrivals, and the attacker calculation from the Bitcoin paper.',ready:false,outro:'',beats:[]},
 {id:'p8',title:'Markov Chains & Hidden Markov Models',sub:'Transition matrices, stationary distributions as eigenvectors, regime models, the forward algorithm and Viterbi, and expected value in MDPs.',ready:false,outro:'',beats:[]},
 {id:'p9',title:'Filtering: Bayes, Kalman & Particle Filters',sub:'Tracking a hidden state through noisy measurements: the Bayes filter, the Kalman filter, and particle filters.',ready:false,outro:'',beats:[]},
 {id:'p10',title:'Bayesian Networks',sub:'Factorizing a joint distribution over a graph, d-separation, variable elimination, and sampling-based inference.',ready:false,outro:'',beats:[]},
 {id:'p11',title:'Estimation',sub:'Maximum likelihood, MAP and priors as regularization, conjugate updating and Thompson sampling, and least squares as Gaussian MLE.',ready:false,outro:'',beats:[]},
 {id:'p12',title:'Latent Variables & Variational Inference',sub:'Mixture models and EM, the ELBO, the reparameterization trick, and the score-function gradient.',ready:false,outro:'',beats:[]},
 {id:'p13',title:'Statistical Inference',sub:'Sampling distributions, confidence intervals, hypothesis tests and p-values, the t-test, and the statistics of a Sharpe ratio.',ready:false,outro:'',beats:[]},
 {id:'a1',addon:'A1',title:'Regression in Depth',sub:'Least squares as projection, standard errors, $R^2$, and out-of-sample validation.',ready:false,outro:'',beats:[]},
 {id:'a2',addon:'A2',title:'Time Series & Cointegration',sub:'Stationarity, autocorrelation, AR(1) and mean-reversion half-life, the ADF test, and cointegration for pairs trading.',ready:false,outro:'',beats:[]},
 {id:'a3',addon:'A3',title:'Trading Performance & Kelly',sub:'Log versus simple returns, drawdowns, Kelly sizing as log-growth maximization, and bootstrap backtests.',ready:false,outro:'',beats:[]},
 {id:'a4',addon:'A4',title:'Monte Carlo in Depth',sub:'Markov chain Monte Carlo: Metropolis–Hastings, Gibbs sampling, and Hamiltonian Monte Carlo.',ready:false,outro:'',beats:[]},
];
function setHints(a){hints=a||[];hintIdx=0;hintBtn.style.display=hints.length?'block':'none';}
function unlock(){if(unlocked)return;unlocked=true;contBtn.disabled=false;}
function flash(t){flashEl.textContent=t||'✓';flashEl.className='flash show';setTimeout(()=>flashEl.className='flash',1100);}
function addReveal(html){const r=document.createElement('div');r.className='reveal';r.innerHTML=html;stage.querySelector('.card').appendChild(r);renderMath(r);unlock();}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function scrollTop(){try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){}}
function renderMath(el){try{if(window.renderMathInElement)renderMathInElement(el||stage,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false});}catch(e){}}
const SAVE_KEY='prob_fp_v1';
function saveState(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({view,curM,beat,completed}));}catch(e){}}
function loadState(){try{return JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){return null;}}
/* URL-hash position (survives refresh even when storage is blocked) */
function setHash(){try{const h=view==='module'?('#m'+curM+'b'+beat):'';if((location.hash||'')!==h)history.replaceState(null,'',h||location.pathname+location.search);}catch(e){}}
function parseHash(){const m=/^#m(\d+)b(\d+)$/.exec(location.hash||'');return m?{curM:+m[1],beat:+m[2]}:null;}

function renderMenu(){
  view='menu';footer.style.display='none';hintbox.className='hintbox';hintbox.innerHTML='';
  document.getElementById('backBtn').style.display='none';document.getElementById('pbarWrap').style.display='none';
  document.getElementById('kick').className='kick course';document.getElementById('kick').textContent='Probability, from First Principles';
  document.getElementById('stepLbl').textContent='';
  let html=`<div class="card"><h1>Probability, from First Principles</h1><p class="lede">A self-contained probability course, built on the calculus and linear-algebra courses: every rule is derived, and every distribution is built, sampled, and watched on screen. It runs from counting and conditioning through random variables, limit theorems, and information theory, into stochastic processes, estimation, and inference — the probability behind modern machine learning, the Bitcoin paper, and quantitative trading. Guided discovery, real proofs, worked problems.</p></div>`;
  MODULES.forEach((m,i)=>{const done=completed[m.id];const st=done?['done','✓ Done']:(m.ready?['todo','Start']:['soon','Soon']);
    html+=`<div class="card mcard${m.ready?'':' lock'}" data-i="${i}"><div class="mtop"><span class="mnum">${m.addon?'Add-on '+m.addon:'Module '+(i+1)}</span><span class="mstat ${st[0]}">${st[1]}</span></div>
      <div class="mtitle">${m.title}</div><div class="msub">${m.sub}</div></div>`;});
  stage.innerHTML=html;
  stage.querySelectorAll('.mcard').forEach(c=>{const i=parseInt(c.dataset.i);if(MODULES[i].ready)c.onclick=()=>openModule(i);});
  scrollTop();renderMath();saveState();setHash();
}
function openModuleAt(i,b){curM=i;beat=b;view='module';footer.style.display='flex';contBtn.style.display='';hintBtn.style.display='';
  document.getElementById('backBtn').style.display='block';document.getElementById('pbarWrap').style.display='block';
  document.getElementById('kick').className='kick';renderBeat();}
function openModule(i){openModuleAt(i,0);}
function renderBeat(){
  unlocked=false;contBtn.disabled=true;hintbox.className='hintbox';hintbox.innerHTML='';setHints([]);stage.innerHTML='';
  const M=MODULES[curM];M.beats[beat]();
  document.getElementById('kick').textContent=M.title;
  document.getElementById('stepLbl').textContent=(beat+1)+' / '+M.beats.length;
  document.getElementById('pfill').style.width=Math.round((beat+1)/M.beats.length*100)+'%';
  contBtn.textContent=beat===M.beats.length-1?'Finish':'Continue';document.getElementById('prevBtn').style.display=(beat>0||recallReturn)?'block':'none';scrollTop();renderMath();saveState();setHash();
}
hintBtn.onclick=()=>{if(hintIdx<hints.length){hintbox.innerHTML=hints[hintIdx];hintbox.className='hintbox show';hintIdx++;if(hintIdx>=hints.length)unlock();}};
contBtn.onclick=()=>{const M=MODULES[curM];if(beat<M.beats.length-1){beat++;renderBeat();}else finish();};
document.getElementById('backBtn').onclick=renderMenu;
document.getElementById('prevBtn').onclick=()=>{if(recallReturn){curM=recallReturn.mod;beat=recallReturn.beat;recallReturn=null;renderBeat();return;}if(beat>0){beat--;renderBeat();}};
function finish(){const M=MODULES[curM];completed[M.id]=true;const next=(curM+1<MODULES.length&&MODULES[curM+1].ready)?MODULES[curM+1]:null;
  footer.style.display='none';document.getElementById('pfill').style.width='100%';
  stage.innerHTML=`<div class="card" style="text-align:center;padding:30px 18px"><div style="font-size:40px">✦</div><h2 style="margin-top:8px">Module complete</h2><p>${M.outro}</p>
    <div style="display:flex;gap:10px;margin-top:14px">${next?`<button class="btn primary" id="nx">Next →</button>`:''}<button class="btn ghost" id="mn" style="${next?'':'flex:1'}">Back to menu</button></div></div>`;
  const nx=document.getElementById('nx');if(nx)nx.onclick=()=>openModule(curM+1);document.getElementById('mn').onclick=renderMenu;scrollTop();renderMath();saveState();}

/* ============ function-plotting engine ============ */
function plot(cv,o){const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height;
  const xmin=o.xmin,xmax=o.xmax,ymin=o.ymin,ymax=o.ymax;
  const px=x=>(x-xmin)/(xmax-xmin)*W, py=y=>H-(y-ymin)/(ymax-ymin)*H;
  const mx=X=>xmin+X/W*(xmax-xmin), my=Y=>ymin+(H-Y)/H*(ymax-ymin);
  function grid(){if(!ctx)return;ctx.clearRect(0,0,W,H);ctx.strokeStyle='#16202f';ctx.lineWidth=1;
    for(let x=Math.ceil(xmin);x<=xmax;x++){ctx.beginPath();ctx.moveTo(px(x),0);ctx.lineTo(px(x),H);ctx.stroke();}
    for(let y=Math.ceil(ymin);y<=ymax;y++){ctx.beginPath();ctx.moveTo(0,py(y));ctx.lineTo(W,py(y));ctx.stroke();}
    ctx.strokeStyle='#2b3a4f';ctx.lineWidth=1.5;
    if(ymin<0&&ymax>0){ctx.beginPath();ctx.moveTo(0,py(0));ctx.lineTo(W,py(0));ctx.stroke();}
    if(xmin<0&&xmax>0){ctx.beginPath();ctx.moveTo(px(0),0);ctx.lineTo(px(0),H);ctx.stroke();}}

/* ---------- Beat 1: what a probability is ---------- */
function p0_intro(){
  stage.innerHTML=`<div class="card"><h2>What a probability is</h2>
    <p>Roll a fair six-sided die. Before it lands the result is unknown; afterwards it is one of six faces. A procedure like this — one that can be repeated, and whose result is not fixed in advance — is a <b>random experiment</b>. One run of it is a <b>trial</b>, and the result of a trial is an <b>outcome</b>.</p>
    <div class="defn"><span class="dt">The first objects</span>
      <b>Outcome</b> $\\omega$ — one possible result of a trial; here a face, so $\\omega$ is one of $1,2,3,4,5,6$.<br>
      <b>Sample space</b> $\\Omega$ — the set of all outcomes: $\\Omega=\\{1,2,3,4,5,6\\}$.<br>
      <b>Event</b> $A$ — a yes-or-no question about the outcome, recorded as the set of outcomes that answer yes. "The roll is at least 5" is the event $A=\\{5,6\\}$, a subset of $\\Omega$.<br>
      <b>Probability</b> $P$ — a rule whose input is an event and whose output is a number, $P(A)$. Which number, and why, is the subject of this beat.</div>
    <p>Run the experiment many times and keep score. After $n$ rolls, let $n_A$ be the number of rolls on which $A$ happened. The fraction $n_A/n$ is the <b>relative frequency</b> of $A$: the share of the trials on which it occurred. Pick an event, roll, and watch that share.</p>
    <div class="seg" id="segev"></div>
    <div class="seg" id="segroll" style="margin-top:7px"></div>
    <canvas id="cvf" width="640" height="300" style="margin-top:10px"></canvas>
    <p class="small" style="margin-top:6px">The path is the running share $n_A/n$ after every roll. The horizontal axis counts rolls on a log scale — 1, 10, 100, 1000, 10000 — so the early swings and the late settling both fit. The dashed gold line is where the path settles.</p>
    <canvas id="cvb" width="640" height="220"></canvas>
    <p class="small" style="margin-top:6px">Each bar is one face's share of all the rolls so far. Faces in the chosen event are gold.</p>
    <div class="readout"><div class="rdc"><div class="k">rolls n</div><div class="v" id="rn">0</div></div><div class="rdc"><div class="k">event happened n_A</div><div class="v" id="ra">0</div></div><div class="rdc"><div class="k">share n_A / n</div><div class="v" id="rs">—</div></div><div class="rdc"><div class="k">six bars added</div><div class="v" id="rt">—</div></div></div>
    <p style="margin-top:14px">After one roll the share can only be 0 or 1. Each new roll changes it by at most $1/n$, so as $n$ grows the swings shrink and the path flattens toward a fixed level. That level is the probability of the event:</p>
    <div class="eqbox">$$P(A)\;=\;\\text{the value the share }\\frac{n_A}{n}\\text{ settles at as }n\\text{ grows}.$$</div>
    <p>Now watch the last readout while rolling: the six bars add to exactly $1$, every time. Each roll lands on exactly one face, so the six counts add to $n$ and the six shares add to $n/n=1$ — at every $n$, not only in the limit. Probabilities are the values these shares settle at, so they keep the same two properties:</p>
    <div class="defn"><span class="dt">Why probabilities live between 0 and 1, and total 1</span>
      <b>$0\\le P(A)\\le1$.</b> A share of the trials is never negative and never more than all of them. $P(A)=1$ means $A$ happens on all of the trials in the long run; $P(A)=0$, on none of them.<br>
      <b>The outcomes' probabilities add to $1$.</b> Each trial has exactly one outcome, so the outcomes split the trials between them with nothing left over and nothing counted twice. The $1$ stands for "all of the trials" — a whole split into shares. Writing $100\\%$ says the same thing.</div>
    <p>Long-run share is one reading of a probability. The other is a <b>degree of belief</b>, a number attached to something that happens only once: whether an attacker overtakes the honest chain, whether a trading strategy's edge is real. Both readings obey the same rules; Module 2 (Bayes' theorem) and Module 12 (estimation) work mostly in the second.</p>
    <div class="task"><b>Find where the share settles</b>For a fair die, what value does the share of rolls with "roll ≥ 5" settle at? Roll a few thousand times to see it, then pin down the exact value. Enter a fraction or a decimal.</div>
    ${gateHTML('e.g. 1/4 or 0.25')}</div>`;

  const EV=[['six','roll = 6',[6]],['ge5','roll ≥ 5',[5,6]],['even','even',[2,4,6]],['any','any face',[1,2,3,4,5,6]]];
  let ev=EV[1],rolls=[];const MAXN=20000;
  const cvf=document.getElementById('cvf'),cvb=document.getElementById('cvb');
  const pf=plot(cvf,{xmin:-0.18,xmax:4.42,ymin:-0.06,ymax:1.08}),pb=plot(cvb,{xmin:0.35,xmax:6.65,ymin:-0.03,ymax:0.62});
  function draw(){const n=rolls.length,inA=f=>ev[2].indexOf(f)>=0,p=ev[2].length/6;
    pf.grid();pf.hline(p,'#e8b84b',true);
    ['1','10','100','1000','10000'].forEach((s,i)=>pf.label(i+0.03,0.0,s,'#5d6f85'));
    let na=0;const ctx=pf.ctx;
    if(ctx&&n){ctx.strokeStyle='#7ab8ff';ctx.lineWidth=2;ctx.beginPath();
      for(let i=0;i<n;i++){if(inA(rolls[i]))na++;const X=pf.px(Math.log10(i+1)),Y=pf.py(na/(i+1));if(i)ctx.lineTo(X,Y);else ctx.moveTo(X,Y);}ctx.stroke();
      pf.point(Math.log10(n),na/n,'#7ab8ff',4);}
    else{for(let i=0;i<n;i++)if(inA(rolls[i]))na++;}
    const cnt=[0,0,0,0,0,0,0];rolls.forEach(f=>cnt[f]++);
    pb.grid();pb.hline(1/6,'#5d6f85',true);let tot=0;
    for(let f=1;f<=6;f++){const s=n?cnt[f]/n:0;tot+=s;
      if(pb.ctx){pb.ctx.fillStyle=inA(f)?'#e8b84b':'#3d5a80';pb.ctx.fillRect(pb.px(f-0.34),pb.py(s),pb.px(f+0.34)-pb.px(f-0.34),pb.py(0)-pb.py(s));}
      pb.label(f-0.07,0.57,String(f),'#9fb0c4');}
    document.getElementById('rn').textContent=n;document.getElementById('ra').textContent=na;
    document.getElementById('rs').textContent=n?(na/n).toFixed(4):'—';
    document.getElementById('rt').textContent=n?tot.toFixed(4):'—';}
  const segev=document.getElementById('segev');
  segev.innerHTML=EV.map(e=>`<span class="segb${e===ev?' on':''}" data-k="${e[0]}">${e[1]}</span>`).join('');
  segev.querySelectorAll('.segb').forEach(b=>b.onclick=()=>{ev=EV.find(e=>e[0]===b.dataset.k);segev.querySelectorAll('.segb').forEach(x=>x.classList.toggle('on',x===b));draw();});
  const segr=document.getElementById('segroll');const RB=[['1','+1 roll'],['10','+10'],['100','+100'],['1000','+1000'],['0','reset']];
  segr.innerHTML=RB.map(r=>`<span class="segb" data-n="${r[0]}">${r[1]}</span>`).join('');
  segr.querySelectorAll('.segb').forEach(b=>b.onclick=()=>{const k=+b.dataset.n;if(!k)rolls=[];else for(let i=0;i<k&&rolls.length<MAXN;i++)rolls.push(1+Math.floor(Math.random()*6));draw();});
  draw();

  numChk(document.getElementById('gate'),1/3,()=>{addReveal(`<div class="rh">✓ 1/3</div>
    <p>A fair die gives no face an advantage, so the six faces take equal shares of the total. Call each face's probability $p$. The six shares add to 1: $6p=1$, so $p=\\tfrac16$. The event $\\{5,6\\}$ collects two of those shares:</p>
    <div class="eqbox">$$P(\\text{roll}\\ge5)=\\tfrac16+\\tfrac16=\\tfrac26=\\tfrac13\\approx0.333.$$</div>
    <p>That is the level the simulated share closes in on. The same two steps — equal shares, and a total of 1 — give the general rule whenever every outcome is equally likely: writing $|A|$ for the number of outcomes in $A$, $P(A)=\\dfrac{|A|}{|\\Omega|}$. Probability becomes counting, and counting is the rest of this module.</p>`);},
    snapTo(1/3,0.0015));
  setHints([`A fair die gives every face the same share, and the six shares add to 1.`,`Each face has 1/6. The event "roll ≥ 5" contains two faces.`]);
}

/* ---------- Beat 2: where the probability sits ---------- */
function p0_shapes(){
  stage.innerHTML=`<div class="card"><h2>Where the probability sits: lists, lines, and planes</h2>
    <p>Picture each trial as a dot placed at its outcome. Run $N$ trials and there are $N$ dots; the probability of a region of outcomes is the share of the dots that land in it, once $N$ is large. Every probability is a statement about where the dots pile up.</p>
    <p>What changes from problem to problem is the <b>shape</b> of the sample space $\\Omega$ the dots land in, and that shape decides how the shares are added up. Step through the three shapes, and then through what happens when the outcomes are relabeled.</p>
    <div class="seg" id="segst"></div>
    <canvas id="cv" width="640" height="320" style="margin-top:10px"></canvas>
    <canvas id="cv3" width="640" height="330" style="margin-top:8px;display:none"></canvas>
    <div class="ctrls" id="ctl"></div>
    <div class="readout" id="rd"></div>
    <div id="cap" style="margin-top:12px"></div>
    <div class="task"><b>Keep the total at 1</b>In step 4, drag the tips until $A=\\left[\\begin{smallmatrix}2&0\\\\0&3\\end{smallmatrix}\\right]$: gold tip at $(2,0)$, blue tip at $(0,3)$. What height must the slab have for its volume — the total probability — to stay 1? Enter a fraction or a decimal.</div>
    ${gateHTML('e.g. 1/4 or 0.25')}</div>`;

  const cv=document.getElementById('cv'),cv3=document.getElementById('cv3'),ctl=document.getElementById('ctl'),rd=document.getElementById('rd'),cap=document.getElementById('cap');
  /* fixed samples: each is one trial */
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
  const NG=3000,geo=[];for(let i=0;i<NG;i++){let k=1;while(rnd()<0.5&&k<40)k++;geo.push(k);}
  const NL=4000,wait=[];for(let i=0;i<NL;i++)wait.push(-10*Math.log(1-rnd()));
  const NP=1200,pts=[];for(let i=0;i<NP;i++)pts.push([rnd(),rnd()]);
  const STEPS=[['list','1 · List'],['line','2 · Line'],['plane','3 · Plane'],['map','4 · Change coordinates']];
  let st='list',K=3,units='min',binI=0,bcut=10,c1=[1,0],c2=[0,1],pl=null,dragTip=-1;
  const BINS=[10,5,2,1];

  function arrow(x0,y0,x1,y1,col,w){const ctx=pl&&pl.ctx;if(!ctx)return;const X0=pl.px(x0),Y0=pl.py(y0),X1=pl.px(x1),Y1=pl.py(y1);
    ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w||3;ctx.beginPath();ctx.moveTo(X0,Y0);ctx.lineTo(X1,Y1);ctx.stroke();
    if(Math.hypot(X1-X0,Y1-Y0)<4)return;const a=Math.atan2(Y1-Y0,X1-X0),h=12;ctx.beginPath();ctx.moveTo(X1,Y1);
    ctx.lineTo(X1-h*Math.cos(a-0.4),Y1-h*Math.sin(a-0.4));ctx.lineTo(X1-h*Math.cos(a+0.4),Y1-h*Math.sin(a+0.4));ctx.closePath();ctx.fill();}
  function rdc(k,id){return `<div class="rdc"><div class="k">${k}</div><div class="v" id="${id}">—</div></div>`;}
  function set(id,v){const e=document.getElementById(id);if(e)e.textContent=v;}
  function meter(frac){const ctx=pl&&pl.ctx;if(!ctx)return;const x0=10,w=pl.W-20,y=8,h=12;
    ctx.fillStyle='#16202f';ctx.fillRect(x0,y,w,h);ctx.fillStyle='#e8b84b';ctx.fillRect(x0,y,w*Math.max(0,Math.min(1,frac)),h);
    ctx.strokeStyle='#2b3a4f';ctx.lineWidth=1;ctx.strokeRect(x0,y,w,h);}
  const fmt=v=>(Math.abs(v-Math.round(v))<1e-9?String(Math.round(v)):v.toFixed(4));

  /* 3-D view: isometric projection, density drawn as a height above the plane */
  const CX=150,CY=250,AX=52,AY=14,BX=40,BY=-16,CZ=70;
  const P3=(x,y,z)=>[CX+x*AX+y*BX,CY+x*AY+y*BY-z*CZ];
  function draw3(){const ctx=cv3.getContext&&cv3.getContext('2d');if(!ctx)return;ctx.clearRect(0,0,cv3.width,cv3.height);
    const line=(a,b,col,w,dash)=>{ctx.strokeStyle=col;ctx.lineWidth=w||1;ctx.setLineDash(dash||[]);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.setLineDash([]);};
    for(let x=-1;x<=4;x++)line(P3(x,-0.5,0),P3(x,3.5,0),'#16202f');
    for(let y=0;y<=3;y++)line(P3(-1,y,0),P3(4,y,0),'#16202f');
    line(P3(-1,0,0),P3(4,0,0),'#2b3a4f',1.5);line(P3(0,-0.5,0),P3(0,3.5,0),'#2b3a4f',1.5);
    line(P3(0,0,0),P3(0,0,2.5),'#2b3a4f',1.5);
    const font='600 12px '+getComputedStyle(document.body).fontFamily;ctx.font=font;ctx.fillStyle='#5d6f85';
    let q=P3(4.05,0,0);ctx.fillText('x',q[0]+4,q[1]+4);q=P3(0,3.6,0);ctx.fillText('y',q[0]+4,q[1]);q=P3(0,0,2.55);ctx.fillText('density (height)',q[0]-50,q[1]-4);
    const sq=[[0,0],[1,0],[1,1],[0,1]];
    sq.forEach((a,i)=>{const b=sq[(i+1)%4];line(P3(a[0],a[1],0),P3(b[0],b[1],0),'#5d6f85',1.2,[5,4]);});
    const A=st==='map'?[c1,c2]:[[1,0],[0,1]];const det=A[0][0]*A[1][1]-A[0][1]*A[1][0],ar=Math.abs(det);
    const base=[[0,0],A[0],[A[0][0]+A[1][0],A[0][1]+A[1][1]],A[1]];
    if(ar<1e-9){line(P3(0,0,0),P3(base[2][0],base[2][1],0),'#e2664f',3);ctx.fillStyle='#e2664f';q=P3(base[2][0],base[2][1],0);ctx.fillText('flattened: no area, no slab',q[0]+6,q[1]-6);return;}
    const h=1/ar,hd=Math.min(h,2.4);
    const depth=p=>p[0]*AY+p[1]*BY;
    const faces=[];for(let i=0;i<4;i++){const a=base[i],b=base[(i+1)%4];faces.push({d:depth([(a[0]+b[0])/2,(a[1]+b[1])/2]),pts:[P3(a[0],a[1],0),P3(b[0],b[1],0),P3(b[0],b[1],hd),P3(a[0],a[1],hd)]});}
    faces.sort((u,v)=>u.d-v.d);
    const poly=(ps,fill,stroke)=>{ctx.beginPath();ps.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=1.2;ctx.stroke();};
    poly(base.map(p=>P3(p[0],p[1],0)),'rgba(232,184,75,.12)','#e8b84b');
    faces.forEach(f=>poly(f.pts,'rgba(232,184,75,.30)','#c99a3a'));
    poly(base.map(p=>P3(p[0],p[1],hd)),'rgba(232,184,75,.55)','#e8b84b');
    const top=P3(base[2][0],base[2][1],hd);ctx.fillStyle='#e8b84b';ctx.font=font;
    ctx.fillText('height '+(h<10?h.toFixed(4):h.toFixed(1))+(h>2.4?' (drawn cut off)':''),Math.min(top[0]+8,cv3.width-170),Math.max(16,top[1]-6));
    ctx.fillStyle='#9fb0c4';ctx.fillText('volume = height × base area = '+fmt(h)+' × '+fmt(ar)+' = 1',12,cv3.height-10);}

  function setup(){
    cv.height=(st==='plane'||st==='map')?520:320;cv3.style.display=(st==='plane'||st==='map')?'block':'none';
    ctl.innerHTML='';
    if(st==='list'){pl=plot(cv,{xmin:0.3,xmax:12.7,ymin:-0.03,ymax:0.62});
      rd.innerHTML=rdc('chosen K','r1')+rdc('P(head by toss K)','r2')+rdc('share of dots','r3')+rdc('all p_k added','r4');
      cap.innerHTML=`<p><b>A list of outcomes.</b> Toss a fair coin until the first head and record $k$, the number of tosses used. Then $\\Omega=\\{1,2,3,\\dots\\}$: infinitely many outcomes, but they can be listed one after another. Each of the ${NG} trials drops a dot on its $k$, and the blue bars show the share of dots at each $k$.</p>
        <p>The first toss is a head half the time, so $P(k=1)=\\tfrac12$. The value $k=2$ needs a tail and then a head: half of a half, $\\tfrac14$. In general $k$ needs $k-1$ tails and then a head, so its probability is $p_k=(\\tfrac12)^k$ — the gold ticks, which the bars sit on.</p>
        <p>On a list, each outcome carries its own probability $p_k$, an ordinary number, and an event's probability is a <b>sum</b>. <b>Drag across the plot</b> to choose $K$. The gold bars form the event "the first head comes by toss $K$", and the meter fills to its probability, a geometric sum with ratio $\\tfrac12$:</p>
        <div class="eqbox">$$\\sum_{k=1}^{K}\\big(\\tfrac12\\big)^k=\\tfrac12\\cdot\\frac{1-(\\tfrac12)^K}{1-\\tfrac12}=1-\\big(\\tfrac12\\big)^K.$$</div>
        <p>It reaches 1 only as $K\\to\\infty$. On a listable sample space the total is an infinite series, and the series must converge to exactly 1.</p>`;}
    else if(st==='line'){
      ctl.innerHTML=`<div class="seg" id="segu" style="margin:0"></div><div class="seg" id="segw" style="margin:0"></div>`;
      rd.innerHTML=rdc('bin width','r1')+rdc('P(wait ≤ b)','r2')+rdc('share of dots ≤ b','r3')+rdc('height f(0)','r4');
      cap.innerHTML=`<p><b>A line of outcomes.</b> Record the waiting time $t$ until the next Bitcoin block. Blocks arrive about every 10 minutes on average, and $t$ follows the curve $f(t)=\\tfrac1{10}e^{-t/10}$ (Module 8 derives it). Now $\\Omega=[0,\\infty)$, a whole interval of real numbers. The ticks along the bottom are 300 of the ${NL} dots. No two land at exactly the same point, and the share landing at exactly $t=10.000\\ldots$ is zero: single outcomes carry no probability, so there is nothing to list.</p>
        <p>Instead, group the dots into bins of width $w$ and divide each bin's share by its width, giving the share <em>per minute</em>. Make the bins finer: the bars get narrower but no shorter, and they settle onto a curve. That curve is the <b>density</b> $f(t)$, probability per unit of $t$. A probability over an interval is (share per minute) $\\times$ (minutes), an <b>area</b> under $f$:</p>
        <div class="eqbox">$$P(a\\le t\\le b)=\\int_a^b f(t)\\,dt,\\qquad P(t\\le b)=\\int_0^b \\tfrac1{10}e^{-t/10}\\,dt=1-e^{-b/10}.$$</div>
        <p><b>Drag</b> to set $b$; the shaded area and the share of dots left of $b$ agree. The whole area is 1.</p>
        <p>Switch the units to hours. Every waiting time is divided by 60, so the same dots crowd into an interval 60 times shorter, and the share per unit of length rises 60-fold: the height at $0$ jumps from $0.1$ to $6$. A density's height depends on the units and can exceed 1. Areas — the probabilities — do not change.</p>`;
      const segu=document.getElementById('segu'),segw=document.getElementById('segw');
      segu.innerHTML=[['min','minutes'],['hr','hours']].map(u=>`<span class="segb${u[0]===units?' on':''}" data-u="${u[0]}">${u[1]}</span>`).join('');
      segw.innerHTML=BINS.map((b,i)=>`<span class="segb${i===binI?' on':''}" data-i="${i}">w = ${b} min</span>`).join('');
      segu.querySelectorAll('.segb').forEach(b=>b.onclick=()=>{units=b.dataset.u;segu.querySelectorAll('.segb').forEach(x=>x.classList.toggle('on',x===b));mkLinePlot();draw();});
      segw.querySelectorAll('.segb').forEach(b=>b.onclick=()=>{binI=+b.dataset.i;segw.querySelectorAll('.segb').forEach(x=>x.classList.toggle('on',x===b));draw();});
      mkLinePlot();}
    else if(st==='plane'){pl=mapPlot();
      rd.innerHTML=rdc('dots','r1')+rdc('area covered','r2')+rdc('density (height)','r3')+rdc('volume','r4');
      cap.innerHTML=`<p><b>A plane of outcomes.</b> Throw a dart that lands uniformly at random in the unit square. The outcome is a point $(x,y)$ — two numbers at once — and $\\Omega$ is the square $[0,1]\\times[0,1]$. The ${NP} dots spread evenly over it.</p>
        <p>Here the density is probability per unit <em>area</em>: the share of dots in a small patch, divided by the patch's area. Uniform means it is the same everywhere. All of the dots lie in an area of 1, so the density is $1$ per unit area.</p>
        <p>To draw a density over a plane takes a third axis. The two floor axes are the outcome $(x,y)$, and the density is a <b>height above the floor</b> (lower picture). A probability is (share per area) $\\times$ (area), which is the <b>volume</b> of the solid standing over a region $R$ — a double integral, $P(R)=\\iint_R f\\,dA$. For the dart, a slab of height 1 on a base of area 1 has volume 1.</p>`;}
    else {pl=mapPlot();
      rd.innerHTML=rdc('det A','r1')+rdc('base area |det A|','r2')+rdc('dots in dashed cell','r3')+rdc('slab height','r4');
      cap.innerHTML=`<p><b>Changing coordinates.</b> Describe the same darts in new coordinates — new units, or new axes mixing the old two — by applying a linear map $A$ to every point. <b>Drag either column tip</b> (it snaps to quarter steps). The columns are $A\\mathbf e_1$ (gold) and $A\\mathbf e_2$ (blue), the images of the square's two edges. A dot at $(u,v)$ moves to $u\\,A\\mathbf e_1+v\\,A\\mathbf e_2$, so the square lands on the parallelogram the columns span, whose area is $|\\det A|$.</p>
        <p>The dots move, but none is created or destroyed: they are the same ${NP} trials under new labels, so the total probability is still 1. They now cover more area, so they are sparser. The dashed cell has area 1; the number of dots inside it, divided by ${NP}, is the new density — the old density divided by $|\\det A|$. In the lower picture the slab widens and flattens so its volume stays 1.</p>
        <p>This is the minutes-to-hours effect from step 2, one dimension up. There, squeezing the line by a factor of $\\tfrac1{60}$ multiplied the height by 60; here, stretching areas by $|\\det A|$ divides the height by $|\\det A|$.</p>`;}
    renderMath(cap);draw();
  }
  function mkLinePlot(){pl=units==='min'?plot(cv,{xmin:-1.5,xmax:50,ymin:-0.012,ymax:0.135}):plot(cv,{xmin:-0.025,xmax:50/60,ymin:-0.72,ymax:8.1});}
  function mapPlot(){return plot(cv,{xmin:-1.25,xmax:4.25,ymin:-0.75,ymax:-0.75+5.5*520/640});}

  function draw(){const ctx=pl.ctx;
    if(st==='list'){pl.grid();let obs=0;const cnt={};geo.forEach(k=>{cnt[k]=(cnt[k]||0)+1;if(k<=K)obs++;});
      for(let k=1;k<=12;k++){const s=(cnt[k]||0)/NG,p=Math.pow(0.5,k);
        if(ctx){ctx.fillStyle=k<=K?'#e8b84b':'#3d5a80';ctx.fillRect(pl.px(k-0.34),pl.py(s),pl.px(k+0.34)-pl.px(k-0.34),pl.py(0)-pl.py(s));
          ctx.strokeStyle='#ffd27a';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(pl.px(k-0.42),pl.py(p));ctx.lineTo(pl.px(k+0.42),pl.py(p));ctx.stroke();}
        pl.label(k-0.12,0.565,String(k),'#9fb0c4');}
      pl.vline(K+0.5,'#3a4c66',true);const P=1-Math.pow(0.5,K);meter(P);
      set('r1',String(K));set('r2',P.toFixed(4));set('r3',(obs/NG).toFixed(4));set('r4','1');}
    else if(st==='line'){pl.grid();const s=units==='min'?1:1/60,w=BINS[binI]*s,lam=units==='min'?0.1:6;
      const f=x=>x>=0?lam*Math.exp(-lam*x):NaN,b=bcut*s,xmax=50*s;
      if(ctx){for(let x0=0;x0<xmax;x0+=w){let c=0;for(let i=0;i<NL;i++){const t=wait[i]*s;if(t>=x0&&t<x0+w)c++;}const hgt=c/NL/w;

/* ---------- Beat 4: sample spaces and events (two dice) ---------- */
function p0_events(){
  stage.innerHTML=`<div class="card"><h2>Sample spaces and events: two dice</h2>
    <p>Roll two fair dice, one <span style="color:#e2664f;font-weight:650">red</span> and one <span class="cy" style="font-weight:650">blue</span>. Two numbers come out of every trial, so name both before going further.</p>
    <div class="defn"><span class="dt">The objects</span>
      $r$ — the face on the red die, one of $1,\\dots,6$.<br>
      $b$ — the face on the blue die, one of $1,\\dots,6$.<br>
      <b>Outcome</b> $\\omega=(r,b)$ — an <em>ordered</em> pair: red first, blue second. $(5,6)$ means red 5, blue 6; $(6,5)$ is a different outcome.<br>
      <b>Sample space</b> $\\Omega=\\{(r,b):\\ r,b\\in\\{1,\\dots,6\\}\\}$. Each of the 6 red faces pairs with each of the 6 blue faces, so $|\\Omega|=6\\cdot6=36$.</div>
    <p>Two quantities are free here, $r$ and $b$, so the sample space is naturally a $6\\times6$ grid: red face across, blue face up, one cell per outcome. Every trial drops a dot into exactly one cell. Roll, and watch the dots spread.</p>
    <div class="seg" id="segroll"></div>
    <div class="seg" id="segview" style="margin-top:7px"></div>
    <canvas id="cvs" width="640" height="600" style="margin-top:10px"></canvas>
    <div class="readout"><div class="rdc"><div class="k">rolls n</div><div class="v" id="rn">0</div></div><div class="rdc"><div class="k">a 5 and a 6, either order</div><div class="v" id="r56">—</div></div><div class="rdc"><div class="k">two 6s</div><div class="v" id="r66">—</div></div><div class="rdc"><div class="k">ratio</div><div class="v" id="rr">—</div></div></div>
    <p style="margin-top:14px">Nothing favors one ordered pair over another: each red face is equally likely, each blue face is equally likely, and the dice are rolled separately (Module 2 makes "separately" precise as <em>independence</em>). So the 36 cells take equal shares of the total: each outcome has probability $\\tfrac1{36}$. Think of each cell as a pebble of mass $\\tfrac1{36}$; the probability of any collection of outcomes is the mass of its pebbles.</p>
    <p>Now switch the view to <b>both white</b>. With two identical dice, a roll can only be recorded as an unordered result such as $\\{5,6\\}$. There are 21 such results: 6 doubles and 15 mixed pairs. They are <em>not</em> equally likely. The result $\\{5,6\\}$ is the roll $(5,6)$ or the roll $(6,5)$ — two cells, two pebbles — while $\\{6,6\\}$ is the single cell $(6,6)$. Painting the dice white changes what gets written down, not how they fall. Roll a few thousand times: "a 5 and a 6" comes up about twice as often as "two 6s", near $\\tfrac2{36}\\approx0.056$ against $\\tfrac1{36}\\approx0.028$.</p>
    <p>That is the rule for choosing a sample space: describe each outcome in enough detail that symmetry makes the outcomes equally likely. Recording less detail is allowed, but then each recorded result is a <em>collection</em> of equally likely outcomes, and must be weighed by how many it contains.</p>

    <h2 style="margin-top:22px">Events are subsets</h2>
    <p>An <b>event</b> is a yes-or-no question about the outcome, recorded as the set of outcomes that answer yes. "The sum is 7" is the event $\\{(1,6),(2,5),(3,4),(4,3),(5,2),(6,1)\\}$, a subset of $\\Omega$. An event <b>occurs</b> on a trial when that trial's outcome lands inside it. With equally likely outcomes, writing $|A|$ for the number of outcomes in $A$,</p>
    <div class="eqbox">$$P(A)=\\frac{|A|}{|\\Omega|}=\\frac{|A|}{36}.$$</div>
    <p>Questions combine with the words <em>not</em>, <em>and</em>, <em>or</em>, and each word is an operation on sets. For events $A$ and $B$ (both subsets of $\\Omega$):</p>
    <div class="defn"><span class="dt">Three operations</span>
      <b>Complement</b> — "not $A$": $A^{c}=\\{\\omega\\in\\Omega:\\ \\omega\\notin A\\}$, every outcome outside $A$.<br>
      <b>Intersection</b> — "$A$ and $B$": $A\\cap B=\\{\\omega:\\ \\omega\\in A\\text{ and }\\omega\\in B\\}$, the outcomes in both.<br>
      <b>Union</b> — "$A$ or $B$": $A\\cup B=\\{\\omega:\\ \\omega\\in A\\text{ or }\\omega\\in B\\}$, the outcomes in at least one. In probability "or" always includes "both".</div>
    <p>Pick two events and an operation below. Cells in $A$ carry a gold corner mark, cells in $B$ a blue one, and the cells in the combined event are filled. Setting $A$ to <b>tap cells</b> lets you build any event by tapping outcomes.</p>
    <div class="slabel" style="margin-top:12px">A =</div><div class="seg" id="segA" style="margin-top:4px"></div>
    <div class="slabel" style="margin-top:10px">B =</div><div class="seg" id="segB" style="margin-top:4px"></div>
    <div class="slabel" style="margin-top:10px">show</div><div class="seg" id="segop" style="margin-top:4px"></div>
    <canvas id="cve" width="640" height="600" style="margin-top:10px"></canvas>
    <p class="small" id="opw" style="margin-top:8px;color:#e8b84b;min-height:20px"></p>
    <div class="readout"><div class="rdc"><div class="k">cells in event</div><div class="v" id="ek">—</div></div><div class="rdc"><div class="k">P = cells / 36</div><div class="v" id="ep">—</div></div><div class="rdc"><div class="k">share of your rolls</div><div class="v" id="es">—</div></div></div>
    <p style="margin-top:14px">Everyday phrasing translates into these operations, and the translation is most of the work in a word problem:</p>
    <div style="overflow-x:auto;margin:10px 0"><table style="width:100%;border-collapse:collapse;font-size:14px;line-height:1.5">
      <tr style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px"><td style="padding:6px 8px;border-bottom:1px solid var(--line)">in words</td><td style="padding:6px 8px;border-bottom:1px solid var(--line)">as sets</td></tr>
      <tr><td style="padding:6px 8px;border-bottom:1px solid var(--line)">not $A$</td><td style="padding:6px 8px;border-bottom:1px solid var(--line)">$A^{c}$</td></tr>
      <tr><td style="padding:6px 8px;border-bottom:1px solid var(--line)">$A$ and $B$</td><td style="padding:6px 8px;border-bottom:1px solid var(--line)">$A\\cap B$</td></tr>
      <tr><td style="padding:6px 8px;border-bottom:1px solid var(--line)">$A$ or $B$ (or both); at least one of $A,B$</td><td style="padding:6px 8px;border-bottom:1px solid var(--line)">$A\\cup B$</td></tr>
      <tr><td style="padding:6px 8px;border-bottom:1px solid var(--line)">$A$ but not $B$</td><td style="padding:6px 8px;border-bottom:1px solid var(--line)">$A\\setminus B=A\\cap B^{c}$</td></tr>
      <tr><td style="padding:6px 8px;border-bottom:1px solid var(--line)">exactly one of $A,B$</td><td style="padding:6px 8px;border-bottom:1px solid var(--line)">$(A\\setminus B)\\cup(B\\setminus A)$</td></tr>
      <tr><td style="padding:6px 8px;border-bottom:1px solid var(--line)">neither $A$ nor $B$</td><td style="padding:6px 8px;border-bottom:1px solid var(--line)">$(A\\cup B)^{c}=A^{c}\\cap B^{c}$</td></tr>
      <tr><td style="padding:6px 8px;border-bottom:1px solid var(--line)">$A$ and $B$ cannot both happen</td><td style="padding:6px 8px;border-bottom:1px solid var(--line)">$A\\cap B=\\varnothing$ (<b>disjoint</b>, or mutually exclusive)</td></tr>
      <tr><td style="padding:6px 8px">whenever $A$ happens, so does $B$</td><td style="padding:6px 8px">$A\\subseteq B$</td></tr>
    </table></div>
    <p>Two of these deserve a check on the grid. Set $A$ = doubles, $B$ = sum = 7 and show $A\\cap B$: it is empty, because a double has an even sum. Those two events are disjoint. Then show $(A\\cup B)^{c}$ and $A^{c}\\cap B^{c}$ in turn, for any choice of $A$ and $B$: the same cells fill both times. "Not ($A$ or $B$)" and "not $A$ and not $B$" are the same question, and swapping "or" for "and" under a complement holds in general — <b>De Morgan's laws</b>:</p>
    <div class="eqbox">$$(A\\cup B)^{c}=A^{c}\\cap B^{c},\\qquad (A\\cap B)^{c}=A^{c}\\cup B^{c}.$$</div>

    <h2 style="margin-top:22px">Outcomes versus events: the sum</h2>
    <p>The sum $r+b$ runs from 2 to 12, but those 11 values are not 11 equally likely outcomes. Each value is an event — a whole anti-diagonal of the grid — and the anti-diagonals have different lengths. <b>Tap or drag across the bars</b> to pick a sum $s$. The gold outlines are the exact probabilities $|\\{r+b=s\\}|/36$; the blue bars are the shares among your rolls.</p>
    <canvas id="cvh" width="640" height="300"></canvas>
    <div class="readout"><div class="rdc"><div class="k">chosen sum s</div><div class="v" id="hs">—</div></div><div class="rdc"><div class="k">cells with r + b = s</div><div class="v" id="hk">—</div></div><div class="rdc"><div class="k">all 11 sums added</div><div class="v" id="ht">—</div></div></div>
    <p class="small" id="hl" style="margin-top:8px"></p>
    <p style="margin-top:12px">The 11 sum events are pairwise disjoint (no roll has two sums) and together they cover $\\Omega$ (every roll has a sum). A family of events with both properties is a <b>partition</b> of $\\Omega$, and since it splits the 36 pebbles without overlap or leftovers, its probabilities add to exactly 1: $\\tfrac{1+2+3+4+5+6+5+4+3+2+1}{36}=1$. Combining two uniform quantities produced one that is far from uniform — the most common sum, 7, is six times as likely as 2 or 12.</p>
    <div class="task"><b>At least one six</b>Roll two dice. What is the probability that at least one of them shows a 6? Translate the question into sets, build it on the second grid, and enter a fraction or a decimal.</div>
    ${gateHTML('e.g. 5/36 or 0.139')}</div>`;

  /* ---- shared rolls ---- */

  const font='600 14px '+getComputedStyle(document.body).fontFamily,fontS='600 11px '+getComputedStyle(document.body).fontFamily;

  let pa='dbl',pb='s10',op='AuB';const tapSet=new Set();

        if(inP(pa,r,b)){ctx.fillStyle='#e8b84b';ctx.beginPath();ctx.moveTo(c[0]+2,c[1]+2);ctx.lineTo(c[0]+2+s,c[1]+2);ctx.lineTo(c[0]+2,c[1]+2+s);ctx.closePath();ctx.fill();}
        if(inP(pb,r,b)){ctx.fillStyle='#7ab8ff';ctx.beginPath();ctx.moveTo(c[0]+c[2]-2,c[1]+2);ctx.lineTo(c[0]+c[2]-2-s,c[1]+2);ctx.lineTo(c[0]+c[2]-2,c[1]+2+s);ctx.closePath();ctx.fill();}}
      frame(pe);ctx.font=fontS;ctx.fillStyle='#5d6f85';
      for(let r=1;r<=6;r++)for(let b=1;b<=6;b++)ctx.fillText('('+r+','+b+')',pe.px(r)-17,pe.py(b)+5);
      axes(pe);}
    set('ek',k+' of 36');set('ep',k+'/36 = '+(k/36).toFixed(4));set('es',rolls.length?(hit/rolls.length).toFixed(4):'—');
    set('opw',words());}

  /* ---- canvas H: the sum ---- */
  let sSel=7;
  function drawH(){const ctx=ph.ctx,n=rolls.length;const sc=[];for(let s=0;s<=12;s++)sc.push(0);
    for(let r=1;r<=6;r++)for(let b=1;b<=6;b++)sc[r+b]+=cnt[r][b];
    let tot=0;
    if(ctx){ctx.clearRect(0,0,ph.W,ph.H);ctx.strokeStyle='#16202f';ctx.lineWidth=1;for(let y=0.05;y<0.2;y+=0.05){ctx.beginPath();ctx.moveTo(0,ph.py(y));ctx.lineTo(ph.W,ph.py(y));ctx.stroke();}}
    for(let s=2;s<=12;s++){const k=6-Math.abs(s-7),p=k/36;tot+=p;
      if(ctx){const x0=ph.px(s-0.36),w=ph.px(s+0.36)-x0;
        if(n){const sh=sc[s]/n;ctx.fillStyle=s===sSel?'rgba(122,184,255,.95)':'rgba(61,90,128,.85)';ctx.fillRect(x0+4,ph.py(sh),w-8,ph.py(0)-ph.py(sh));}
        ctx.strokeStyle='#e8b84b';ctx.lineWidth=s===sSel?3:1.6;ctx.strokeRect(x0,ph.py(p),w,ph.py(0)-ph.py(p));
        ctx.font=font;ctx.fillStyle=s===sSel?'#e8b84b':'#9fb0c4';ctx.fillText(String(s),ph.px(s)-(s>9?8:4),ph.py(-0.022));}}
    const k=6-Math.abs(sSel-7),cells=[];for(let r=1;r<=6;r++){const b=sSel-r;if(b>=1&&b<=6)cells.push('('+r+','+b+')');}
    set('hs',String(sSel));set('hk',k+' of 36');set('ht',(tot).toFixed(4));
    set('hl','r + b = '+sSel+':  '+cells.join('  ')+(n?'   ·   share of your rolls: '+(sc[sSel]/n).toFixed(4):''));}

  function set(id,v){const e=document.getElementById(id);if(e)e.textContent=v;}
  function redraw(){drawS();drawE();drawH();}

  /* ---- controls ---- */
  function mkSeg(id,items,cur,on){const el=document.getElementById(id);
    el.innerHTML=items.map(it=>`<span class="segb${it[0]===cur?' on':''}" data-k="${it[0]}">${it[1]}</span>`).join('');
    el.querySelectorAll('.segb').forEach(b=>b.onclick=()=>{el.querySelectorAll('.segb').forEach(x=>x.classList.toggle('on',x===b));on(b.dataset.k);});}
  mkSeg('segroll',[['1','+1 roll'],['10','+10'],['100','+100'],['1000','+1000'],['0','reset']],null,k=>{
    const m=+k;if(!m){rolls=[];cnt.forEach(row=>row.fill(0));}
    else for(let i=0;i<m&&rolls.length<MAXN;i++){const r=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);rolls.push([r,b,(Math.random()-0.5)*0.74,(Math.random()-0.5)*0.5-0.08]);cnt[r][b]++;}
    document.querySelectorAll('#segroll .segb').forEach(x=>x.classList.remove('on'));redraw();});
  mkSeg('segview',[['color','red & blue: 36 outcomes'],['white','both white: 21 results']],view,k=>{view=k;drawS();});
  mkSeg('segA',PRE.map(p=>[p[0],p[1]]),pa,k=>{pa=k;drawE();});
  mkSeg('segB',PRE.filter(p=>p[0]!=='tap').map(p=>[p[0],p[1]]),pb,k=>{pb=k;drawE();});
  mkSeg('segop',OPS,op,k=>{op=k;drawE();});

  function canvasXY(cv,e){const rc=cv.getBoundingClientRect();const w=Math.max(1,rc.width),h=rc.height||w*cv.height/cv.width;
    return [(e.clientX-rc.left)*(cv.width/w),(e.clientY-rc.top)*(cv.height/h)];}
  cve.addEventListener('pointerdown',e=>{if(pa!=='tap')return;const [X,Y]=canvasXY(cve,e);const r=Math.round(pe.mx(X)),b=Math.round(pe.my(Y));
    if(r<1||r>6||b<1||b>6)return;const key=r*10+b;if(tapSet.has(key))tapSet.delete(key);else tapSet.add(key);drawE();e.preventDefault();});
  let hdown=false;cvh.style.touchAction='none';
  const hset=e=>{const [X]=canvasXY(cvh,e);sSel=Math.max(2,Math.min(12,Math.round(ph.mx(X))));drawH();};
  cvh.addEventListener('pointerdown',e=>{hdown=true;try{cvh.setPointerCapture(e.pointerId);}catch(x){}hset(e);e.preventDefault();});
  cvh.addEventListener('pointermove',e=>{if(hdown){e.preventDefault();hset(e);}});
  const hend=()=>hdown=false;cvh.addEventListener('pointerup',hend);cvh.addEventListener('pointercancel',hend);
  redraw();

  numChk(document.getElementById('gate'),11/36,()=>{addReveal(`<div class="rh">✓ 11/36 ≈ 0.306</div>
    <p>"At least one six" means red is 6, or blue is 6, or both: the union $A\\cup B$ with $A=\\{r=6\\}$ and $B=\\{b=6\\}$. On the grid, $A$ is the red-6 column (6 cells) and $B$ is the blue-6 row (6 cells). They share one cell, $(6,6)$, so the union has $6+6-1=11$ cells, and $P=\\tfrac{11}{36}$.</p>
    <p>Adding $\\tfrac16+\\tfrac16=\\tfrac{12}{36}$ counts the cell $(6,6)$ twice, once in each event. Subtracting the overlap repairs it, $|A\\cup B|=|A|+|B|-|A\\cap B|$, the first case of <b>inclusion–exclusion</b>, developed later in this module.</p>
    <p>The complement gives the same answer with no overlap to track. By De Morgan, "not (red 6 or blue 6)" is "red not 6 and blue not 6": $r$ and $b$ each range over $1,\\dots,5$, a $5\\times5$ block of 25 cells. So</p>
    <div class="eqbox">$$P(\\text{at least one }6)=1-P(\\text{no }6)=1-\\tfrac{25}{36}=\\tfrac{11}{36}.$$</div>
    <p>With $n$ dice the complement stays a single block, $5^n$ of the $6^n$ outcomes, so $P(\\text{at least one }6)=1-(\\tfrac56)^n$, while the direct count would need overlaps among $n$ events. "At least one" questions are nearly always answered through "none". The same step sizes up the birthday problem and hash collisions later in this module, and it is the arithmetic behind <b>multiple testing</b>: if 20 strategies with no real edge are each backtested, and each has a 5% chance of looking significant by luck, then — when the tests do not influence each other — the chance that at least one looks significant is $1-0.95^{20}\\approx0.64$ (Module 14).</p>`);},
    snapTo(11/36,0.0015));
  setHints([`“At least one six” means red = 6, or blue = 6, or both: an “or” question. In the second grid, set A to red = 6, B to blue = 6, and show A ∪ B.`,
    `A ∪ B is the red-6 column (6 cells) plus the blue-6 row (6 cells), which share the cell (6,6): 6 + 6 − 1 = 11 cells out of 36.`]);
}

/* ================= boot ================= */
window.onerror=function(m,s,l){console.error(m,l);};
function bootRestore(){const s=loadState();
  if(s&&s.completed)Object.assign(completed,s.completed);
  const hp=parseHash();
  let t=null;
  if(hp&&MODULES[hp.curM]&&MODULES[hp.curM].ready)t={curM:hp.curM,beat:hp.beat};
  else if(s&&s.view==='module'&&typeof s.curM==='number'&&MODULES[s.curM]&&MODULES[s.curM].ready)t={curM:s.curM,beat:s.beat};
  if(t){const b=Math.max(0,Math.min(t.beat|0,MODULES[t.curM].beats.length-1));openModuleAt(t.curM,b);}
  else renderMenu();}
bootRestore();
window.addEventListener('load',()=>renderMath());
window.addEventListener('DOMContentLoaded',()=>renderMath());
</script>
