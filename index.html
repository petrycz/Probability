<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Calculus, from First Principles</title>
<style>
  :root{--bg:#0d1420;--grid:#172233;--panel:#131d2c;--panel2:#182437;--ink:#e9eef6;
    --muted:#8095ab;--muted2:#5d6f85;--accent:#7ab8ff;--good:#3fb98f;--good2:#1e4a3d;--bad:#e2664f;--bad2:#4a2620;
    --gold:#e8b84b;--line:#243347;--rad:15px;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:26px 26px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;}
  .wrap{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 14px calc(24px + env(safe-area-inset-bottom));}
  header{position:sticky;top:0;z-index:10;padding:calc(12px + env(safe-area-inset-top)) 0 9px;background:linear-gradient(var(--bg) 80%,transparent);}
  .htop{display:flex;align-items:center;gap:10px;margin-bottom:9px;min-height:24px;}
  .back{color:var(--accent);font-size:14px;cursor:pointer;font-weight:500;padding:4px 2px;}
  .kick{font-weight:600;font-size:12px;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .kick.course{color:var(--accent);text-transform:uppercase;letter-spacing:.7px;font-size:11px;}
  .step{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);}
  .pbar{height:5px;border-radius:4px;background:var(--panel);overflow:hidden;border:1px solid var(--line);}
  .pbar i{display:block;height:100%;background:var(--accent);transition:width .3s;}
  main{flex:1;}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--rad);padding:18px 15px;box-shadow:0 16px 38px -26px rgba(0,0,0,.8);animation:in .3s cubic-bezier(.2,.7,.2,1);margin-top:6px;}
  @keyframes in{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:none;}}
  h1{font-weight:800;font-size:22px;letter-spacing:-.4px;margin:2px 2px 6px;line-height:1.2;}
  h2{font-weight:750;font-size:19px;letter-spacing:-.3px;margin:0 0 11px;line-height:1.28;}
  .lede{color:var(--muted);font-size:14px;line-height:1.55;margin:0 2px 15px;}
  p{font-size:15.5px;line-height:1.62;color:#d6e0ee;margin:0 0 13px;}
  p.small{font-size:13.5px;color:var(--muted);}
  em{color:var(--ink);font-style:italic;} b,strong{color:var(--ink);font-weight:650;}
  .mono{font-family:var(--mono);color:var(--accent);font-size:.94em;}
  .cy{color:var(--accent);} .gld{color:var(--gold);} .grn{color:var(--good);} .rd{color:var(--bad);}
  .eqbox{font-family:var(--mono);font-size:14.5px;line-height:1.8;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0;color:#dbe6f4;overflow-x:auto;}
  .eqbox .hl{color:var(--gold);}
  .mathrow{text-align:center;margin:14px 0;font-family:var(--mono);font-size:15px;overflow-x:auto;white-space:nowrap;}
  sub,sup{font-size:.72em;}
  canvas{width:100%;height:auto;display:block;border-radius:12px;background:#0a111b;border:1px solid var(--line);touch-action:none;}
  .readout{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .rdc{flex:1;min-width:78px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;}
  .rdc .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .rdc .v{font-family:var(--mono);font-weight:700;font-size:16px;margin-top:2px;}
  .ctrls{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap;}
  .slabel{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:74px;}
  input[type=range]{flex:1;min-width:140px;accent-color:var(--accent);height:30px;}
  .task{background:rgba(232,184,75,.08);border:1px solid rgba(232,184,75,.28);border-radius:11px;padding:12px 13px;margin:14px 0;font-size:14.5px;line-height:1.55;color:#f0e2c2;}
  .task b{color:var(--gold);font-size:11px;letter-spacing:.5px;text-transform:uppercase;display:block;margin-bottom:5px;}
  .defn{background:rgba(122,184,255,.07);border:1px solid rgba(122,184,255,.30);border-radius:11px;padding:12px 14px;margin:13px 0;font-size:14.5px;line-height:1.6;color:#dbe6f4;}
  .defn .dt{color:var(--accent);font-size:11px;letter-spacing:.5px;text-transform:uppercase;display:block;margin-bottom:6px;font-weight:700;}
  .defn+.defn{margin-top:9px;}
  .entry{display:flex;gap:9px;align-items:center;margin-top:12px;}
  .entry input{flex:1;background:var(--panel2);border:1.5px solid var(--line);border-radius:11px;color:var(--ink);font-family:var(--mono);font-size:16px;padding:12px 13px;outline:none;min-width:0;}
  .entry input:focus{border-color:var(--accent);}
  .miniout{margin-top:9px;font-size:13.5px;line-height:1.5;} .miniout.ok{color:var(--good);} .miniout.no{color:var(--bad);}
  .choices{display:grid;grid-template-columns:1fr;gap:9px;margin-top:13px;}
  .seg{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 2px;}
  .segb{font-family:var(--mono);font-size:13px;font-weight:600;padding:9px 12px;border-radius:9px;background:var(--panel2);border:1.5px solid var(--line);color:var(--muted);cursor:pointer;}
  .segb.on{border-color:var(--accent);color:var(--accent);background:#0e2530;}
  .ucircle{position:relative;}
  .choice{background:var(--panel2);border:1.5px solid var(--line);border-radius:11px;padding:13px;cursor:pointer;font-size:14px;line-height:1.4;transition:.12s;}
  .choice .cm{font-family:var(--mono);}
  .choice.correct{border-color:var(--good);background:var(--good2);color:#c7f4e3;} .choice.wrong{border-color:var(--bad);background:var(--bad2);color:#f6cdc4;} .choice.dim{opacity:.45;} .choice.locked{cursor:default;}
  .code{background:#0a1019;border:1px solid var(--line);border-radius:11px;margin:13px 0;overflow:hidden;}
  .code .ch{font-family:var(--mono);font-size:11px;color:var(--muted);padding:7px 12px;border-bottom:1px solid var(--line);background:#0c131e;letter-spacing:.4px;}
  .code pre{margin:0;padding:12px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#cfe0f2;-webkit-overflow-scrolling:touch;}
  .prob{border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin:13px 0;background:var(--panel2);}
  .prob .ph{font-weight:700;font-size:13px;color:var(--accent);letter-spacing:.3px;margin-bottom:7px;}
  .prob .lvl{float:right;font-size:10px;color:var(--muted2);border:1px solid var(--line);border-radius:20px;padding:1px 7px;letter-spacing:.4px;}
  details{margin-top:10px;border-top:1px dashed var(--line);padding-top:9px;}
  summary{cursor:pointer;color:var(--gold);font-size:13px;font-weight:600;list-style:none;}
  summary::-webkit-details-marker{display:none;} summary::before{content:'▸ ';}
  details[open] summary::before{content:'▾ ';}
  .sol{font-size:14px;line-height:1.6;color:#d0dcea;margin-top:9px;} .sol p{font-size:14px;margin:0 0 9px;}
  .reveal{margin-top:15px;border-left:3px solid var(--good);background:rgba(63,185,143,.07);border-radius:0 11px 11px 0;padding:12px 14px;animation:in .3s ease;}
  .reveal .rh{font-weight:750;font-size:13px;color:var(--good);margin-bottom:6px;}
  .reveal p{font-size:14px;color:#d7e6df;margin:0 0 8px;} .reveal p:last-child{margin:0;}
  .reveal .note{font-family:var(--mono);font-size:13px;color:var(--accent);}
  .flash{position:fixed;left:50%;top:calc(16% + env(safe-area-inset-top));transform:translateX(-50%);background:var(--good);color:#06231a;font-weight:750;font-size:14px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;z-index:50;}
  .flash.show{animation:flash 1.1s ease;}
  @keyframes flash{0%{opacity:0;transform:translate(-50%,6px);}15%{opacity:1;transform:translate(-50%,0);}80%{opacity:1;}100%{opacity:0;transform:translate(-50%,-8px);}}
  footer{position:sticky;bottom:0;padding:11px 0 calc(6px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 32%);display:flex;gap:10px;align-items:center;}
  .btn{font-weight:650;font-size:15px;border:none;border-radius:11px;padding:14px 18px;cursor:pointer;transition:.1s;font-family:var(--sans);}
  .btn:active{transform:scale(.98);}
  .btn.primary{flex:1;background:var(--accent);color:#08131b;} .btn.primary:disabled{background:var(--panel2);color:var(--muted2);cursor:default;}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .btn.hint{background:transparent;color:var(--gold);border:1px solid var(--line);}
  .hintbox{font-size:13.5px;line-height:1.55;color:#f0e2c2;background:rgba(232,184,75,.08);border:1px solid rgba(232,184,75,.25);border-radius:10px;padding:11px 13px;margin-top:12px;display:none;}
  .hintbox.show{display:block;}
  .mcard{cursor:pointer;transition:border-color .15s,transform .08s;} .mcard.lock{opacity:.55;cursor:default;}
  .mtop{display:flex;align-items:center;gap:9px;} .mnum{font-family:var(--mono);font-size:12px;color:var(--muted2);}
  .mstat{margin-left:auto;font-weight:650;font-size:11px;padding:3px 9px;border-radius:999px;}
  .mstat.done{color:var(--good);background:var(--good2);} .mstat.todo{color:var(--accent);background:rgba(122,184,255,.14);} .mstat.soon{color:var(--muted2);background:#141e2c;}
  .mtitle{font-weight:750;font-size:17px;margin:8px 0 5px;} .msub{color:var(--muted);font-size:13.5px;line-height:1.5;}
  .rvlink{color:var(--gold);cursor:pointer;font-size:12px;white-space:nowrap;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;}}
  .katex{font-size:1.03em;}
  .eqbox .katex-display{margin:0;}
  .eqbox .katex-display>.katex{white-space:normal;}
</style>

<body>
<div class="wrap">
  <header>
    <div class="htop"><span class="back" id="backBtn" style="display:none">‹ Menu</span><span class="kick course" id="kick">Calculus, from First Principles</span><span class="step" id="stepLbl"></span></div>
    <div class="pbar" id="pbarWrap" style="display:none"><i id="pfill" style="width:0%"></i></div>
  </header>
  <main><div id="stage"></div><div class="hintbox" id="hintbox"></div></main>
  <footer id="footer" style="display:none"><button class="btn ghost" id="prevBtn" style="display:none">Back</button><button class="btn hint" id="hintBtn">Hint</button><button class="btn primary" id="contBtn" disabled>Continue</button></footer>
</div>
<div class="flash" id="flash">✓</div>
<script>
"use strict";
const stage=document.getElementById('stage'),hintBtn=document.getElementById('hintBtn'),contBtn=document.getElementById('contBtn'),
      hintbox=document.getElementById('hintbox'),flashEl=document.getElementById('flash'),footer=document.getElementById('footer');
let view='menu',curM=0,beat=0,unlocked=false,hints=[],hintIdx=0,recallReturn=null;
const completed={};
const MODULES=[
 {id:'c0',title:'Functions & the Building Blocks',sub:'From algebra: what a function is, the building-block library, composition, exponentials/logs, and trig on the unit circle.',ready:true,
  outro:`Every function calculus touches is here — polynomials, powers, rationals, roots, exponentials, logs, and trig defined on the unit circle — plus composition, the seed of the chain rule. Nothing beyond algebra was assumed.`,
  beats:[c0_intro,c0_library,c0_compose,c0_explog,c0_trig,c0_problems]},
 {id:'c1',title:'Limits & Continuity',sub:'The ε-δ foundation: what it means to approach a value, and when a function has no breaks.',ready:true,
  outro:`A limit is the value a function approaches — made rigorous by the ε-δ challenge. Continuity is "the limit equals the value," and it powers the Intermediate Value Theorem. Everything in calculus is built on this.`,
  beats:[c1_recall,c1_intro,c1_intuitive,c1_epsdelta,c1_laws,c1_indet,c1_continuity,c1_infinity,c1_problems]},
 {id:'c2',title:'The Derivative',sub:'Instantaneous rate of change as a limit; the rules and the chain rule.',ready:true,
  outro:`A derivative is one specific limit — the secant slope as the gap closes. Every rule (power via binomial, product/quotient via add-and-subtract, chain, sin/cos via the squeeze limit) is derived from that one definition. eˣ and ln wait for the integral in Module 6.`,
  beats:[c2_recall,c2_intro,c2_slopefn,c2_notation,c2_powerrule,c2_prodquot,c2_chain,c2_trig,c2_diffcont,c2_problems]},
 {id:'c3',title:'Applications of the Derivative',sub:'Extrema, the Mean Value Theorem, optimization, related rates, L\u2019H\u00f4pital.',ready:true,
  outro:`The derivative's sign maps where a function rises and falls; its zeros locate the peaks and valleys; the second derivative reads concavity. The Mean Value Theorem ties average rate to instantaneous, and optimization, related rates, and L\u2019H\u00f4pital's rule are the payoff. Every result rode on the one limit from Module 3.`,
  beats:[c3_recall,c3_intro,c3_critical,c3_firsttest,c3_concavity,c3_mvt,c3_optimization,c3_relatedrates,c3_lhopital,c3_problems]},
 {id:'c4',title:'Integration & the FTC',sub:'Riemann sums, the definite integral, and the Fundamental Theorem of Calculus.',ready:true,
  outro:`The definite integral is the limit of Riemann sums — accumulated signed area. The Fundamental Theorem ties it to differentiation: the area-so-far function has derivative $f$ (Part 1), so any antiderivative evaluates the integral by $F(b)-F(a)$ (Part 2). That let us define $\\ln x := \\int_1^x \\tfrac{dt}{t}$, fill the $n=-1$ gap in the power rule, and pin down $e$ and $e^x$ at last — rigorously, from area.`,
  beats:[c4_recall,c4_intro,c4_riemann,c4_defint,c4_ftc1,c4_antideriv,c4_ftc2,c4_ln,c4_e,c4_problems]},
 {id:'c5',title:'Techniques & Applications of Integration',sub:'Substitution, parts, partial fractions, improper integrals; area, volume, arc length.',ready:true,
  outro:`Integration is a craft, and now you have the toolbox: substitution reverses the chain rule, parts reverses the product rule, partial fractions breaks a hard rational into easy pieces, and improper integrals extend the idea to infinite regions via limits. Then the payoff — area between curves, volumes of revolution, and arc length — is all one move: slice, express the piece as an integrand, and integrate.`,
  beats:[c5_recall,c5_intro,c5_usub,c5_parts,c5_partialfrac,c5_improper,c5_area,c5_volume,c5_arclength,c5_problems]},
 {id:'c6',title:'Sequences & Series',sub:'Convergence tests, power series, and Taylor/Maclaurin expansions.',ready:true,
  outro:`An infinite sum converges when its partial sums settle to a finite limit. The geometric series is the model; the nth-term, integral, and ratio tests decide the rest — echoing the improper-integral knife-edge. Power series are polynomials of infinite degree, and Taylor series rebuild $e^x$, $\\sin x$, and $\\cos x$ from their derivatives at a single point.`,
  beats:[c6_recall,c6_intro,c6_sequences,c6_geometric,c6_nthterm,c6_integraltest,c6_ratiotest,c6_powerseries,c6_taylor,c6_problems]},
 {id:'c7',title:'Multivariable Differentiation',sub:'Surfaces and contour maps, partial derivatives, the tangent plane, the gradient, directional derivatives, and the multivariable chain rule.',ready:true,
  outro:`Several inputs, one idea at a time: a partial derivative is the slope of a slice, the tangent plane is the local flat approximation built from those slopes, the gradient packs them into the steepest-uphill vector perpendicular to the contours, the directional derivative reads the slope in any direction as $\\nabla f\\cdot\\mathbf u$, and the chain rule threads rates through a composition — the exact engine of backpropagation.`,
  beats:[c7_recall,c7_intro,c7_partials,c7_tangentplane,c7_gradient,c7_directional,c7_chainrule,c7_problems]},
 {id:'c8',title:'Multivariable Optimization',sub:'Critical points and gradient descent, the local quadratic model and the Hessian, the second-derivative test, convexity, Newton’s method, and Lagrange multipliers.',ready:true,
  outro:`Optimization is calculus hunting for the best point: $\\nabla f=\\mathbf 0$ locates the flat spots, the Taylor quadratic model and its Hessian say whether each is a bowl, dome, or saddle, convexity guarantees a single global minimum, gradient descent and Newton’s method walk to it, and Lagrange multipliers handle a constraint. This is the mathematical core of training a model.`,
  beats:[c8_recall,c7_critical,c7_graddescent,c7_taylor,c7_secondderiv,c7_convexity,c7_newton,c7_lagrange,c7_optproblems]},
 {id:'c9',title:'Multiple Integrals',sub:'Double integrals as volume, iterated integrals and Fubini, polar coordinates, and change of variables via the Jacobian.',ready:true,
  outro:`A double integral accumulates a function over a 2-D region — volume under a surface — computed as iterated single integrals (Fubini). Polar coordinates and the general change of variables, with its Jacobian area factor, make round and warped regions tractable.`,
  beats:[c7_recall10,c7_doubleint,c7_iterated,c7_polar,c7_jacobian,c7_intproblems]},
 {id:'c10',title:'Vector Calculus',sub:'Vector fields, line & surface integrals, and the Green/Stokes/divergence theorems.',ready:true,
  outro:`A vector field assigns an arrow to every point; the gradient was the first example. The rest of the subject measures a field along paths and over surfaces, and the Green, Stokes, and divergence theorems lift the Fundamental Theorem of Calculus into two and three dimensions.`,
  beats:[c10_recall,c10_fields,c10_notation,c10_line,c10_conservative,c10_curl,c10_green,c10_divflux,c10_greenflux,c10_surface,c10_stokes,c10_divergence,c10_problems]},
 {id:'c11',title:'Matrix Calculus',sub:'Derivatives of scalar-by-vector and vector-by-vector — gradients, Jacobians, and the chain rule in matrix form: the bridge to machine learning.',ready:true,
  outro:`The derivative of a vector-valued map is the Jacobian — the grid of every partial $\\partial y_i/\\partial x_j$ — with the gradient (scalar out) and the plain $f'$ as its small cases. Composing maps multiplies Jacobians, inner dimensions meeting like links in a chain; a short table of identities ($\\partial(Ax)/\\partial x=A$, quadratic forms, elementwise $\\Rightarrow$ diagonal) covers the pieces; and backpropagation is that product swept right-to-left from a scalar loss — one multiply of upstream gradient by local derivative at every node. This is the language machine-learning papers are written in.`,
  beats:[c11_recall,c11_shapes,c11_chain,c11_identities,c11_backprop,c11_problems]},
];
function setHints(a){hints=a||[];hintIdx=0;hintBtn.style.display=hints.length?'block':'none';}
function unlock(){if(unlocked)return;unlocked=true;contBtn.disabled=false;}
function flash(t){flashEl.textContent=t||'✓';flashEl.className='flash show';setTimeout(()=>flashEl.className='flash',1100);}
function addReveal(html){const r=document.createElement('div');r.className='reveal';r.innerHTML=html;stage.querySelector('.card').appendChild(r);renderMath(r);unlock();}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function scrollTop(){try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){}}
function renderMath(el){try{if(window.renderMathInElement)renderMathInElement(el||stage,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false});}catch(e){}}
const SAVE_KEY='calc_fp_v2';
function saveState(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({view,curM,beat,completed}));}catch(e){}}
function loadState(){try{return JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){return null;}}
/* URL-hash position (survives refresh even when storage is blocked) */
function setHash(){try{const h=view==='module'?('#m'+curM+'b'+beat):'';if((location.hash||'')!==h)history.replaceState(null,'',h||location.pathname+location.search);}catch(e){}}
function parseHash(){const m=/^#m(\d+)b(\d+)$/.exec(location.hash||'');return m?{curM:+m[1],beat:+m[2]}:null;}

function renderMenu(){
  view='menu';footer.style.display='none';hintbox.className='hintbox';hintbox.innerHTML='';
  document.getElementById('backBtn').style.display='none';document.getElementById('pbarWrap').style.display='none';
  document.getElementById('kick').className='kick course';document.getElementById('kick').textContent='Calculus, from First Principles';
  document.getElementById('stepLbl').textContent='';
  let html=`<div class="card"><h1>Calculus, from First Principles</h1><p class="lede">A self-contained calculus course, built from the ground up: every rule and theorem is derived, nothing is assumed beyond basic algebra. It runs from limits through single-variable, multivariable, and vector calculus, and on into matrix calculus — the bridge to machine learning. Guided discovery, real proofs, worked problems.</p></div>`;
  MODULES.forEach((m,i)=>{const done=completed[m.id];const st=done?['done','✓ Done']:(m.ready?['todo','Start']:['soon','Soon']);
    html+=`<div class="card mcard${m.ready?'':' lock'}" data-i="${i}"><div class="mtop"><span class="mnum">Module ${i+1}</span><span class="mstat ${st[0]}">${st[1]}</span></div>
      <div class="mtitle">${m.title}</div><div class="msub">${m.sub}</div></div>`;});
  stage.innerHTML=html;
  stage.querySelectorAll('.mcard').forEach(c=>{const i=parseInt(c.dataset.i);if(MODULES[i].ready)c.onclick=()=>openModule(i);});
  scrollTop();renderMath();saveState();setHash();
}
function openModuleAt(i,b){curM=i;beat=b;view='module';footer.style.display='flex';contBtn.style.display='';hintBtn.style.display='';
  document.getElementById('backBtn').style.display='block';document.getElementById('pbarWrap').style.display='block';
  document.getElementById('kick').className='kick';renderBeat();}
function openModule(i){openModuleAt(i,0);}
function renderBeat(){
  unlocked=false;contBtn.disabled=true;hintbox.className='hintbox';hintbox.innerHTML='';setHints([]);stage.innerHTML='';
  const M=MODULES[curM];M.beats[beat]();
  document.getElementById('kick').textContent=M.title;

/* ============ function-plotting engine ============ */
function plot(cv,o){const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height;
  const xmin=o.xmin,xmax=o.xmax,ymin=o.ymin,ymax=o.ymax;
  const px=x=>(x-xmin)/(xmax-xmin)*W, py=y=>H-(y-ymin)/(ymax-ymin)*H;
  const mx=X=>xmin+X/W*(xmax-xmin), my=Y=>ymin+(H-Y)/H*(ymax-ymin);
  function grid(){if(!ctx)return;ctx.clearRect(0,0,W,H);ctx.strokeStyle='#16202f';ctx.lineWidth=1;
    for(let x=Math.ceil(xmin);x<=xmax;x++){ctx.beginPath();ctx.moveTo(px(x),0);ctx.lineTo(px(x),H);ctx.stroke();}
    for(let y=Math.ceil(ymin);y<=ymax;y++){ctx.beginPath();ctx.moveTo(0,py(y));ctx.lineTo(W,py(y));ctx.stroke();}
    ctx.strokeStyle='#2b3a4f';ctx.lineWidth=1.5;
    if(ymin<0&&ymax>0){ctx.beginPath();ctx.moveTo(0,py(0));ctx.lineTo(W,py(0));ctx.stroke();}
    if(xmin<0&&xmax>0){ctx.beginPath();ctx.moveTo(px(0),0);ctx.lineTo(px(0),H);ctx.stroke();}}
  function curve(f,color,lw){if(!ctx)return;ctx.strokeStyle=color;ctx.lineWidth=lw||2.5;let prevY=null,started=false;const span=ymax-ymin;ctx.beginPath();
    const N=500;for(let i=0;i<=N;i++){const x=xmin+(xmax-xmin)*i/N;let y;try{y=f(x);}catch(e){y=NaN;}
      if(!isFinite(y)||y>ymax+span*3||y<ymin-span*3){started=false;prevY=y;continue;}
      if(prevY!=null&&isFinite(prevY)&&Math.abs(y-prevY)>span*1.4){started=false;}
      const X=px(x),Y=py(y);if(!started){ctx.moveTo(X,Y);started=true;}else ctx.lineTo(X,Y);prevY=y;}
    ctx.stroke();}
  function point(x,y,color,r,hollow){if(!ctx)return;ctx.lineWidth=2.5;ctx.strokeStyle=color;
    ctx.beginPath();ctx.arc(px(x),py(y),r||5,0,7);if(hollow){ctx.fillStyle='#0a111b';ctx.fill();ctx.stroke();}else{ctx.fillStyle=color;ctx.fill();}}
  function vline(x,color,dash){if(!ctx)return;ctx.strokeStyle=color;ctx.lineWidth=1.5;if(dash)ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(px(x),0);ctx.lineTo(px(x),H);ctx.stroke();ctx.setLineDash([]);}
  function hline(y,color,dash){if(!ctx)return;ctx.strokeStyle=color;ctx.lineWidth=1.5;if(dash)ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(0,py(y));ctx.lineTo(W,py(y));ctx.stroke();ctx.setLineDash([]);}
  function bandY(y0,y1,color){if(!ctx)return;ctx.fillStyle=color;ctx.fillRect(0,py(y1),W,py(y0)-py(y1));}
  function bandX(x0,x1,color){if(!ctx)return;ctx.fillStyle=color;ctx.fillRect(px(x0),0,px(x1)-px(x0),H);}
  function label(x,y,s,color){if(!ctx)return;ctx.fillStyle=color||'#9fb0c4';ctx.font='600 13px '+getComputedStyle(document.body).fontFamily;ctx.fillText(s,px(x),py(y));}
  return {ctx,W,H,px,py,mx,my,grid,curve,point,vline,hline,bandY,bandX,label,xmin,xmax,ymin,ymax};
}
function xdrag(cv,pl,onX){let dragging=false;cv.style.touchAction='none';
  function set(e){const r=cv.getBoundingClientRect();const X=(e.clientX-r.left)*(cv.width/Math.max(1,r.width));onX(Math.max(pl.xmin,Math.min(pl.xmax,pl.mx(X))));}
  cv.addEventListener('pointerdown',e=>{dragging=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}set(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(dragging){e.preventDefault();set(e);}});
  const end=()=>dragging=false;cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);}
function numChk(host,ans,onok,fmt){const inp=host.querySelector('input'),mo=host.querySelector('.miniout'),btn=host.querySelector('button');
  function go(){const raw=(inp.value||'').trim();const got=(fmt||(s=>parseFloat(s)))(raw);
    let ok=Array.isArray(ans)?(Array.isArray(got)&&ans.every((a,i)=>Math.abs(got[i]-a)<1e-6)):Math.abs(got-ans)<1e-6;
    if(ok){mo.className='miniout ok';mo.textContent='✓ Correct.';flash();inp.disabled=true;btn.style.display='none';onok();}
    else{mo.className='miniout no';mo.textContent='Not yet — check it and try again.';}}
  btn.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});}
function mcChoices(host,opts,onDone){shuffle(opts);let done=false;host.innerHTML=opts.map((o,i)=>`<div class="choice" data-i="${i}">${o[0]}</div>`).join('');
  host.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{if(done)return;const i=+el.dataset.i,ok=opts[i][1]==='y';
    host.querySelectorAll('.choice').forEach((c,j)=>{c.classList.add('locked');if(opts[j][1]==='y')c.classList.add('correct');else if(j===i)c.classList.add('wrong');else c.classList.add('dim');});done=true;if(ok)flash();onDone(ok);});}

 c3:{title:'Module 4 — Applications of the Derivative', cues:[

   {q:"A path $x(t),y(t)$ threads through $f$. How does the height change with $t$?",

   {q:"Derive — $D_{\\mathbf u}f=\\nabla f\\cdot\\mathbf u$, and why $\\nabla f$ is steepest and $\\perp$ to contours.",
    a:"$g(s)=f(P+s\\mathbf u)$; the chain rule gives $g'(0)=f_xu_1+f_yu_2=\\nabla f\\cdot\\mathbf u=|\\nabla f|\\cos\\varphi$ — largest at $\\varphi=0$ (along $\\nabla f$, steepest), zero along a contour (so $\\nabla f\\perp$ contours).", b:5},
   {q:"Derive — the multivariable chain rule $\\tfrac{dz}{dt}=\\nabla f\\cdot(x',y')$.",
    a:"A nudge $dt$ gives $dx=x'dt,\\ dy=y'dt$. Feed into the tangent-plane change $dz\\approx f_x\\,dx+f_y\\,dy$ and divide: $\\tfrac{dz}{dt}=f_xx'+f_yy'=\\nabla f\\cdot(x',y')$.", b:6}
 ]},
 c8:{title:'Module 9 — Multivariable Optimization', cues:[
   {q:"On a surface $z=f(x,y)$, what single vector equation locates every peak, valley, and mountain pass?",
    a:"$\\nabla f=\\mathbf 0$ — every partial vanishes at once. It's Fermat's one-variable rule $f'(0)=0$ lifted: a flat spot in <em>all</em> directions. Each solution is a local max, local min, or saddle.", b:1},
   {q:"$\\nabla f=\\mathbf 0$ only says \"flat\" — so what tells a bowl from a dome from a saddle?",
    a:"The local <b>quadratic model</b> $f(\\mathbf x+\\mathbf p)\\approx f(\\mathbf x)+\\nabla f\\cdot\\mathbf p+\\tfrac12\\,\\mathbf p^{\\mathsf T}H\\mathbf p$. At a critical point $\\nabla f=\\mathbf 0$, so the curvature term $\\tfrac12\\,\\mathbf p^{\\mathsf T}H\\mathbf p$ alone decides. $H$ is the <b>Hessian</b>, the symmetric matrix of second partials.", b:3},
   {q:"Turn that curvature into a test you run on the second partials.",
    a:"The discriminant $D=\\det H=f_{xx}f_{yy}-f_{xy}^2$. Then: $D&gt;0$ with $f_{xx}&gt;0$ is a min, $D&gt;0$ with $f_{xx}&lt;0$ a max, $D&lt;0$ a saddle, $D=0$ inconclusive. It's the 1-D sign-of-$f''$ test, upgraded to a determinant.", b:4},
   {q:"When is a single critical point guaranteed to be <em>the</em> global minimum, with no other valleys?",
    a:"When $f$ is <b>convex</b> — its Hessian is positive-semidefinite everywhere, $\\mathbf p^{\\mathsf T}H\\mathbf p\\ge 0$ in every direction (never curves down). Then any $\\nabla f=\\mathbf 0$ is the global min. On non-convex high-dimensional surfaces, saddles vastly outnumber true minima.", b:5},
   {q:"How do you actually walk downhill to a minimum using only the gradient?",
    a:"<b>Gradient descent</b>: $\\mathbf x\\leftarrow\\mathbf x-\\alpha\\,\\nabla f$, stepping against the steepest-ascent direction. The learning rate $\\alpha$ is the whole game — too large overshoots, zigzags, or explodes; too small crawls. It's $x-\\alpha f'(x)$ with two directions instead of one.", b:2},
   {q:"If you also know the curvature, how do you reach the minimum faster?",
    a:"<b>Newton's method</b>: $\\mathbf x\\leftarrow\\mathbf x-H^{-1}\\nabla f$, which jumps straight to the minimum of the quadratic model in a single step. Gradient descent uses slope only; Newton uses the Hessian to scale and rotate the step.", b:6},
   {q:"How do you find the best point while <em>stuck on a constraint</em> $g=c$?",
    a:"<b>Lagrange multipliers</b>: at the constrained optimum the objective's level curve is tangent to the constraint curve, so the gradients are parallel — $\\nabla f=\\lambda\\,\\nabla g$. Solve that together with $g(\\mathbf x)=c$. The scalar $\\lambda$ just matches their lengths.", b:7},
   {q:"Derive — $g''(0)=\\mathbf p^{\\mathsf T}H\\mathbf p$ (the Hessian curvature) by the chain rule twice.",
    a:"$g'(s)=\\nabla f\\cdot\\mathbf p$; differentiating again sends each of $f_x,f_y$ through the chain rule, giving $f_{xx}p_1^2+2f_{xy}p_1p_2+f_{yy}p_2^2=\\mathbf p^{\\mathsf T}H\\mathbf p$.", b:3},
   {q:"Derive — the Lagrange condition $\\nabla f=\\lambda\\nabla g$.",
    a:"On the constraint you move only along its tangent $\\mathbf T$; at the optimum $\\tfrac{df}{ds}=\\nabla f\\cdot\\mathbf T=0$, so $\\nabla f\\perp\\mathbf T$. Since $\\nabla g\\perp\\mathbf T$ as well, the two are parallel: $\\nabla f=\\lambda\\nabla g$.", b:7}
 ]},
 c9:{title:'Module 10 — Multiple Integrals', cues:[
   {q:"What does the double integral $\\iint_R f\\,dA$ actually mean?",
    a:"The limit of a double Riemann sum: tile $R$ into cells of area $\\Delta A$, add $f(\\text{sample})\\cdot\\Delta A$ over all cells, shrink the cells. Each term is a thin box, so the total is the signed <b>volume</b> between the surface $z=f$ and $R$.", b:1},
   {q:"How do you compute one — and what is the inner integral?",
    a:"<b>Fubini</b>: nest two single integrals, $\\iint_R f\\,dA=\\int_c^d\\!\\big(\\int_a^b f\\,dx\\big)dy$. The inner integral holds the outer variable constant and returns the <b>slice area</b> $A(y)$; the outer integral stacks the slices. Either order gives the same answer.", b:2},
   {q:"Why isn't the polar area element just $dr\\,d\\theta$?",
    a:"A polar cell has radial side $dr$ but arc side $r\\,d\\theta$ (arc = radius × angle), so $dA=r\\,dr\\,d\\theta$. Cells farther out are bigger; that growing $r$ is the factor, and it makes round regions easy.", b:3},
   {q:"What is the factor for a general change of variables?",
    a:"$dx\\,dy=|\\det J|\\,du\\,dv$, where the Jacobian $J$ has columns $\\big(\\tfrac{\\partial x}{\\partial u},\\tfrac{\\partial y}{\\partial u}\\big)$ and $\\big(\\tfrac{\\partial x}{\\partial v},\\tfrac{\\partial y}{\\partial v}\\big)$ — the edges a tiny cell maps to. Its determinant is the local area-stretch factor (for polar it equals $r$).", b:4},
   {q:"Derive — Fubini: why a double integral is two nested single integrals.",
    a:"Add the boxes row by row: $\\sum_j\\big(\\sum_i f\\,\\Delta x\\big)\\Delta y$. The inner sum is a 1-D Riemann sum along a row, $\\to A(y)=\\int f\\,dx$ (slice area, $y$ held); the outer stacks the slices, $\\int A(y)\\,dy$.", b:2},
   {q:"Derive — $dx\\,dy=|\\det J|\\,du\\,dv$, and recover polar's $r$.",
    a:"Steps $du,dv$ map to edge vectors $\\big(\\tfrac{\\partial x}{\\partial u},\\tfrac{\\partial y}{\\partial u}\\big)du$ and $\\big(\\tfrac{\\partial x}{\\partial v},\\tfrac{\\partial y}{\\partial v}\\big)dv$; the parallelogram they span has area $|\\det J|\\,du\\,dv$. For polar $\\det J=r$.", b:4}
 ]}
};
