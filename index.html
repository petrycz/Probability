function p1_recall(){recallFrom(`Module 2 asks how probabilities change when you learn something. Every tool it uses was built in Module 1: events as sets, the axioms, and counting in an equally likely sample space.`,['p0'],RECALL_HINT);}

/* ---------- Beat 2: conditional probability ---------- */
function p1_conditional(){
  stage.innerHTML=`<div class="card"><h2>Conditional probability: zooming into what you know</h2>
    <p>A friend rolls two dice out of your sight and tells you one fact: <em>the sum is 8</em>. How likely is it now that the red die shows a 6? Before the hint the answer was $\\tfrac16$. The hint rules some outcomes out, and the answer changes.</p>
    <div class="defn"><span class="dt">The objects</span>
      $B$ — the event you are told happened (here, "the sum is 8").<br>
      $A$ — the event you are asked about (here, "red is 6").<br>
      $P(A\\mid B)$ — read "the probability of $A$ given $B$": how likely $A$ is once you know $B$ happened.</div>
    <p><b>Step 1: measure it as a share.</b> Roll many times and keep only the rolls where $B$ happened. Among those, the share on which $A$ also happened settles at $P(A\\mid B)$, just as an ordinary share settles at an ordinary probability. Choose $B$ and $A$, roll, and watch the last readout.</p>
    <div class="slabel" style="margin-top:12px">given B =</div><div class="seg" id="segB1" style="margin-top:4px"></div>
    <div class="slabel" style="margin-top:10px">asked A =</div><div class="seg" id="segA1" style="margin-top:4px"></div>
    <div class="seg" id="segroll1" style="margin-top:10px"></div>
    <div class="seg" id="segv1" style="margin-top:7px"></div>
    <canvas id="cvc1" width="640" height="600" style="margin-top:10px"></canvas>
    <p class="small" style="margin-top:6px">Blue cells: outcomes in $B$. Gold: outcomes in both $A$ and $B$. Gold outline: in $A$ but ruled out by $B$. Dots: only the rolls where $B$ happened.</p>
    <div class="readout"><div class="rdc"><div class="k">rolls where B happened</div><div class="v" id="q1">—</div></div><div class="rdc"><div class="k">of those, A happened</div><div class="v" id="q2">—</div></div><div class="rdc"><div class="k">share = A among B</div><div class="v" id="q3">—</div></div></div>
    <div class="readout"><div class="rdc"><div class="k">P(B) = |B|/36</div><div class="v" id="q4">—</div></div><div class="rdc"><div class="k">P(A ∩ B) = |A∩B|/36</div><div class="v" id="q5">—</div></div><div class="rdc"><div class="k">P(A | B) = |A∩B| / |B|</div><div class="v" id="q6">—</div></div><div class="rdc"><div class="k">P(A) with no hint</div><div class="v" id="q7">—</div></div></div>
    <p style="margin-top:14px"><b>Step 2: count it.</b> Switch to <b>zoom into B</b>. The sum is 8 for exactly 5 of the 36 outcomes: $(2,6),(3,5),(4,4),(5,3),(6,2)$. Knowing $B$ rules out the other 31. It says nothing to favor one of the remaining five over another, so they stay equally likely, and each now has probability $\\tfrac15$. Only $(6,2)$ has red 6, so $P(\\text{red }6\\mid\\text{sum }8)=\\tfrac15$, up from $\\tfrac16$.</p>
    <p><b>Step 3: the general definition.</b> When outcomes are not equally likely, go back to the shares. After $n$ rolls, let $n_B$ be the number with $B$ and $n_{A\\cap B}$ the number with both. The share of $A$ among the $B$-rolls is</p>
    <div class="eqbox">$$\\frac{n_{A\\cap B}}{n_B}=\\frac{n_{A\\cap B}/n}{n_B/n}\;\\longrightarrow\;\\frac{P(A\\cap B)}{P(B)}\\quad\\text{as }n\\text{ grows.}$$</div>
    <div class="defn"><span class="dt">Conditional probability</span>For events $A$ and $B$ with $P(B)\\gt0$,
      $$P(A\\mid B)=\\frac{P(A\\cap B)}{P(B)}.$$
      Only the part of $A$ inside $B$ counts, and dividing by $P(B)$ rescales $B$ so that its total is 1: $B$ becomes the new sample space.</div>
    <p>With equally likely outcomes the definition is the count from Step 2: $\\frac{|A\\cap B|/36}{|B|/36}=\\frac{|A\\cap B|}{|B|}$. And $P(\\cdot\\mid B)$ is itself a probability — it is never negative, $P(B\\mid B)=1$, and it adds over disjoint events, because the parts of disjoint events inside $B$ are still disjoint. Every rule from Module 1 (complements, unions, counting) works inside $B$ unchanged.</p>
    <p><b>Order matters.</b> $P(A\\mid B)$ and $P(B\\mid A)$ are different questions. Given red is 6, the sum is 8 only for $(6,2)$, one of the six outcomes with red 6: $P(\\text{sum }8\\mid\\text{red }6)=\\tfrac16$, not $\\tfrac15$. The two share a numerator, $P(A\\cap B)$, but divide by different things. Swapping them is one of the most common errors in probability — "most smokers are adults" does not mean most adults smoke — and the readouts above show both.</p>
    <p class="small" id="q8"></p>
    <p>A language model's output is exactly this kind of object: a distribution over the next token <em>given</em> everything written so far. Each new token is a new condition.</p>
    <div class="task"><b>Double six</b>Two dice are rolled, and you are told that at least one of them shows a 6. What is the probability that both show a 6? Enter a fraction or a decimal.</div>
    ${gateHTML('e.g. 1/6 or 0.17')}</div>`;

  const PB=[['s8','sum = 8',(r,b)=>r+b===8],['six','at least one 6',(r,b)=>r===6||b===6],['dbl','doubles',(r,b)=>r===b],['s10','sum ≥ 10',(r,b)=>r+b>=10],['reven','red even',(r,b)=>r%2===0]];
  const PA=[['r6','red = 6',(r,b)=>r===6],['66','both 6',(r,b)=>r===6&&b===6],['s8','sum = 8',(r,b)=>r+b===8],['dbl','doubles',(r,b)=>r===b],['b5','blue ≥ 5',(r,b)=>b>=5]];
  let kb='s8',ka='r6',view='grid';
  const cv=document.getElementById('cvc1'),pl=plot(cv,P0G);
  const fB=()=>PB.find(p=>p[0]===kb)[2],fA=()=>PA.find(p=>p[0]===ka)[2];
  const nameA=()=>PA.find(p=>p[0]===ka)[1],nameB=()=>PB.find(p=>p[0]===kb)[1];
  function draw(){const B=fB(),A=fA();let nb=0,nab=0,na=0;const cellsB=[];

/* ---------- Beat 3: the multiplication rule and the chain rule ---------- */
function p1_multiply(){
  stage.innerHTML=`<div class="card"><h2>The multiplication rule: probabilities in stages</h2>
    <p>Draw two cards from a shuffled deck, one after the other, without putting the first back. What is the probability that both are aces? The first card is an ace with probability $\\tfrac4{52}$. Once it is drawn, the deck has changed — 51 cards, 3 aces — so the second card is an ace with probability $\\tfrac3{51}$, <em>given</em> the first was. The answer combines the two stages.</p>
    <p><b>Step 1: rearrange the definition.</b> Conditional probability was defined as $P(B\\mid A)=\\frac{P(A\\cap B)}{P(A)}$. Multiply both sides by $P(A)$:</p>
    <div class="defn"><span class="dt">Multiplication rule</span>$$P(A\\cap B)=P(A)\\,P(B\\mid A).$$
      In words: the probability that both happen is the probability that the first happens, times the probability that the second happens <em>given</em> the first.</div>
    <p>For the aces, with $A$ = "first card is an ace" and $B$ = "second card is an ace": $P(A\\cap B)=\\frac4{52}\\cdot\\frac3{51}=\\frac{12}{2652}=\\frac1{221}$. Counting from Module 1 agrees: $\\binom42\\big/\\binom{52}2=\\frac{6}{1326}=\\frac1{221}$. The rule is the multiplication principle with probabilities in place of counts — and, unlike the counting version, it does not need the stages to have equally likely outcomes.</p>
    <p><b>Step 2: draw the stages as a tree.</b> Module 1 used trees to <em>count</em>: each branch was an option, and the leaves were the outcomes. Here each branch also carries a <b>probability</b> — the chance of taking that branch, given the path that led to its node — and multiplying along a path gives that path's probability. The tree below shows both. An urn holds red and blue balls; draw from it without replacement.</p>
    <div class="ctrls"><span class="slabel" id="urL">red = 5</span><input type="range" id="ur" min="1" max="8" step="1" value="5"></div>
    <div class="ctrls" style="margin-top:4px"><span class="slabel" id="ubL">blue = 3</span><input type="range" id="ub" min="1" max="8" step="1" value="3"></div>
    <div class="slabel" style="margin-top:10px">draws</div><div class="seg" id="segud" style="margin-top:4px"></div>
    <div class="seg" id="segum" style="margin-top:7px"></div>
    <canvas id="cvu" width="640" height="440" style="margin-top:10px"></canvas>
    <div class="readout"><div class="rdc"><div class="k">tapped path</div><div class="v" id="u1">—</div></div><div class="rdc"><div class="k">product along the path</div><div class="v" id="u2" style="font-size:14px">—</div></div><div class="rdc"><div class="k">all leaves added</div><div class="v" id="u3">—</div></div></div>
    <p class="small" id="u4" style="margin-top:8px"></p>
    <p style="margin-top:14px"><b>Walk through the default</b> (5 red, 3 blue, 2 draws, without replacement):</p>
    <p>The first branch to R is labeled $\\tfrac58$: 5 of the 8 balls are red. Follow it. One red ball is gone, so the urn now holds 4 red and 3 blue, and the next branch to R is labeled $\\tfrac47$ — the probability of a second red <em>given</em> the first was red. <b>Tap the leaf RR</b>: its probability is $\\tfrac58\\cdot\\tfrac47=\\tfrac{20}{56}$, the multiplication rule.</p>
    <p>The grey numbers under the nodes tell the same story as counts. There are $8\\cdot7=56$ equally likely ordered draws; 35 of them start with red, and $5\\cdot4=20$ go red then red. So $P(\\text{RR})=\\tfrac{20}{56}$ is also a Module 1 count: the probability along a path is the share of draw sequences that follow it.</p>
    <p><b>Step 3: add across paths.</b> "Exactly one red" happens along two paths, RB and BR. <b>Tap each</b>: RB is $\\tfrac58\\cdot\\tfrac37=\\tfrac{15}{56}$ and BR is $\\tfrac38\\cdot\\tfrac57=\\tfrac{15}{56}$. A draw sequence follows exactly one path, so the paths are disjoint events and their probabilities add: $P(\\text{exactly one red})=\\tfrac{30}{56}\\approx0.536$, as the readout under the tree shows. Multiply along a path, add across paths — and all the leaves together add to 1.</p>
    <p><b>Step 4: switch to with replacement.</b> Now each ball goes back before the next draw. Look at the second-stage branches: after R they read $\\tfrac58$ and $\\tfrac38$, and after B they read $\\tfrac58$ and $\\tfrac38$ too. The urn never changes, so knowing the first draw tells you nothing about the second: $P(\\text{2nd red}\\mid\\text{1st red})=P(\\text{2nd red})=\\tfrac58$. Conditioning changes nothing, and the rule reduces to multiplying the plain probabilities. Events with this property are called <b>independent</b> (beat 7).</p>
    <p>That is also where a common error comes from. For two aces <em>without</em> replacement, $\\tfrac4{52}\\cdot\\tfrac4{52}$ uses the plain probability at the second draw, as if the first ace had been put back. The correct second factor is the conditional one, $\\tfrac3{51}$.</p>

    <h2 style="margin-top:22px">The chain rule</h2>
    <p>With three stages, apply the rule twice. Treat "first two" as one event, then split it again:</p>
    <div class="eqbox">$$P(A_1\\cap A_2\\cap A_3)=P(A_1\\cap A_2)\\,P(A_3\\mid A_1\\cap A_2)=P(A_1)\\,P(A_2\\mid A_1)\\,P(A_3\\mid A_1\\cap A_2).$$</div>
    <p>Repeating this for $n$ events gives the <b>chain rule</b>: each event is conditioned on everything before it.</p>
    <div class="defn"><span class="dt">Chain rule</span>$$P(A_1\\cap A_2\\cap\\cdots\\cap A_n)=P(A_1)\\,P(A_2\\mid A_1)\\,P(A_3\\mid A_1\\cap A_2)\\cdots P(A_n\\mid A_1\\cap\\cdots\\cap A_{n-1}).$$</div>
    <p>The birthday problem was already a chain rule. With $A_j$ = "person $j$ avoids the birthdays of persons $1,\\dots,j-1$", each factor $1-\\frac{j-1}{365}$ was a conditional probability given that everyone before had different birthdays.</p>
    <p>It is also exactly how a language model scores a sentence. Write the tokens as $w_1,w_2,\\dots,w_L$. The model only ever outputs one conditional distribution, $P(w_t\\mid w_1,\\dots,w_{t-1})$ — the next token given the ones so far — and the chain rule assembles the whole sequence:</p>
    <div class="eqbox">$$P(w_1,\\dots,w_L)=\\prod_{t=1}^{L}P(w_t\\mid w_1,\\dots,w_{t-1}).$$</div>
    <p>For example, if $P(\\text{the})=0.05$, $P(\\text{cat}\\mid\\text{the})=0.01$ and $P(\\text{sat}\\mid\\text{the cat})=0.2$, then $P(\\text{the cat sat})=0.05\\times0.01\\times0.2=10^{-4}$. Products of many small numbers underflow, so models work with $\\log P=\\sum_t\\log P(w_t\\mid w_{\\lt t})$; training a model means making this sum as large as possible on real text (Modules 7 and 12).</p>
    <div class="task"><b>Two trades</b>A trader's first trade wins with probability 0.6. Their results are streaky: after a win, the next trade wins with probability 0.7; after a loss, it wins with probability 0.4. What is the probability that exactly one of the first two trades wins? Enter a decimal.</div>
    ${gateHTML('e.g. 1/2 or 0.5')}</div>`;

  const cv=document.getElementById('cvu'),ur=document.getElementById('ur'),ub=document.getElementById('ub');
  let draws=2,repl=false,sel=null;
  const fr=(a,b)=>a+'/'+b;
  function tree(){const R=+ur.value,B=+ub.value,N=R+B;const leaves=[];
    const rec=(path,r,b,num,den)=>{if(path.length===draws){leaves.push({path,num,den});return;}
      const n=r+b;[['R',r],['B',b]].forEach(([c,k])=>{if(k<=0)return;rec(path.concat([{c,k,n}]),repl?R:(c==='R'?r-1:r),repl?B:(c==='B'?b-1:b),num*k,den*n);});};
    rec([],R,B,1,1);return {R,B,N,leaves};}
  function falling(n,k){let p=1;for(let i=0;i<k;i++)p*=repl?n:(n-i);return p;}
  function draw(){const T=tree();const ctx=cv.getContext&&cv.getContext('2d');const L=T.leaves.length;
    const tot=falling(T.N,draws);
    document.getElementById('urL').textContent='red = '+T.R;document.getElementById('ubL').textContent='blue = '+T.B;
    if(ctx){const W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);const x0=40,x1=W-150,top=24,bot=H-20;
      const lx=d=>x0+(x1-x0)*d/draws;
      const leafY=i=>L===1?H/2:top+(bot-top)*i/(L-1);
      // nodes: compute y as average of descendant leaves
      const nodes={};T.leaves.forEach((lf,i)=>{for(let d=0;d<=draws;d++){const key=lf.path.slice(0,d).map(s=>s.c).join('');(nodes[key]=nodes[key]||{ys:[],d,cnt:0}).ys.push(leafY(i));}});
      Object.values(nodes).forEach(nd=>nd.y=nd.ys.reduce((a,b)=>a+b,0)/nd.ys.length);
      const selKey=sel;
      // count of sequences through node = product of chosen counts along prefix * remaining falling
      const countAt=key=>{let r=T.R,b=T.B,c=1;for(const ch of key){const k=ch==='R'?r:b;c*=k;if(!repl){if(ch==='R')r--;else b--;}}let n=repl?T.N:(T.N-key.length),rest=1;for(let i=key.length;i<draws;i++){rest*=n;if(!repl)n--;}return c*rest;};
      Object.keys(nodes).forEach(key=>{if(!key)return;const par=key.slice(0,-1),a=nodes[par],b=nodes[key];const on=selKey&&selKey.startsWith(key);
        ctx.strokeStyle=on?'#e8b84b':(key.endsWith('R')?'rgba(226,102,79,.7)':'rgba(122,184,255,.7)');ctx.lineWidth=on?3:1.6;ctx.beginPath();ctx.moveTo(lx(a.d)+6,a.y);ctx.lineTo(lx(b.d)-6,b.y);ctx.stroke();
        // branch label: conditional probability
        let r=T.R,bb=T.B;for(const ch of par){if(!repl){if(ch==='R')r--;else bb--;}}const n=r+bb,k=key.endsWith('R')?r:bb;
        ctx.font=p0Font(L>4?11:12);ctx.fillStyle=on?'#e8b84b':'#9fb0c4';ctx.textAlign='center';ctx.fillText(fr(k,n),(lx(a.d)+lx(b.d))/2,(a.y+b.y)/2-5);});
      Object.keys(nodes).forEach(key=>{const nd=nodes[key];const on=selKey&&selKey.startsWith(key);ctx.fillStyle=on||!key?'#e8b84b':'#d6e0ee';ctx.beginPath();ctx.arc(lx(nd.d),nd.y,4.5,0,7);ctx.fill();
        ctx.font=p0Font(10);ctx.fillStyle='#5d6f85';ctx.textAlign='center';ctx.fillText(String(countAt(key)),lx(nd.d),nd.y+15);});
      T.leaves.forEach((lf,i)=>{const key=lf.path.map(s=>s.c).join(''),on=selKey===key,y=leafY(i);ctx.textAlign='left';ctx.font=p0Font(13);
        ctx.fillStyle=on?'#e8b84b':'#d6e0ee';ctx.fillText(key.split('').join(' '),x1+14,y+4);ctx.font=p0Font(11);ctx.fillStyle=on?'#e8b84b':'#9fb0c4';ctx.fillText(fr(lf.num,lf.den)+' = '+(lf.num/lf.den).toFixed(3),x1+60,y+4);});
      ctx.textAlign='left';ctx.font=p0Font(11);ctx.fillStyle='#5d6f85';ctx.fillText('numbers under nodes: of '+tot+' equally likely draw sequences, how many pass through',8,H-4);}
    let sum=0;T.leaves.forEach(lf=>sum+=lf.num/lf.den);p0Set('u3',sum.toFixed(4));
    const lf=T.leaves.find(l=>l.path.map(s=>s.c).join('')===sel);
    if(lf){p0Set('u1',lf.path.map(s=>s.c).join(' '));p0Set('u2',lf.path.map(s=>s.k+'/'+s.n).join(' · ')+' = '+lf.num+'/'+lf.den+' = '+(lf.num/lf.den).toFixed(4));}
    else{p0Set('u1','—');p0Set('u2','—');}
    const byK={};T.leaves.forEach(l=>{const k=l.path.filter(s=>s.c==='R').length;byK[k]=(byK[k]||0)+l.num/l.den;});
    if(!T.leaves.length){p0Set('u4','Not enough balls for '+draws+' draws without replacement.');return;}
    p0Set('u4','Exactly k red, adding the paths with k reds: '+Object.keys(byK).sort().map(k=>'k = '+k+': '+byK[k].toFixed(4)).join(' · '));}
  function reset(){sel=null;draw();}
  ur.oninput=reset;ub.oninput=reset;

/* ---------- Beat 4: total probability ---------- */
function p1_total(){
  stage.innerHTML=`<div class="card"><h2>Total probability: averaging over cases</h2>
    <p>A strategy wins on 70% of up days, 50% of flat days, and 20% of down days. Half of all days are up, 30% flat, 20% down. What is its overall win rate?</p>
    <div class="defn"><span class="dt">The objects</span>
      $B_1,B_2,B_3$ — up, flat, down. Every day is exactly one kind, so they <b>partition</b> $\\Omega$.<br>
      $P(B_i)$ — how often kind $i$ occurs. &nbsp; $A$ — "the strategy wins". &nbsp; $P(A\\mid B_i)$ — its win rate on kind $i$.</div>
    <p>In the square below (area 1), each strip is one kind of day with <b>width</b> $P(B_i)$, and its shading has <b>height</b> $P(A\\mid B_i)$. Drag the border handles and the bar tops.</p>
    <canvas id="cvt4" width="640" height="440" style="margin-top:10px"></canvas>
    <div class="seg" id="seglv" style="margin-top:8px"></div>
    <div class="readout"><div class="rdc"><div class="k">shaded area: up</div><div class="v" id="t1">—</div></div><div class="rdc"><div class="k">shaded area: flat</div><div class="v" id="t2">—</div></div><div class="rdc"><div class="k">shaded area: down</div><div class="v" id="t3">—</div></div><div class="rdc"><div class="k">P(A) = all shaded area</div><div class="v" id="t4">—</div></div></div>
    <p class="small" id="t5" style="margin-top:8px"></p>
    <p style="margin-top:14px"><b>Try first:</b> the plain average of the win rates is $\\frac{0.7+0.5+0.2}{3}\\approx0.47$, but the readout says $0.54$. Drag the strips to equal widths and the two agree — the plain average assumes every kind of day is equally common.</p>
    <p><b>Count it.</b> Of 1000 days: 500 up with 350 wins, 300 flat with 150, 200 down with 40. That is $540$ wins, a rate of $0.54$.</p>
    <p><b>Read it as area.</b> Each shaded rectangle is width $\\times$ height $=P(B_i)\\,P(A\\mid B_i)=P(A\\cap B_i)$ by the multiplication rule. The strips are disjoint and fill the square, so they cut $A$ into disjoint pieces, and additivity adds them:</p>
    <div class="defn"><span class="dt">Law of total probability</span>If $B_1,\\dots,B_m$ partition $\\Omega$, each with $P(B_i)\\gt0$, then
      $$P(A)=\\sum_{i}P(A\\cap B_i)=\\sum_{i}P(B_i)\\,P(A\\mid B_i).$$
      $P(A)$ is a <b>weighted average</b> of the $P(A\\mid B_i)$, with weights $P(B_i)$ adding to 1, so it lies between the smallest and largest of them.</div>
    <p><b>Level the shading</b> above: the dashed line at height $P(A)$ is the shading spread evenly over the whole square — same area, one height. Conditioning on $B_i$ zooms into one strip and reads its height; not conditioning reads the level line.</p>

    <h2 style="margin-top:22px">Example: is the second ball like the first?</h2>
    <p>An urn holds 5 red and 3 blue balls. Draw two without replacement and look only at the second. Let $R_1,B_1$ be "first ball red / blue" — a partition — and $R_2$ "second ball red". Only 4 of the 7 remaining balls are red <em>if</em> the first was red; if it was blue, 5 are. Not looking leaves both possibilities, so average them:</p>
    <div class="eqbox">$$P(R_2)=P(R_1)\\,P(R_2\\mid R_1)+P(B_1)\\,P(R_2\\mid B_1)=\\tfrac58\\cdot\\tfrac47+\\tfrac38\\cdot\\tfrac57=\\tfrac{35}{56}=\\tfrac58.$$</div>
    <p>The same as the first ball. In general, with $r$ red and $b$ blue, $n=r+b$:</p>
    <div class="eqbox">$$P(R_2)=\\frac rn\\cdot\\frac{r-1}{n-1}+\\frac bn\\cdot\\frac r{n-1}=\\frac{r\\,(r-1+b)}{n\\,(n-1)}=\\frac rn.$$</div>
    <p><b>By counting: the second ball.</b> Label the balls so all $n$ are distinct. An outcome of two draws is an ordered pair (first ball, second ball) of different balls: $n$ choices for the first and $n-1$ for the second, so $n(n-1)$ pairs, all equally likely. Count the pairs whose second ball is red, split by the first ball:</p>
    <div class="eqbox">$$\\underbrace{r\\,(r-1)}_{\\text{first red: }r\\text{ choices, then }r-1\\text{ reds left}}+\\underbrace{b\\cdot r}_{\\text{first blue: }b\\text{ choices, then all }r\\text{ reds}}=r\\,(r-1+b)=r\\,(n-1),$$
    $$P(R_2)=\\frac{r\\,(n-1)}{n\\,(n-1)}=\\frac rn.$$</div>
    <p><b>By counting: any position.</b> Keep drawing until the urn is empty. The result is an ordering of all $n$ balls, and by the multiplication principle there are $n\\cdot(n-1)\\cdots1=n!$ orderings, all equally likely. Fix a position $k$ — the 2nd, the 5th, the last — and count the orderings with a red ball there in two stages:</p>
    <p>• <b>Stage 1:</b> choose which red ball sits in position $k$: $r$ options.<br>
    • <b>Stage 2:</b> place the other $n-1$ balls in the other $n-1$ positions, in any order: $(n-1)\\cdot(n-2)\\cdots1=(n-1)!$ options, whichever red ball was used in stage 1.</p>
    <div class="eqbox">$$\\#\\{\\text{orderings with red in position }k\\}=r\\,(n-1)!,\\qquad P(\\text{position }k\\text{ red})=\\frac{r\\,(n-1)!}{n!}=\\frac{r\\,(n-1)!}{n\\,(n-1)!}=\\frac rn,$$</div>
    <p>using $n!=n\\cdot(n-1)!$. Check with three balls, two red ($R,R'$) and one blue ($B$): of the $3!=6$ orderings, the ones with red last are $R'BR,\\ BR'R,\\ RBR',\\ BRR'$ — that is $2\\cdot2!=4$, and $\\frac46=\\frac23=\\frac rn$. Nothing in the count depends on $k$, so every position is red with probability $\\frac rn$.</p>
    <p>Here counting reaches the answer directly, because every ordering is equally likely. Total probability becomes the only route when the cases have unequal probabilities that cannot be counted, like the trading example above.</p>
    <p><b>Why.</b> Unlooked-at, the second ball is just another random ball from the urn. Equivalently, the possible updates cancel: red first lowers the second's chance by $\\tfrac3{56}$, blue first raises it by $\\tfrac5{56}$, and $\\tfrac58\\cdot\\tfrac3{56}=\\tfrac38\\cdot\\tfrac5{56}$. This holds generally: averaged over what you might learn, your updated probability equals your current one — you cannot predict which way a belief will move. (The streaky trader's second trade, at $0.58$, is a different event from the first, not an update of it.)</p>
    <p>Split into cases, solve each, recombine: regime-switching market models (Module 9), mixture models (Module 13), and summing a variable out of a Bayesian network (Module 11) are all this law.</p>

/* ---------- Beat 5: Bayes' theorem ---------- */
function p1_bayes(){
  stage.innerHTML=`<div class="card"><h2>Bayes' theorem: turning a conditional around</h2>
    <p>A disease affects 1% of people. A screening test comes back positive for 90% of people who have it, and also, falsely, for 9% of people who do not. You test positive. How likely is it that you have the disease? Guess before reading on.</p>
    <div class="seg" id="segbg"></div>
    <p class="small" id="bgout" style="margin-top:6px;min-height:18px"></p>
    <div class="defn"><span class="dt">The objects</span>
      $D$ — "has the disease"; $D^{c}$ — "does not". They partition the population.<br>
      $+$ — "tests positive".<br>
      Given: $P(D)=0.01$, $P(+\\mid D)=0.9$, $P(+\\mid D^{c})=0.09$. Asked: $P(D\\mid +)$ — the conditional the other way round.</div>
    <p><b>Step 1: count 1000 people.</b> Switch the picture between the people, the unit square, and the positives alone, and move the sliders.</p>
    <div class="seg" id="segbv"></div>
    <canvas id="cvb5" width="640" height="420" style="margin-top:10px"></canvas>
    <div class="ctrls"><span class="slabel" id="bpL">P(D) = 0.010</span><input type="range" id="bp" min="0.005" max="0.5" step="0.005" value="0.01"></div>
    <div class="ctrls" style="margin-top:4px"><span class="slabel" id="bsL">P(+ | D) = 0.90</span><input type="range" id="bs" min="0.5" max="1" step="0.01" value="0.9"></div>
    <div class="ctrls" style="margin-top:4px"><span class="slabel" id="bfL">P(+ | Dᶜ) = 0.09</span><input type="range" id="bf" min="0" max="0.3" step="0.01" value="0.09"></div>
    <div class="readout"><div class="rdc"><div class="k">sick and positive</div><div class="v" id="b51">—</div></div><div class="rdc"><div class="k">healthy and positive</div><div class="v" id="b52">—</div></div><div class="rdc"><div class="k">all positives</div><div class="v" id="b53">—</div></div><div class="rdc"><div class="k">P(D | +)</div><div class="v" id="b54">—</div></div></div>
    <p style="margin-top:14px">With the starting numbers: of 1000 people, $1000\\times0.01=10$ have the disease, and $10\\times0.9=9$ of them test positive. The other 990 are healthy, and $990\\times0.09\\approx89$ of them test positive too. So 98 people test positive, and only 9 of them are sick:</p>
    <div class="eqbox">$$P(D\\mid +)\\approx\\frac{9}{9+89}=\\frac{9}{98}\\approx0.09.$$</div>
    <p>About 9%, not 90%. The test is good, but the disease is rare: the healthy group is 99 times larger, so even its small false-positive rate produces ten times as many positives as the sick group does.</p>
    <p><b>Step 2: see it in the square.</b> In the <b>unit square</b> view, the strips are $D$ (width $0.01$) and $D^{c}$ (width $0.99$), and the shading in each is the positives, with height $P(+\\mid D)$ or $P(+\\mid D^{c})$. Learning "$+$" means zooming into the shaded area — the <b>positives only</b> view — and $P(D\\mid +)$ is the share of that area lying in the $D$ strip. The $D$ piece is tall but very thin, because the strip it sits in is thin.</p>
    <p><b>Step 3: derive the formula.</b> By the definition of conditional probability,</p>
    <div class="eqbox">$$P(D\\mid +)=\\frac{P(D\\cap +)}{P(+)}.$$</div>
    <p>The numerator is the $D$ piece of the shading: by the multiplication rule, $P(D\\cap +)=P(D)\\,P(+\\mid D)$. The denominator is all the shading: by total probability over the partition $D,D^{c}$, $P(+)=P(D)\\,P(+\\mid D)+P(D^{c})\\,P(+\\mid D^{c})$. Substituting both:</p>
    <div class="defn"><span class="dt">Bayes' theorem</span>
      $$P(D\\mid +)=\\frac{P(D)\\,P(+\\mid D)}{P(D)\\,P(+\\mid D)+P(D^{c})\\,P(+\\mid D^{c})}=\\frac{0.01\\times0.9}{0.01\\times0.9+0.99\\times0.09}=\\frac{0.009}{0.0981}\\approx0.092.$$
      For any partition $B_1,\\dots,B_m$ and event $A$ with $P(A)\\gt0$: $\;P(B_j\\mid A)=\\dfrac{P(B_j)\\,P(A\\mid B_j)}{\\sum_i P(B_i)\\,P(A\\mid B_i)}$.</div>
    <p>The three ingredients have names that recur through the course. $P(D)$ is the <b>prior</b>: the probability before the evidence. $P(+\\mid D)$ is the <b>likelihood</b>: how probable the evidence is under each possibility. $P(D\\mid +)$ is the <b>posterior</b>: the probability after the evidence.</p>
    <p><b>Step 4: the two directions are different questions.</b> $P(+\\mid D)=0.9$ and $P(D\\mid +)\\approx0.09$ share the same numerator, $P(D\\cap+)$, the thin $D$ piece. The first divides it by the $D$ strip, which it nearly fills; the second divides it by all the shading, which it barely dents. Mixing them up is the confusion of the inverse, and ignoring the prior $P(D)$ is <b>base-rate neglect</b>. Move the $P(D)$ slider to see the prior's effect: at $P(D)=0.1$ the posterior is about 0.53, and at $0.5$ it is about 0.91.</p>
    <p>The same calculation powers a spam filter. In the last beat, 40% of email was spam and "free" appeared in 25% of spam and 2% of legitimate mail. Bayes turns that around: $P(\\text{spam}\\mid\\text{free})=\\frac{0.4\\times0.25}{0.112}\\approx0.89$ — the probability a filter needs, computed from the probabilities that are easy to measure.</p>
    <div class="task"><b>A trading signal</b>On 55% of days the market closes up. A signal fires before 60% of up days and before 30% of down days. The signal has just fired. What is the probability that the market closes up? Enter a decimal.</div>
    ${gateHTML('e.g. 0.5')}</div>`;

  let view='people';
  p0Seg('segbg',[['90','about 90%'],['50','about 50%'],['10','about 10%'],['1','about 1%']],'',k=>{document.querySelectorAll('#segbg .segb').forEach(x=>x.classList.toggle('on',x.dataset.k===k));

        ctx.strokeStyle='#e9eef6';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(xs,y0);ctx.lineTo(xs,y1);ctx.stroke();ctx.strokeStyle='#2b3a4f';ctx.strokeRect(x0,y0,x1-x0,y1-y0);

        ctx.fillStyle=BL;ctx.textAlign='right';ctx.fillText('Dᶜ: width '+(1-P).toFixed(3)+', shading '+F.toFixed(2),x1,y1+18);ctx.textAlign='left';

      else{const x0=40,x1=W-20,y0=70,y1=230,tot=P*S+(1-P)*F||1,xm=x0+(x1-x0)*(P*S/tot);
        ctx.font=p0Font(13);ctx.fillStyle='#9fb0c4';ctx.fillText('All positives, rescaled to fill the bar (this is the new sample space):',x0,y0-16);
        ctx.fillStyle=G;ctx.fillRect(x0,y0,Math.max(2,xm-x0),y1-y0);ctx.fillStyle=BL+'aa';ctx.fillRect(xm,y0,x1-xm,y1-y0);ctx.strokeStyle='#2b3a4f';ctx.strokeRect(x0,y0,x1-x0,y1-y0);

    <div class="eqbox">$$P(\\text{up}\\mid\\text{fire})=\\frac{0.55\\times0.6}{0.55\\times0.6+0.45\\times0.3}=\\frac{0.330}{0.330+0.135}=\\frac{0.330}{0.465}\\approx0.71.$$</div>

/* ---------- Beat 6: Bayes as updating — odds and evidence ---------- */
function p1_update(){
  stage.innerHTML=`<div class="card"><h2>Bayes as updating: odds and evidence</h2>
    <p>After one positive test the probability of disease went from $0.01$ to about $0.09$. Suppose you take a second, independent test, and it is also positive. Then a third. How does the probability move with each result? Use the same test as before: $P(+\\mid D)=0.9$, $P(+\\mid D^{c})=0.09$.</p>
    <p><b>Try it.</b> Add positive and negative results and watch where the probability goes. Each dot is your belief after one more result; the arrows show each move.</p>
    <div class="ctrls"><button class="btn ghost" id="uplus" style="padding:10px 14px">+ positive result</button><button class="btn ghost" id="uminus" style="padding:10px 14px">− negative result</button><button class="btn ghost" id="ureset" style="padding:10px 14px">Start over</button></div>
    <canvas id="cvo6" width="640" height="330" style="margin-top:10px"></canvas>
    <div class="ctrls"><span class="slabel" id="opL">prior P(D) = 0.010</span><input type="range" id="op" min="0.005" max="0.5" step="0.005" value="0.01"></div>
    <div class="ctrls" style="margin-top:4px"><span class="slabel" id="osL">P(+ | D) = 0.90</span><input type="range" id="os" min="0.5" max="0.99" step="0.01" value="0.9"></div>
    <div class="ctrls" style="margin-top:4px"><span class="slabel" id="ofL">P(+ | Dᶜ) = 0.09</span><input type="range" id="of" min="0.01" max="0.3" step="0.01" value="0.09"></div>
    <div class="readout"><div class="rdc"><div class="k">results so far</div><div class="v" id="o1">none</div></div><div class="rdc"><div class="k">P(D) now</div><div class="v" id="o2">—</div></div><div class="rdc"><div class="k">odds now</div><div class="v" id="o3">—</div></div><div class="rdc"><div class="k">step per + / per −</div><div class="v" id="o4">—</div></div></div>
    <p class="small" id="o5" style="margin-top:8px"></p>
    <p style="margin-top:14px">Two things to notice. In probability, the moves are uneven: the first positive takes $0.01$ to $0.09$, the second takes $0.09$ to $0.50$, the third to about $0.91$. On the line above, every positive moves the dot the <em>same distance</em> to the right, and every negative the same distance to the left. The rest of this beat explains why, and what that distance is.</p>
    <p><b>Step 1: update twice with Bayes.</b> After the first positive, $P(D\\mid +)\\approx0.0917$. That is now what you believe before the second test, so use it as the prior in Bayes' theorem. Assuming the two tests' errors are unrelated once disease status is fixed (the precise condition, <em>conditional independence</em>, comes in beat 9):</p>
    <div class="eqbox">$$P(D\\mid ++)=\\frac{0.0917\\times0.9}{0.0917\\times0.9+0.9083\\times0.09}=\\frac{0.0825}{0.0825+0.0817}\\approx0.50.$$</div>
    <p>Yesterday's posterior is today's prior. This works, but each step needs the whole formula again. Odds make it a single multiplication.</p>
    <p><b>Step 2: odds.</b> The <b>odds</b> of an event compare its probability with the probability that it does not happen:</p>
    <div class="defn"><span class="dt">Odds</span>$$O(D)=\\frac{P(D)}{P(D^{c})}=\\frac{P(D)}{1-P(D)},\\qquad\\text{and back again:}\\quad P(D)=\\frac{O(D)}{1+O(D)}.$$
      The second formula comes from solving $O=\\frac{P}{1-P}$ for $P$: $O-OP=P$, so $O=P(1+O)$. Examples: $P=0.01$ gives $O=\\frac{0.01}{0.99}=\\frac1{99}$ ("1 to 99"); $P=0.5$ gives $O=1$; $P=0.9$ gives $O=9$.</div>
    <p><b>Step 3: the odds form of Bayes.</b> Write Bayes' theorem twice, once for $D$ and once for $D^{c}$, with the same evidence $+$:</p>
    <div class="eqbox">$$P(D\\mid +)=\\frac{P(D)\\,P(+\\mid D)}{P(+)},\\qquad P(D^{c}\\mid +)=\\frac{P(D^{c})\\,P(+\\mid D^{c})}{P(+)}.$$</div>
    <p>Divide the first by the second. Both have the same denominator $P(+)$, so it cancels — the total-probability sum is no longer needed:</p>
    <div class="eqbox">$$\\underbrace{\\frac{P(D\\mid +)}{P(D^{c}\\mid +)}}_{\\text{posterior odds}}=\\underbrace{\\frac{P(D)}{P(D^{c})}}_{\\text{prior odds}}\\times\\underbrace{\\frac{P(+\\mid D)}{P(+\\mid D^{c})}}_{\\text{likelihood ratio}}.$$</div>
    <div class="defn"><span class="dt">Bayes' theorem, odds form</span>Posterior odds = prior odds × <b>likelihood ratio</b>, where the likelihood ratio $\\mathrm{LR}=\\dfrac{P(\\text{evidence}\\mid D)}{P(\\text{evidence}\\mid D^{c})}$ measures how much more probable the evidence is if $D$ is true than if it is false.</div>
    <p>For a positive result, $\\mathrm{LR}_+=\\frac{0.9}{0.09}=10$. For a negative result, $\\mathrm{LR}_-=\\frac{P(-\\mid D)}{P(-\\mid D^{c})}=\\frac{0.1}{0.91}\\approx0.11$. Now the chain is just multiplication:</p>
    <div class="eqbox">$$\\tfrac1{99}\\xrightarrow{\\times10}\\tfrac{10}{99}\;(P=\\tfrac{10}{109}\\approx0.09)\\xrightarrow{\\times10}\\tfrac{100}{99}\;(P=\\tfrac{100}{199}\\approx0.50)\\xrightarrow{\\times10}\\tfrac{1000}{99}\;(P\\approx0.91).$$</div>
    <p><b>Step 4: why the steps on the line are equal.</b> The line is drawn in <b>log-odds</b>, $\\log_{10}O$. Taking logarithms turns the multiplication into addition:</p>
    <div class="eqbox">$$\\log O(\\text{posterior})=\\log O(\\text{prior})+\\log\\mathrm{LR}.$$</div>
    <p>Every positive adds $\\log_{10}10=1$ and every negative adds $\\log_{10}0.11\\approx-0.96$, wherever the dot happens to be. Evidence is additive in log-odds. This is the scale machine learning uses: a logistic-regression or neural-network classifier outputs a <b>logit</b>, which is a log-odds, and a naive-Bayes spam filter scores an email by adding up the log-likelihood-ratios of its words.</p>

    <h2 style="margin-top:22px">The prosecutor's fallacy</h2>
    <p>A DNA trace matches a suspect. The chance that a random innocent person matches is 1 in a million. "So the chance he is innocent is 1 in a million" — that is the confusion of the inverse again: $P(\\text{match}\\mid\\text{innocent})$ is not $P(\\text{innocent}\\mid\\text{match})$. Suppose the suspect was found by searching a database of a city of 10 million, with nothing else pointing to him. Then:</p>
    <p>• <b>Prior odds</b> that he is the source: 1 to 9,999,999, about $10^{-7}$ — he is one of 10 million people.<br>
    • <b>Likelihood ratio</b> of a match: $\\frac{P(\\text{match}\\mid\\text{source})}{P(\\text{match}\\mid\\text{not source})}=\\frac{1}{10^{-6}}=10^{6}$.<br>
    • <b>Posterior odds</b>: $10^{-7}\\times10^{6}=0.1$, so $P=\\frac{0.1}{1.1}\\approx0.09$.</p>
    <p>In counts: among 10 million people, about 10 innocent people match by chance, plus the true source, so a match alone leaves roughly a 1-in-11 chance. Strong evidence multiplies the odds by a million, but a tiny prior can absorb it. The same mistake reads a small p-value as the probability that a result is a fluke (Module 14).</p>
    <div class="task"><b>Two words</b>40% of email is spam. The word "free" appears in 25% of spam and 2% of legitimate email; the word "meeting" appears in 1% of spam and 5% of legitimate email. Assume the two words occur independently once you know whether an email is spam. An email contains both words. What is the probability it is spam? Enter a decimal.</div>
    ${gateHTML('e.g. 0.5')}</div>`;

function p1_independence(){
  stage.innerHTML=`<div class="card"><h2>Independence: when knowing one tells you nothing</h2>
    <p>Sometimes learning that $B$ happened changes the probability of $A$ — a positive test raised the chance of disease. Sometimes it changes nothing — a coin does not remember the last toss. Events of the second kind are <b>independent</b>.</p>
    <p><b>See it in the square.</b> As before, the strip on the left is $B$ (width $P(B)$) and the rest is $B^{c}$. The shading is $A$: its height inside $B$ is $P(A\\mid B)$, and inside $B^{c}$ it is $P(A\\mid B^{c})$. Drag the strip border and the two bar tops, or pick a preset.</p>
    <div class="seg" id="segip"></div>
    <canvas id="cvi7" width="640" height="400" style="margin-top:10px"></canvas>
    <div class="readout"><div class="rdc"><div class="k">P(A | B)</div><div class="v" id="i1">—</div></div><div class="rdc"><div class="k">P(A)</div><div class="v" id="i2">—</div></div><div class="rdc"><div class="k">P(A ∩ B)</div><div class="v" id="i3">—</div></div><div class="rdc"><div class="k">P(A) · P(B)</div><div class="v" id="i4">—</div></div></div>
    <p class="small" id="i5" style="margin-top:8px;min-height:20px"></p>
    <p style="margin-top:14px"><b>What to notice.</b> $P(A)$ is the level of the shading spread over the whole square — the weighted average of the two heights (beat 4). When the two heights are equal, the shading is <em>flat</em>, the average equals both heights, and $P(A\\mid B)=P(A)$: learning $B$ does not move the probability of $A$. Whenever the heights differ, it does.</p>
    <p><b>Step 1: the definition.</b> "Learning $B$ does not change $A$" is $P(A\\mid B)=P(A)$. Substitute the definition of $P(A\\mid B)$ and multiply both sides by $P(B)$:</p>
    <div class="eqbox">$$\\frac{P(A\\cap B)}{P(B)}=P(A)\\quad\\Longleftrightarrow\\quad P(A\\cap B)=P(A)\\,P(B).$$</div>
    <div class="defn"><span class="dt">Independence</span>Events $A$ and $B$ are <b>independent</b> when $P(A\\cap B)=P(A)\\,P(B)$.</div>
    <p>The product form is the one used as the definition, for two reasons: it treats $A$ and $B$ symmetrically, so it also gives $P(B\\mid A)=P(B)$ — dividing by $P(A)$ instead — and it still makes sense when $P(B)=0$, where $P(A\\mid B)$ is undefined. In the square, $P(A\\cap B)$ is the shaded part of the $B$ strip, width $P(B)$ times height $P(A\\mid B)$; the readouts show it matching $P(A)P(B)$ exactly when the shading is flat.</p>
    <p><b>Step 2: the complement comes along.</b> If $A$ and $B$ are independent, so are $A$ and $B^{c}$. Split $A$ into its parts inside and outside $B$ — disjoint, so they add — and substitute:</p>
    <div class="eqbox">$$P(A\\cap B^{c})=P(A)-P(A\\cap B)=P(A)-P(A)P(B)=P(A)\\,\\big(1-P(B)\\big)=P(A)\\,P(B^{c}).$$</div>
    <p>In the square: flat shading is flat in both strips at once.</p>

    <h2 style="margin-top:22px">Independent is not disjoint</h2>
    <p>Choose the <b>disjoint</b> preset: $A$ lies entirely outside $B$, so the shading in the $B$ strip has height 0. The events cannot happen together, $P(A\\cap B)=0$. But $P(A)P(B)\\gt0$ whenever both events are possible, so the product rule fails: disjoint events are <em>dependent</em>, about as strongly as possible — learning $B$ drops the probability of $A$ to zero. "Independent" means the shading is flat across the border; "disjoint" means there is no shading at all on one side of it.</p>

    <h2 style="margin-top:22px">Testing events on the dice</h2>
    <p>Independence is a numerical fact, not something visible in how events are described. Pick two events about two dice and compare $P(A\\mid B)$ with $P(A)$.</p>
    <div class="slabel" style="margin-top:10px">A =</div><div class="seg" id="segia" style="margin-top:4px"></div>
    <div class="slabel" style="margin-top:10px">B =</div><div class="seg" id="segib" style="margin-top:4px"></div>
    <div class="readout"><div class="rdc"><div class="k">P(A)</div><div class="v" id="d1">—</div></div><div class="rdc"><div class="k">P(A | B)</div><div class="v" id="d2">—</div></div><div class="rdc"><div class="k">P(A ∩ B) vs P(A)P(B)</div><div class="v" id="d3" style="font-size:14px">—</div></div><div class="rdc"><div class="k">verdict</div><div class="v" id="d4">—</div></div></div>
    <p style="margin-top:12px">"Red is even" and "the sum is 7" are independent, though the sum involves the red die: $P(\\text{red even})=\\tfrac12$, and of the six sum-7 outcomes $(1,6),(2,5),(3,4),(4,3),(5,2),(6,1)$ exactly three have red even, so $P(\\text{red even}\\mid\\text{sum }7)=\\tfrac36=\\tfrac12$. Whatever red shows, exactly one blue face makes 7, so the sum being 7 says nothing about red. "Red is 6" and "the sum is 8" are dependent: $P(\\text{red }6\\mid\\text{sum }8)=\\tfrac15\\ne\\tfrac16$.</p>

    <h2 style="margin-top:22px">Independence is what made Module 1's products valid</h2>
    <p>The binomial formula gave a sequence like HHT the probability $p\\cdot p\\cdot q$, and the two-dice grid gave each of the 36 cells probability $\\tfrac16\\cdot\\tfrac16$. Both multiplied the probabilities of separate tosses or dice. By the chain rule the exact probability is $P(H_1)\\,P(H_2\\mid H_1)\\,P(T_3\\mid H_1\\cap H_2)$; the tosses are modelled as independent — no toss influences another — so each conditional equals the plain probability and the product is just $p\\cdot p\\cdot q$. Independence is an assumption about the experiment, and it is the assumption that the streaky trader of beat 3 broke.</p>
    <div class="task"><b>Two data feeds</b>A trading system uses two data feeds that fail independently: feed A on 2% of days, feed B on 5%. The system raises a warning on any day at least one feed fails. On what fraction of days is there a warning? Enter a decimal.</div>
    ${gateHTML('e.g. 0.05')}</div>`;

      ctx.strokeStyle='#2b3a4f';ctx.strokeRect(pl.px(0),pl.py(1),pl.px(1)-pl.px(0),pl.py(0)-pl.py(1));
      ctx.font=p0Font(12);ctx.textAlign='center';ctx.fillStyle='#e8b84b';ctx.fillText('B   width '+wB.toFixed(2),pl.px(wB/2),pl.py(0)+16);ctx.fillStyle='#9fb0c4';ctx.fillText('Bᶜ   width '+(1-wB).toFixed(2),pl.px((1+wB)/2),pl.py(0)+16);
      ctx.fillStyle='#e9eef6';ctx.fillText(hB.toFixed(2),pl.px(wB/2),pl.py(hB)-10);ctx.fillText(hC.toFixed(2),pl.px((1+wB)/2),pl.py(hC)-10);

  const snap=v=>Math.round(v*100)/100;
  cv.style.touchAction='none';

    if(x<wB-0.02&&Math.abs(y-hB)<0.07)drag='hB';else if(x>wB+0.02&&Math.abs(y-hC)<0.07)drag='hC';else if(Math.abs(x-wB)<0.05)drag='w';else return;

  if(s&&s.completed)Object.assign(completed,s.completed);
  if(s&&s.reached)Object.assign(reached,s.reached);
  MODULES.forEach(m=>{if(completed[m.id]&&reached[m.id]==null)reached[m.id]=Math.max(0,m.beats.length-1);});
  const hp=parseHash();
  let t=null;
  if(hp&&MODULES[hp.curM]&&MODULES[hp.curM].ready)t={curM:hp.curM,beat:hp.beat};
  else if(s&&s.view==='module'&&typeof s.curM==='number'&&MODULES[s.curM]&&MODULES[s.curM].ready)t={curM:s.curM,beat:s.beat};
  if(t){const b=Math.max(0,Math.min(t.beat|0,MODULES[t.curM].beats.length-1));openModuleAt(t.curM,b);}
  else renderMenu();}
bootRestore();
window.addEventListener('load',()=>renderMath());
window.addEventListener('DOMContentLoaded',()=>renderMath());
</script>
</body>
