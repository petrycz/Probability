<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Probability, from First Principles</title>
<style>
  :root{--bg:#0d1420;--grid:#172233;--panel:#131d2c;--panel2:#182437;--ink:#e9eef6;
    --muted:#8095ab;--muted2:#5d6f85;--accent:#7ab8ff;--good:#3fb98f;--good2:#1e4a3d;--bad:#e2664f;--bad2:#4a2620;
    --gold:#e8b84b;--line:#243347;--rad:15px;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:26px 26px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;}
  .wrap{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 14px calc(24px + env(safe-area-inset-bottom));}
  header{position:sticky;top:0;z-index:10;padding:calc(12px + env(safe-area-inset-top)) 0 9px;background:linear-gradient(var(--bg) 80%,transparent);}
  .htop{display:flex;align-items:center;gap:10px;margin-bottom:9px;min-height:24px;}
  .back{color:var(--accent);font-size:14px;cursor:pointer;font-weight:500;padding:4px 2px;}
  .kick{font-weight:600;font-size:12px;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .kick.course{color:var(--accent);text-transform:uppercase;letter-spacing:.7px;font-size:11px;}
  .step{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);}
  .pbar{height:5px;border-radius:4px;background:var(--panel);overflow:hidden;border:1px solid var(--line);}
  .pbar i{display:block;height:100%;background:var(--accent);transition:width .3s;}
  main{flex:1;}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--rad);padding:18px 15px;box-shadow:0 16px 38px -26px rgba(0,0,0,.8);animation:in .3s cubic-bezier(.2,.7,.2,1);margin-top:6px;}
  @keyframes in{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:none;}}
  h1{font-weight:800;font-size:22px;letter-spacing:-.4px;margin:2px 2px 6px;line-height:1.2;}
  h2{font-weight:750;font-size:19px;letter-spacing:-.3px;margin:0 0 11px;line-height:1.28;}
  .lede{color:var(--muted);font-size:14px;line-height:1.55;margin:0 2px 15px;}
  p{font-size:15.5px;line-height:1.62;color:#d6e0ee;margin:0 0 13px;}
  p.small{font-size:13.5px;color:var(--muted);}
  em{color:var(--ink);font-style:italic;} b,strong{color:var(--ink);font-weight:650;}
  .mono{font-family:var(--mono);color:var(--accent);font-size:.94em;}
  .cy{color:var(--accent);} .gld{color:var(--gold);} .grn{color:var(--good);} .rd{color:var(--bad);}
  .eqbox{font-family:var(--mono);font-size:14.5px;line-height:1.8;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0;color:#dbe6f4;overflow-x:auto;}
  .eqbox .hl{color:var(--gold);}
  .mathrow{text-align:center;margin:14px 0;font-family:var(--mono);font-size:15px;overflow-x:auto;white-space:nowrap;}
  sub,sup{font-size:.72em;}
  canvas{width:100%;height:auto;display:block;border-radius:12px;background:#0a111b;border:1px solid var(--line);touch-action:none;}
  .readout{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .rdc{flex:1;min-width:78px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;}
  .rdc .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .rdc .v{font-family:var(--mono);font-weight:700;font-size:16px;margin-top:2px;}
  .ctrls{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap;}
  .slabel{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:74px;}
  input[type=range]{flex:1;min-width:140px;accent-color:var(--accent);height:30px;}
  .task{background:rgba(232,184,75,.08);border:1px solid rgba(232,184,75,.28);border-radius:11px;padding:12px 13px;margin:14px 0;font-size:14.5px;line-height:1.55;color:#f0e2c2;}
  .task b{color:var(--gold);font-size:11px;letter-spacing:.5px;text-transform:uppercase;display:block;margin-bottom:5px;}
  .defn{background:rgba(122,184,255,.07);border:1px solid rgba(122,184,255,.30);border-radius:11px;padding:12px 14px;margin:13px 0;font-size:14.5px;line-height:1.6;color:#dbe6f4;}
  .defn .dt{color:var(--accent);font-size:11px;letter-spacing:.5px;text-transform:uppercase;display:block;margin-bottom:6px;font-weight:700;}
  .defn+.defn{margin-top:9px;}
  .entry{display:flex;gap:9px;align-items:center;margin-top:12px;}
  .entry input{flex:1;background:var(--panel2);border:1.5px solid var(--line);border-radius:11px;color:var(--ink);font-family:var(--mono);font-size:16px;padding:12px 13px;outline:none;min-width:0;}
  .entry input:focus{border-color:var(--accent);}
  .miniout{margin-top:9px;font-size:13.5px;line-height:1.5;} .miniout.ok{color:var(--good);} .miniout.no{color:var(--bad);}
  .choices{display:grid;grid-template-columns:1fr;gap:9px;margin-top:13px;}
  .seg{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 2px;}
  .segb{font-family:var(--mono);font-size:13px;font-weight:600;padding:9px 12px;border-radius:9px;background:var(--panel2);border:1.5px solid var(--line);color:var(--muted);cursor:pointer;}
  .segb.on{border-color:var(--accent);color:var(--accent);background:#0e2530;}
  .ucircle{position:relative;}
  .choice{background:var(--panel2);border:1.5px solid var(--line);border-radius:11px;padding:13px;cursor:pointer;font-size:14px;line-height:1.4;transition:.12s;}
  .choice .cm{font-family:var(--mono);}
  .choice.correct{border-color:var(--good);background:var(--good2);color:#c7f4e3;} .choice.wrong{border-color:var(--bad);background:var(--bad2);color:#f6cdc4;} .choice.dim{opacity:.45;} .choice.locked{cursor:default;}
  .code{background:#0a1019;border:1px solid var(--line);border-radius:11px;margin:13px 0;overflow:hidden;}
  .code .ch{font-family:var(--mono);font-size:11px;color:var(--muted);padding:7px 12px;border-bottom:1px solid var(--line);background:#0c131e;letter-spacing:.4px;}
  .code pre{margin:0;padding:12px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#cfe0f2;-webkit-overflow-scrolling:touch;}
  .prob{border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin:13px 0;background:var(--panel2);}
  .prob .ph{font-weight:700;font-size:13px;color:var(--accent);letter-spacing:.3px;margin-bottom:7px;}
  .prob .lvl{float:right;font-size:10px;color:var(--muted2);border:1px solid var(--line);border-radius:20px;padding:1px 7px;letter-spacing:.4px;}
  details{margin-top:10px;border-top:1px dashed var(--line);padding-top:9px;}
  summary{cursor:pointer;color:var(--gold);font-size:13px;font-weight:600;list-style:none;}
  summary::-webkit-details-marker{display:none;} summary::before{content:'▸ ';}
  details[open] summary::before{content:'▾ ';}
  .sol{font-size:14px;line-height:1.6;color:#d0dcea;margin-top:9px;} .sol p{font-size:14px;margin:0 0 9px;}
  .reveal{margin-top:15px;border-left:3px solid var(--good);background:rgba(63,185,143,.07);border-radius:0 11px 11px 0;padding:12px 14px;animation:in .3s ease;}
  .reveal .rh{font-weight:750;font-size:13px;color:var(--good);margin-bottom:6px;}
  .reveal p{font-size:14px;color:#d7e6df;margin:0 0 8px;} .reveal p:last-child{margin:0;}
  .reveal .note{font-family:var(--mono);font-size:13px;color:var(--accent);}
  .flash{position:fixed;left:50%;top:calc(16% + env(safe-area-inset-top));transform:translateX(-50%);background:var(--good);color:#06231a;font-weight:750;font-size:14px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;z-index:50;}
  .flash.show{animation:flash 1.1s ease;}
  @keyframes flash{0%{opacity:0;transform:translate(-50%,6px);}15%{opacity:1;transform:translate(-50%,0);}80%{opacity:1;}100%{opacity:0;transform:translate(-50%,-8px);}}
  footer{position:sticky;bottom:0;padding:11px 0 calc(6px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 32%);display:flex;gap:10px;align-items:center;}
  .btn{font-weight:650;font-size:15px;border:none;border-radius:11px;padding:14px 18px;cursor:pointer;transition:.1s;font-family:var(--sans);}
  .btn:active{transform:scale(.98);}
  .btn.primary{flex:1;background:var(--accent);color:#08131b;} .btn.primary:disabled{background:var(--panel2);color:var(--muted2);cursor:default;}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .btn.hint{background:transparent;color:var(--gold);border:1px solid var(--line);}
  .hintbox{font-size:13.5px;line-height:1.55;color:#f0e2c2;background:rgba(232,184,75,.08);border:1px solid rgba(232,184,75,.25);border-radius:10px;padding:11px 13px;margin-top:12px;display:none;}
  .hintbox.show{display:block;}
  .mcard{cursor:pointer;transition:border-color .15s,transform .08s;} .mcard.lock{opacity:.55;cursor:default;}
  .mtop{display:flex;align-items:center;gap:9px;} .mnum{font-family:var(--mono);font-size:12px;color:var(--muted2);}
  .mstat{margin-left:auto;font-weight:650;font-size:11px;padding:3px 9px;border-radius:999px;}
  .mstat.done{color:var(--good);background:var(--good2);} .mstat.todo{color:var(--accent);background:rgba(122,184,255,.14);} .mstat.soon{color:var(--muted2);background:#141e2c;}
  .mtitle{font-weight:750;font-size:17px;margin:8px 0 5px;} .msub{color:var(--muted);font-size:13.5px;line-height:1.5;}
  .rvlink{color:var(--gold);cursor:pointer;font-size:12px;white-space:nowrap;}
  a.rvlink{text-decoration:none;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;}}
  .katex{font-size:1.03em;}
  .eqbox .katex-display{margin:0;}
  .eqbox .katex-display>.katex{white-space:normal;}
</style>

<body>
<div class="wrap">
  <header>
    <div class="htop"><span class="back" id="backBtn" style="display:none">‹ Menu</span><span class="kick course" id="kick">Probability, from First Principles</span><span class="step" id="stepLbl"></span></div>
    <div class="pbar" id="pbarWrap" style="display:none"><i id="pfill" style="width:0%"></i></div>
  </header>
  <main><div id="stage"></div><div class="hintbox" id="hintbox"></div></main>
  <footer id="footer" style="display:none"><button class="btn ghost" id="prevBtn" style="display:none">Back</button><button class="btn hint" id="hintBtn">Hint</button><button class="btn primary" id="contBtn" disabled>Continue</button></footer>
</div>
<div class="flash" id="flash">✓</div><script>
"use strict";
const stage=document.getElementById('stage'),hintBtn=document.getElementById('hintBtn'),contBtn=document.getElementById('contBtn'),
      hintbox=document.getElementById('hintbox'),flashEl=document.getElementById('flash'),footer=document.getElementById('footer');
let view='menu',curM=0,beat=0,unlocked=false,hints=[],hintIdx=0,recallReturn=null;
const completed={};
const MODULES=[
 {id:'p0',title:'Outcomes, Events & Counting',sub:'Sample spaces and events, the three axioms, equally likely outcomes, permutations and combinations, and inclusion–exclusion.',ready:true,
  outro:`A probability is a share of one unit of mass, assigned to events — sets of outcomes — under three axioms. When the outcomes are equally likely, probability reduces to counting, and permutations, combinations, and inclusion–exclusion do the counting.`,
  beats:[p0_recall]},
 {id:'p1',title:'Conditioning, Independence & Bayes',sub:'Conditional probability as a restricted world, the multiplication rule, total probability, Bayes’ theorem, and independence.',ready:false,outro:'',beats:[]},
 {id:'p2',title:'Discrete Random Variables',sub:'Pmf and cdf, expectation and variance, indicators and linearity; Bernoulli, binomial, geometric, categorical, and Poisson.',ready:false,outro:'',beats:[]},
 {id:'p3',title:'Continuous Random Variables',sub:'Densities as limits of histograms; uniform, exponential, Gaussian, and lognormal; transforming a variable with the $|g\'|$ factor.',ready:false,outro:'',beats:[]},
 {id:'p4',title:'Joint Distributions',sub:'Marginals and conditionals, covariance and correlation, the covariance matrix, the multivariate Gaussian, and the Jacobian density formula.',ready:false,outro:'',beats:[]},
 {id:'p5',title:'Limit Theorems & Monte Carlo',sub:'Markov, Chebyshev, and Hoeffding; the law of large numbers; the central limit theorem; Monte Carlo and importance sampling; fat tails.',ready:false,outro:'',beats:[]},
 {id:'p6',title:'Information Theory',sub:'Entropy, cross-entropy, KL divergence, mutual information, and perplexity — and softmax with cross-entropy as the loss of a language model.',ready:false,outro:'',beats:[]},
 {id:'p7',title:'Random Walks & Poisson Processes',sub:'Gambler’s ruin and the $(q/p)^z$ catch-up probability, Poisson arrivals, and the attacker calculation from the Bitcoin paper.',ready:false,outro:'',beats:[]},
 {id:'p8',title:'Markov Chains & Hidden Markov Models',sub:'Transition matrices, stationary distributions as eigenvectors, regime models, the forward algorithm and Viterbi, and expected value in MDPs.',ready:false,outro:'',beats:[]},
 {id:'p9',title:'Filtering: Bayes, Kalman & Particle Filters',sub:'Tracking a hidden state through noisy measurements: the Bayes filter, the Kalman filter, and particle filters.',ready:false,outro:'',beats:[]},
 {id:'p10',title:'Bayesian Networks',sub:'Factorizing a joint distribution over a graph, d-separation, variable elimination, and sampling-based inference.',ready:false,outro:'',beats:[]},
 {id:'p11',title:'Estimation',sub:'Maximum likelihood, MAP and priors as regularization, conjugate updating and Thompson sampling, and least squares as Gaussian MLE.',ready:false,outro:'',beats:[]},
 {id:'p12',title:'Latent Variables & Variational Inference',sub:'Mixture models and EM, the ELBO, the reparameterization trick, and the score-function gradient.',ready:false,outro:'',beats:[]},
 {id:'p13',title:'Statistical Inference',sub:'Sampling distributions, confidence intervals, hypothesis tests and p-values, the t-test, and the statistics of a Sharpe ratio.',ready:false,outro:'',beats:[]},
 {id:'a1',addon:'A1',title:'Regression in Depth',sub:'Least squares as projection, standard errors, $R^2$, and out-of-sample validation.',ready:false,outro:'',beats:[]},
 {id:'a2',addon:'A2',title:'Time Series & Cointegration',sub:'Stationarity, autocorrelation, AR(1) and mean-reversion half-life, the ADF test, and cointegration for pairs trading.',ready:false,outro:'',beats:[]},
 {id:'a3',addon:'A3',title:'Trading Performance & Kelly',sub:'Log versus simple returns, drawdowns, Kelly sizing as log-growth maximization, and bootstrap backtests.',ready:false,outro:'',beats:[]},
 {id:'a4',addon:'A4',title:'Monte Carlo in Depth',sub:'Markov chain Monte Carlo: Metropolis–Hastings, Gibbs sampling, and Hamiltonian Monte Carlo.',ready:false,outro:'',beats:[]},
];
function setHints(a){hints=a||[];hintIdx=0;hintBtn.style.display=hints.length?'block':'none';}
function unlock(){if(unlocked)return;unlocked=true;contBtn.disabled=false;}
function flash(t){flashEl.textContent=t||'✓';flashEl.className='flash show';setTimeout(()=>flashEl.className='flash',1100);}
function addReveal(html){const r=document.createElement('div');r.className='reveal';r.innerHTML=html;stage.querySelector('.card').appendChild(r);renderMath(r);unlock();}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function scrollTop(){try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){}}
function renderMath(el){try{if(window.renderMathInElement)renderMathInElement(el||stage,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false});}catch(e){}}
const SAVE_KEY='prob_fp_v1';
function saveState(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({view,curM,beat,completed}));}catch(e){}}
function loadState(){try{return JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){return null;}}
/* URL-hash position (survives refresh even when storage is blocked) */
function setHash(){try{const h=view==='module'?('#m'+curM+'b'+beat):'';if((location.hash||'')!==h)history.replaceState(null,'',h||location.pathname+location.search);}catch(e){}}
function parseHash(){const m=/^#m(\d+)b(\d+)$/.exec(location.hash||'');return m?{curM:+m[1],beat:+m[2]}:null;}

function renderMenu(){
  view='menu';footer.style.display='none';hintbox.className='hintbox';hintbox.innerHTML='';
  document.getElementById('backBtn').style.display='none';document.getElementById('pbarWrap').style.display='none';
  document.getElementById('kick').className='kick course';document.getElementById('kick').textContent='Probability, from First Principles';
  document.getElementById('stepLbl').textContent='';
  let html=`<div class="card"><h1>Probability, from First Principles</h1><p class="lede">A self-contained probability course, built on the calculus and linear-algebra courses: every rule is derived, and every distribution is built, sampled, and watched on screen. It runs from counting and conditioning through random variables, limit theorems, and information theory, into stochastic processes, estimation, and inference — the probability behind modern machine learning, the Bitcoin paper, and quantitative trading. Guided discovery, real proofs, worked problems.</p></div>`;
  MODULES.forEach((m,i)=>{const done=completed[m.id];const st=done?['done','✓ Done']:(m.ready?['todo','Start']:['soon','Soon']);
    html+=`<div class="card mcard${m.ready?'':' lock'}" data-i="${i}"><div class="mtop"><span class="mnum">${m.addon?'Add-on '+m.addon:'Module '+(i+1)}</span><span class="mstat ${st[0]}">${st[1]}</span></div>
      <div class="mtitle">${m.title}</div><div class="msub">${m.sub}</div></div>`;});
  stage.innerHTML=html;
  stage.querySelectorAll('.mcard').forEach(c=>{const i=parseInt(c.dataset.i);if(MODULES[i].ready)c.onclick=()=>openModule(i);});
  scrollTop();renderMath();saveState();setHash();
}
function openModuleAt(i,b){curM=i;beat=b;view='module';footer.style.display='flex';contBtn.style.display='';hintBtn.style.display='';
  document.getElementById('backBtn').style.display='block';document.getElementById('pbarWrap').style.display='block';
  document.getElementById('kick').className='kick';renderBeat();}
function openModule(i){openModuleAt(i,0);}
function renderBeat(){
  unlocked=false;contBtn.disabled=true;hintbox.className='hintbox';hintbox.innerHTML='';setHints([]);stage.innerHTML='';
  const M=MODULES[curM];M.beats[beat]();
  document.getElementById('kick').textContent=M.title;
  document.getElementById('stepLbl').textContent=(beat+1)+' / '+M.beats.length;
  document.getElementById('pfill').style.width=Math.round((beat+1)/M.beats.length*100)+'%';
  contBtn.textContent=beat===M.beats.length-1?'Finish':'Continue';document.getElementById('prevBtn').style.display=(beat>0||recallReturn)?'block':'none';scrollTop();renderMath();saveState();setHash();
}
hintBtn.onclick=()=>{if(hintIdx<hints.length){hintbox.innerHTML=hints[hintIdx];hintbox.className='hintbox show';hintIdx++;if(hintIdx>=hints.length)unlock();}};
contBtn.onclick=()=>{const M=MODULES[curM];if(beat<M.beats.length-1){beat++;renderBeat();}else finish();};
document.getElementById('backBtn').onclick=renderMenu;
document.getElementById('prevBtn').onclick=()=>{if(recallReturn){curM=recallReturn.mod;beat=recallReturn.beat;recallReturn=null;renderBeat();return;}if(beat>0){beat--;renderBeat();}};
function finish(){const M=MODULES[curM];completed[M.id]=true;const next=(curM+1<MODULES.length&&MODULES[curM+1].ready)?MODULES[curM+1]:null;
  footer.style.display='none';document.getElementById('pfill').style.width='100%';
  stage.innerHTML=`<div class="card" style="text-align:center;padding:30px 18px"><div style="font-size:40px">✦</div><h2 style="margin-top:8px">Module complete</h2><p>${M.outro}</p>
    <div style="display:flex;gap:10px;margin-top:14px">${next?`<button class="btn primary" id="nx">Next →</button>`:''}<button class="btn ghost" id="mn" style="${next?'':'flex:1'}">Back to menu</button></div></div>`;
  const nx=document.getElementById('nx');if(nx)nx.onclick=()=>openModule(curM+1);document.getElementById('mn').onclick=renderMenu;scrollTop();renderMath();saveState();}

/* ============ function-plotting engine ============ */
function plot(cv,o){const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height;
  const xmin=o.xmin,xmax=o.xmax,ymin=o.ymin,ymax=o.ymax;
  const px=x=>(x-xmin)/(xmax-xmin)*W, py=y=>H-(y-ymin)/(ymax-ymin)*H;
  const mx=X=>xmin+X/W*(xmax-xmin), my=Y=>ymin+(H-Y)/H*(ymax-ymin);
  function grid(){if(!ctx)return;ctx.clearRect(0,0,W,H);ctx.strokeStyle='#16202f';ctx.lineWidth=1;
    for(let x=Math.ceil(xmin);x<=xmax;x++){ctx.beginPath();ctx.moveTo(px(x),0);ctx.lineTo(px(x),H);ctx.stroke();}
    for(let y=Math.ceil(ymin);y<=ymax;y++){ctx.beginPath();ctx.moveTo(0,py(y));ctx.lineTo(W,py(y));ctx.stroke();}
    ctx.strokeStyle='#2b3a4f';ctx.lineWidth=1.5;
    if(ymin<0&&ymax>0){ctx.beginPath();ctx.moveTo(0,py(0));ctx.lineTo(W,py(0));ctx.stroke();}
    if(xmin<0&&xmax>0){ctx.beginPath();ctx.moveTo(px(0),0);ctx.lineTo(px(0),H);ctx.stroke();}}
  function curve(f,color,lw){if(!ctx)return;ctx.strokeStyle=color;ctx.lineWidth=lw||2.5;let prevY=null,started=false;const span=ymax-ymin;ctx.beginPath();

function p0_recall(){
  const lead=`<div class="card"><h2>One unit of mass, spread over the outcomes</h2>
    <p>A random experiment — a coin toss, the number of blocks mined in the next hour, tomorrow's return on a stock, the next word a language model emits — has a set of possible <b>outcomes</b>. Probability gives the outcomes shares of one fixed total, <b>1</b>: a single unit of mass, spread so that more likely outcomes carry more of it. Every object in this course is a way of spreading that one unit, and nearly every calculation is bookkeeping that keeps the total equal to 1.</p>
    <p>How the bookkeeping is done depends on what the outcomes look like, and each case runs on a tool from the earlier courses:</p>
    <div class="defn"><span class="dt">Three shapes of outcome space</span>
      <b>Countable outcomes</b> $k=0,1,2,\\dots$ — each outcome gets a share $p_k\\ge0$ (a number), and the shares are <b>added</b>: a series, $\\sum_k p_k=1$.<br><br>
      <b>A continuum of outcomes</b> $x\\ge0$ — a single point carries no mass. Instead a <b>density</b> $f(x)$, a function of the position $x$, says how thickly the mass is spread, and the mass of an interval is an <b>area</b>: $\\int_a^b f(x)\\,dx$, with $\\int_0^\\infty f(x)\\,dx=1$.<br><br>
      <b>Several quantities at once</b> $(x,y)$, pushed through a linear map $A$ — the map stretches every area by $|\\det A|$, so the density must shrink by that same factor for the total to stay 1.</div>
    <p>Switch between the three cases below and work every control. In each case the shaded mass is exactly 1, however the controls are set.</p>
    <div class="seg" id="segmode"></div>
    <canvas id="cv" width="640" height="340"></canvas>
    <div class="ctrls" id="ctl"></div>
    <div class="readout" id="rd"></div>
    <p class="small" id="cap" style="margin-top:9px"></p>
    <div class="task"><b>Keep the total at 1</b>In <b>Map</b> mode the unit square carries a uniform density of height 1, so its mass is $1\\times1=1$. Drag the two column tips until the map is $A=\\left[\\begin{smallmatrix}2&0\\\\0&3\\end{smallmatrix}\\right]$. What height must the density have on the image so that the total mass is still 1?</div>
    <div id="gate"><div class="entry"><input id="ni" inputmode="decimal" placeholder="e.g. 0.25 or 1/4"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div></div>`;
  recallFrom(`Probability runs on tools from the earlier courses: series add up the chances of countable outcomes, integrals measure chances spread over a continuum, and determinants and Jacobians track how a change of variables stretches area — and with it, density. Optimization returns for estimation, eigenvectors for Markov chains, and symmetric matrices and quadratic forms for covariance.`,
    PRIOR_KEYS,RECALL_HINT,{lead,gated:true});

  const cv=document.getElementById('cv'),ctl=document.getElementById('ctl'),rd=document.getElementById('rd'),cap=document.getElementById('cap');
  const MODES=[['sum','Sum'],['int','Integral'],['map','Map']];
  let mode='sum',r=0.6,N=3,lam=1.5,bcut=1,c1=[1,0],c2=[0,1],pl=null,dragTip=-1;
  function arrow(x0,y0,x1,y1,col,w){const ctx=pl&&pl.ctx;if(!ctx)return;const X0=pl.px(x0),Y0=pl.py(y0),X1=pl.px(x1),Y1=pl.py(y1);
    ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w||3;ctx.beginPath();ctx.moveTo(X0,Y0);ctx.lineTo(X1,Y1);ctx.stroke();
    const a=Math.atan2(Y1-Y0,X1-X0),h=12;if(Math.hypot(X1-X0,Y1-Y0)<4)return;ctx.beginPath();ctx.moveTo(X1,Y1);
    ctx.lineTo(X1-h*Math.cos(a-0.4),Y1-h*Math.sin(a-0.4));ctx.lineTo(X1-h*Math.cos(a+0.4),Y1-h*Math.sin(a+0.4));ctx.closePath();ctx.fill();}
  function rdc(k,id){return `<div class="rdc"><div class="k">${k}</div><div class="v" id="${id}">—</div></div>`;}
  function slider(lbl,id,min,max,step,val){return `<span class="slabel" id="${id}L">${lbl}</span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}">`;}
  function meter(frac){const ctx=pl&&pl.ctx;if(!ctx)return;const x0=10,w=pl.W-20,y=8,h=14;
    ctx.fillStyle='#16202f';ctx.fillRect(x0,y,w,h);ctx.fillStyle='#e8b84b';ctx.fillRect(x0,y,w*Math.max(0,Math.min(1,frac)),h);
    ctx.strokeStyle='#2b3a4f';ctx.lineWidth=1;ctx.strokeRect(x0,y,w,h);}

  function setup(){
    cv.height=mode==='map'?520:340;
    if(mode==='sum'){pl=plot(cv,{xmin:-0.8,xmax:15.8,ymin:-0.04,ymax:1.12});
      ctl.innerHTML=slider('r = 0.60','rs',0.05,0.95,0.01,r);
      rd.innerHTML=rdc('shares through k = N','r1')+rdc('1 − r^(N+1)','r2')+rdc('all shares','r3');
      cap.innerHTML=`Bars are the shares $p_k=(1-r)\\,r^k$ — each is $r$ times the one before. <b>Drag across the plot</b> to choose $N$; the gold bars are $p_0,\\dots,p_N$ and the meter on top fills to their running total $S_N$. The geometric series gives $S_N=(1-r)\\cdot\\frac{1-r^{N+1}}{1-r}=1-r^{N+1}$, which climbs to exactly $1$ as $N\\to\\infty$, for every $r$ between 0 and 1.`;}
    else if(mode==='int'){pl=plot(cv,{xmin:-0.3,xmax:6,ymin:-0.12,ymax:3.6});
      ctl.innerHTML=slider('λ = 1.5','ls',0.3,3,0.1,lam);
      rd.innerHTML=rdc('area from 0 to b','r1')+rdc('height f(0) = λ','r2')+rdc('area from 0 to ∞','r3');
      cap.innerHTML=`The curve is the density $f(x)=\\lambda e^{-\\lambda x}$, where $\\lambda\\gt0$ is a fixed constant you set with the slider and $x\\ge0$ is the position. <b>Drag across the plot</b> to move the cut $b$; the shaded area is $\\int_0^b\\lambda e^{-\\lambda x}\\,dx=1-e^{-\\lambda b}$, and the meter shows it. The height at $0$ is $\\lambda$, which exceeds 1 once $\\lambda\\gt1$: a density's <em>height</em> is not a probability — only <em>areas</em> under it are.`;}
    else {pl=plot(cv,{xmin:-1.25,xmax:4.25,ymin:-0.75,ymax:-0.75+5.5*520/640});
      ctl.innerHTML='';
      rd.innerHTML=rdc('det A','r1')+rdc('image area |det A|','r2')+rdc('density on image','r3')+rdc('mass','r4');
      cap.innerHTML=`The dashed unit square carries density $1$. The map $A$ has columns $A\\mathbf e_1$ (gold) and $A\\mathbf e_2$ (blue) — the images of the two edges — so the square lands on the parallelogram they span, of area $|\\det A|$. <b>Drag either tip</b> (it snaps to quarter steps). A uniform density's mass is height $\\times$ area; the shading darkens or fades as the height adjusts to keep the mass at $1$.`;}
    renderMath(cap);
    const s=ctl.querySelector('input');
    if(s)s.oninput=()=>{const v=parseFloat(s.value);if(mode==='sum'){r=v;document.getElementById('rsL').textContent='r = '+r.toFixed(2);}else{lam=v;document.getElementById('lsL').textContent='λ = '+lam.toFixed(1);}draw();};
    draw();
  }
  function draw(){
    if(mode==='sum'){pl.grid();const ctx=pl.ctx;let S=0;
      for(let k=0;k<=15;k++){const p=(1-r)*Math.pow(r,k);if(k<=N)S+=p;
        if(ctx){ctx.fillStyle=k<=N?'#e8b84b':'#2c3d55';ctx.fillRect(pl.px(k-0.36),pl.py(p),pl.px(k+0.36)-pl.px(k-0.36),pl.py(0)-pl.py(p));}}
      pl.vline(N+0.5,'#3a4c66',true);meter(S);
      document.getElementById('r1').textContent='S_'+N+' = '+S.toFixed(4);
      document.getElementById('r2').textContent=(1-Math.pow(r,N+1)).toFixed(4);
      document.getElementById('r3').textContent='1';}
    else if(mode==='int'){pl.grid();const ctx=pl.ctx,f=x=>x>=0?lam*Math.exp(-lam*x):NaN;
      if(ctx){ctx.fillStyle='rgba(232,184,75,.30)';ctx.beginPath();ctx.moveTo(pl.px(0),pl.py(0));
        for(let i=0;i<=200;i++){const x=bcut*i/200;ctx.lineTo(pl.px(x),pl.py(f(x)));}ctx.lineTo(pl.px(bcut),pl.py(0));ctx.closePath();ctx.fill();}
      pl.curve(f,'#7ab8ff');pl.vline(bcut,'#e8b84b',true);pl.point(bcut,f(bcut),'#e8b84b',5);
      const A=1-Math.exp(-lam*bcut);meter(A);
      document.getElementById('r1').textContent=A.toFixed(4);
      document.getElementById('r2').textContent=lam.toFixed(1);
      document.getElementById('r3').textContent='1';}
    else {pl.grid();const ctx=pl.ctx,det=c1[0]*c2[1]-c1[1]*c2[0],ar=Math.abs(det);
      if(ctx){ctx.fillStyle='rgba(122,184,255,.18)';ctx.fillRect(pl.px(0),pl.py(1),pl.px(1)-pl.px(0),pl.py(0)-pl.py(1));
        ctx.setLineDash([5,4]);ctx.strokeStyle='#5d6f85';ctx.lineWidth=1.5;ctx.strokeRect(pl.px(0),pl.py(1),pl.px(1)-pl.px(0),pl.py(0)-pl.py(1));ctx.setLineDash([]);
        if(ar>1e-9){const al=Math.max(0.04,Math.min(0.85,0.42/ar));const P=[[0,0],c1,[c1[0]+c2[0],c1[1]+c2[1]],c2];
          ctx.fillStyle='rgba(232,184,75,'+al.toFixed(3)+')';ctx.beginPath();P.forEach((q,i)=>{const X=pl.px(q[0]),Y=pl.py(q[1]);if(i)ctx.lineTo(X,Y);else ctx.moveTo(X,Y);});ctx.closePath();ctx.fill();
          ctx.strokeStyle='#e8b84b';ctx.lineWidth=1.5;ctx.stroke();}}
      arrow(0,0,c1[0],c1[1],'#e8b84b',3);arrow(0,0,c2[0],c2[1],'#7ab8ff',3);
      pl.point(c1[0],c1[1],'#e8b84b',7);pl.point(c2[0],c2[1],'#7ab8ff',7);
      const fmt=v=>(Math.abs(v-Math.round(v))<1e-9?String(Math.round(v)):v.toFixed(4));
      document.getElementById('r1').textContent=fmt(det);
      document.getElementById('r2').textContent=fmt(ar);
      document.getElementById('r3').textContent=ar>1e-9?(1/ar).toFixed(4):'∞ (flattened)';
      document.getElementById('r4').textContent=ar>1e-9?'1':'—';}
  }
  function canvasXY(e){const rc=cv.getBoundingClientRect();const w=Math.max(1,rc.width),h=rc.height||w*cv.height/cv.width;
    return [(e.clientX-rc.left)*(cv.width/w),(e.clientY-rc.top)*(cv.height/h)];}
  function applyPointer(e){const [X,Y]=canvasXY(e);
    if(mode==='sum'){N=Math.max(0,Math.min(15,Math.round(pl.mx(X))));}
    else if(mode==='int'){bcut=Math.max(0,Math.min(6,pl.mx(X)));}
    else if(dragTip>=0){const q=[Math.max(-1,Math.min(4,Math.round(pl.mx(X)*4)/4)),Math.max(-0.5,Math.min(3.5,Math.round(pl.my(Y)*4)/4))];
      if(dragTip===0)c1=q;else c2=q;}
    draw();}
  let down=false;cv.style.touchAction='none';
  cv.addEventListener('pointerdown',e=>{down=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}
    if(mode==='map'){const [X,Y]=canvasXY(e);const d=c=>Math.hypot(pl.px(c[0])-X,pl.py(c[1])-Y);dragTip=d(c1)<=d(c2)?0:1;}
    applyPointer(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(down){e.preventDefault();applyPointer(e);}});
  const end=()=>{down=false;dragTip=-1;};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);

  const seg=document.getElementById('segmode');
  seg.innerHTML=MODES.map(m=>`<span class="segb${m[0]===mode?' on':''}" data-m="${m[0]}">${m[1]}</span>`).join('');
  seg.querySelectorAll('.segb').forEach(b=>b.onclick=()=>{mode=b.dataset.m;seg.querySelectorAll('.segb').forEach(x=>x.classList.toggle('on',x===b));setup();});
  setup();

  const host=document.getElementById('gate');
  numChk(host,1/6,()=>{addReveal(`<div class="rh">✓ Height 1/6</div>
    <p>The columns $(2,0)$ and $(0,3)$ span a $2\\times3$ rectangle, so the image has area $|\\det A|=2\\cdot3-0\\cdot0=6$. For a uniform density, mass $=$ height $\\times$ area, so the new height $h$ satisfies $h\\cdot6=1$, giving $h=\\tfrac16$. The same reasoning works for any invertible $A$: the map multiplies every area by $|\\det A|$, so it divides the density by $|\\det A|$,</p>
    <div class="eqbox">$$f_{\\text{image}}=\\frac{f_{\\text{original}}}{|\\det A|}.$$</div>
    <p>A curved map stretches different places by different amounts, and $|\\det A|$ becomes the local Jacobian factor $|\\det J|$ — the same factor as in $dx\\,dy=|\\det J|\\,du\\,dv$. Module 5 derives the full density formula from it. That formula is the engine of <b>normalizing flows</b>: a generative model pushes a simple Gaussian through a chain of invertible maps and tracks $\\log|\\det J|$ at every layer to keep the total probability at 1.</p>`);},
    s=>{const t=s.replace(/\s/g,'');const m=t.split('/');let v=m.length===2?parseFloat(m[0])/parseFloat(m[1]):parseFloat(t);if(Math.abs(v-1/6)<6e-4)v=1/6;return v;});
  setHints([`For a uniform density, mass = height × area — and the mass has to stay 1. Set the map in Map mode and read the image's area.`,
    `The image is a 2-by-3 rectangle, so its area is |det A| = 6. Solve height × 6 = 1.`]);
}
/* ================= boot ================= */
window.onerror=function(m,s,l){console.error(m,l);};
function bootRestore(){const s=loadState();
  if(s&&s.completed)Object.assign(completed,s.completed);
  const hp=parseHash();
  let t=null;
  if(hp&&MODULES[hp.curM]&&MODULES[hp.curM].ready)t={curM:hp.curM,beat:hp.beat};
  else if(s&&s.view==='module'&&typeof s.curM==='number'&&MODULES[s.curM]&&MODULES[s.curM].ready)t={curM:s.curM,beat:s.beat};
  if(t){const b=Math.max(0,Math.min(t.beat|0,MODULES[t.curM].beats.length-1));openModuleAt(t.curM,b);}
  else renderMenu();}
bootRestore();
window.addEventListener('load',()=>renderMath());
window.addEventListener('DOMContentLoaded',()=>renderMath());
</script>
</body>
