/* ================= MODULE 1 — FUNCTIONS & THE BUILDING BLOCKS ================= */
function c0_intro(){
  stage.innerHTML=`<div class="card"><h2>A function is a machine: one input, one output</h2>
    <p>Calculus studies how quantities change, and the objects that change are <b>functions</b>. Start from the definition, assuming only algebra. A <b>function</b> <span class="mono">f</span> is a rule that assigns to each input <em>exactly one</em> output, written <span class="mono">f(x)</span>. The set of allowed inputs is the <b>domain</b>; the set of outputs it can produce is the <b>range</b>.</p>
    <p>"Exactly one output" is the whole content — it's what the <b>vertical line test</b> checks: a graph is a function precisely when no vertical line crosses it twice. And the domain is a real constraint: <span class="mono">1/(x−2)</span> can't take <span class="mono">x = 2</span>, and <span class="mono">√(x−1)</span> needs <span class="mono">x ≥ 1</span> to stay real.</p>
    <p>Below is <span class="mono">f(x) = √(x − 1)</span>. Drag <span class="cy">x</span> — notice the curve simply <em>doesn't exist</em> left of 1, because those inputs aren't in the domain.</p>
    <canvas id="cv" width="640" height="330"></canvas>
    <div class="readout"><div class="rdc"><div class="k">x</div><div class="v" id="xv">—</div></div><div class="rdc"><div class="k">f(x) = √(x−1)</div><div class="v" id="fv">—</div></div></div>
    <div class="task"><b>Find the domain's edge</b>What is the smallest input <span class="mono">x</span> for which <span class="mono">f(x) = √(x − 1)</span> is defined?</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-2,xmax:6,ymin:-1,ymax:3});
  const f=x=>x>=1?Math.sqrt(x-1):NaN;let xc=3;
  function draw(){pl.grid();pl.curve(f,'#7ab8ff');pl.vline(xc,'#3a4c66',true);
    const y=f(xc);if(isFinite(y))pl.point(xc,y,'#e8b84b',5);
    document.getElementById('xv').textContent=xc.toFixed(2);
    document.getElementById('fv').textContent=isFinite(y)?y.toFixed(3):'undefined';}
  xdrag(cv,pl,x=>{xc=x;draw();});draw();
  numChk(stage.querySelector('.card'),1,()=>{addReveal(`<div class="rh">✓ x = 1</div><p><span class="mono">√(x−1)</span> is real only when the inside is <span class="mono">≥ 0</span>, i.e. <span class="mono">x − 1 ≥ 0</span>, so <span class="mono">x ≥ 1</span>. The domain is <span class="mono">[1, ∞)</span>, and the graph starts exactly at x = 1 — the leftmost point where a valid output exists. Domain is not a technicality; it's where the function lives.</p>`);});
  setHints([`√ of a negative number isn't real. Set the inside x − 1 ≥ 0 and solve.`,`x − 1 ≥ 0 ⟹ x ≥ 1.`]);
}
function c0_library(){
  stage.innerHTML=`<div class="card"><h2>The building-block functions</h2>
    <p>Nearly everything we differentiate is assembled from a small library. Meet them by shape — tap to switch:</p>
    <div class="seg" id="seg"></div>
    <canvas id="cv" width="640" height="330"></canvas>
    <p class="small" id="obs" style="margin-top:8px"></p>
    <div class="task"><b>Unify the notation</b>The square root <span class="mono">√x</span> is the same as <span class="mono">x</span> raised to what power? (Enter as a decimal.)</div>
    <div class="entry"><input id="ni" inputmode="decimal" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-3.5,xmax:3.5,ymin:-3,ymax:5});
  const lib={
    'line':{f:x=>0.8*x+0.5,note:'Linear <span class="mono">mx + b</span>: constant slope m, y-intercept b. A degree-1 polynomial — the simplest changing function.'},
    'parabola':{f:x=>x*x-1,note:'Quadratic <span class="mono">x² − 1</span>: a degree-2 polynomial. Polynomials are sums of power terms; degree n means at most n crossings of the x-axis.'},
    'cubic':{f:x=>0.4*x*x*x,note:'Cubic <span class="mono">0.4x³</span>: a power function xⁿ. Odd powers flip sign across 0; even powers stay positive.'},
    '1/x':{f:x=>Math.abs(x)<0.08?NaN:1/x,note:'Rational <span class="mono">1/x</span>: a ratio of polynomials. It blows up where the denominator hits 0 (here x = 0) — a vertical asymptote.'},
    'sqrt':{f:x=>x>=0?Math.sqrt(x):NaN,note:'Root <span class="mono">√x = x^(1/2)</span>: a power function with a fractional exponent, defined only for x ≥ 0.'}
  };
  let sel='parabola';
  function draw(){pl.grid();pl.curve(lib[sel].f,'#7ab8ff');document.getElementById('obs').innerHTML=lib[sel].note;}
  function build(){document.getElementById('seg').innerHTML=Object.keys(lib).map(k=>`<span class="segb ${k===sel?'on':''}" data-k="${k}">${k}</span>`).join('');
    document.querySelectorAll('#seg .segb').forEach(b=>b.onclick=()=>{sel=b.dataset.k;build();draw();});}
  build();draw();
  numChk(stage.querySelector('.card'),0.5,()=>{addReveal(`<div class="rh">✓ ½ = 0.5</div><p><span class="mono">√x = x^(1/2)</span>. Writing roots as fractional powers is the trick that lets one rule — the power rule <span class="mono">(xⁿ)′ = nxⁿ⁻¹</span> — handle roots, reciprocals (<span class="mono">1/x = x⁻¹</span>), and polynomials all at once. The whole library collapses into "power functions and their combinations."</p>`);},s=>parseFloat(s));
  setHints([`√x means "the number whose square is x." As a power, squaring is exponent 2, so square-rooting is exponent...`,`√x = x^(1/2) = x^0.5.`]);
}
function c0_compose(){
  stage.innerHTML=`<div class="card"><h2>Combining and composing functions</h2>
    <p>From the building blocks we assemble everything by four combinations — <span class="mono">f+g</span>, <span class="mono">f−g</span>, <span class="mono">f·g</span>, <span class="mono">f/g</span> (computed input by input) — and one more that matters most for calculus: <b>composition</b>.</p>
    <p><b>Composition</b> <span class="mono">f(g(x))</span> feeds the output of one function into another — an inner function <span class="mono">g</span> wrapped by an outer function <span class="mono">f</span>. It's written <span class="mono">(f∘g)(x)</span>. This nesting is exactly what the <em>chain rule</em> will differentiate, so it's worth seeing clearly now.</p>
    <div class="eqbox">g(x) = x + 3&nbsp;&nbsp;(inner)&nbsp;&nbsp;·&nbsp;&nbsp;f(u) = u²&nbsp;&nbsp;(outer)&nbsp;&nbsp;⟹&nbsp;&nbsp;f(g(x)) = (x + 3)²</div>
    <p>Order matters: <span class="mono">f(g(x))</span> and <span class="mono">g(f(x))</span> are usually different functions. Also worth knowing — the standard <b>transformations</b>: <span class="mono">f(x)+c</span> shifts up, <span class="mono">f(x+c)</span> shifts left, <span class="mono">c·f(x)</span> stretches vertically, <span class="mono">f(−x)</span> reflects across the y-axis.</p>
    <div class="task"><b>Compose, and mind the order</b>With <span class="mono">g(x) = x + 3</span> and <span class="mono">f(u) = u²</span>, compute <span class="mono">f(g(1))</span>.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  numChk(stage.querySelector('.card'),16,()=>{addReveal(`<div class="rh">✓ 16</div><p>Inner first: <span class="mono">g(1) = 1 + 3 = 4</span>. Then outer: <span class="mono">f(4) = 4² = 16</span>. Compare the reverse: <span class="mono">g(f(1)) = g(1) = 1 + 3 = 4</span> — completely different. Composition is not commutative, which is exactly why the chain rule has to track <em>which</em> function is inside. This nested structure is the single most important thing to carry into the derivative.</p>`);});
  setHints([`Work inside-out: compute g(1) first, then apply f to that result.`,`g(1)=4, then f(4)=4²=16.`]);
}
function c0_explog(){
  stage.innerHTML=`<div class="card"><h2>Exponentials, logarithms, and inverses</h2>
    <p><b>Exponential functions</b> <span class="mono">aˣ</span> extend repeated multiplication to all real inputs. For <span class="mono">a &gt; 1</span> they grow explosively (populations, interest, anything whose rate is proportional to its size); for <span class="mono">0 &lt; a &lt; 1</span> they decay. Their defining algebra:</p>
    <div class="eqbox">aˣ · aʸ = aˣ⁺ʸ&nbsp;&nbsp;·&nbsp;&nbsp;(aˣ)ʸ = aˣʸ&nbsp;&nbsp;·&nbsp;&nbsp;a⁰ = 1</div>
    <p>One base is special. There's a value <span class="mono">a ≈ 2.718</span>, called <span class="mono">e</span>, for which the function grows at a rate exactly equal to its own height (<span class="mono">dy/dx = y</span>). That self-reproducing property makes <span class="mono">eˣ</span> the natural language of growth — we'll pin <span class="mono">e</span> down rigorously in Module 6, once we have the integral.</p>
    <p><b>Inverse functions</b> undo each other: if <span class="mono">f</span> is one-to-one, its inverse <span class="mono">f⁻¹</span> reverses it, and their graphs are mirror images across the line <span class="mono">y = x</span>. The <b>logarithm</b> <span class="mono">log_a</span> is the inverse of <span class="mono">aˣ</span>: it answers "a to what power gives this?" The exponential laws become the <b>log laws</b>:</p>
    <div class="eqbox">log(xy) = log x + log y&nbsp;&nbsp;·&nbsp;&nbsp;log(xᵖ) = p·log x&nbsp;&nbsp;·&nbsp;&nbsp;log(1) = 0</div>
    <p>The natural log <span class="mono">ln = log_e</span> is the inverse of <span class="mono">eˣ</span>. (It's the transcendental whose rigorous definition we defer.)</p>
    <div class="task"><b>Use a log law</b>Given <span class="mono">log 2 = 0.30</span> and <span class="mono">log 3 = 0.48</span>, find <span class="mono">log 6</span>.</div>
    <div class="entry"><input id="ni" inputmode="decimal" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  numChk(stage.querySelector('.card'),0.78,()=>{addReveal(`<div class="rh">✓ 0.78</div><p>Since <span class="mono">6 = 2·3</span>, the product law gives <span class="mono">log 6 = log 2 + log 3 = 0.30 + 0.48 = 0.78</span>. Logs turn multiplication into addition — that's their whole reason for existing, and it's why <span class="mono">ln</span> will show up whenever a product needs to be broken apart under differentiation.</p>`);},s=>parseFloat(s));
  setHints([`6 factors as 2 × 3. Which log law turns a product into a sum?`,`log 6 = log(2·3) = log 2 + log 3 = 0.30 + 0.48.`]);
}
function c0_trig(){
  stage.innerHTML=`<div class="card"><h2>Trigonometry, from the unit circle</h2>
    <p>The trig functions are the last building block, and we define them the way calculus needs — <b>geometrically, on the unit circle</b> (the circle of radius 1 centered at the origin). For an angle <span class="mono">θ</span> measured counter-clockwise from the positive x-axis, the point where it meets the circle has coordinates</p>
    <div class="eqbox">(cos θ, sin θ)&nbsp;&nbsp;<span style="color:#5d7186">cos θ = the x-coordinate, sin θ = the y-coordinate</span></div>
    <p>Drag the point around the circle and watch its coordinates <em>be</em> cosine and sine.</p>
    <canvas id="cv" width="640" height="360"></canvas>
    <div class="readout"><div class="rdc"><div class="k">θ (radians)</div><div class="v" id="tv">—</div></div><div class="rdc"><div class="k">cos θ</div><div class="v" id="cv2">—</div></div><div class="rdc"><div class="k">sin θ</div><div class="v" id="sv">—</div></div></div>
    <p class="small" style="margin-top:10px"><b>Radians</b> are the key choice: an angle in radians <em>is</em> the arc length it sweeps on the unit circle (a full turn = <span class="mono">2π</span>). That identification is exactly what will make <span class="mono">(sin θ)/θ → 1</span> for small θ — the limit behind the sine derivative. Two facts we'll lean on: the Pythagorean identity <span class="mono">sin²θ + cos²θ = 1</span> (the point is on the unit circle), and the <b>angle-addition formula</b> <span class="mono">sin(A+B) = sin A cos B + cos A sin B</span>.</p>
    <p class="small" style="margin-top:6px">A handful of <b>exact values</b> recur constantly, read off the 45-45-90 and 30-60-90 triangles inscribed in the circle. For <span class="mono">θ = 0, π/6, π/4, π/3, π/2</span>: &nbsp;<span class="mono">sin θ = 0, ½, √2⁄2, √3⁄2, 1</span> &nbsp;and&nbsp; <span class="mono">cos θ = 1, √3⁄2, √2⁄2, ½, 0</span> (cosine is sine run backwards — the two are a quarter-turn apart).</p>
    <div class="task"><b>Read the circle</b>At a quarter turn, <span class="mono">θ = π/2</span> (about 1.571), what is <span class="mono">sin θ</span>?</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  const cv=document.getElementById('cv');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height,cx=W/2,cy=H/2,R=130;
  let th=0.9;
  function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='#16202f';ctx.lineWidth=1;for(let gx=cx%40;gx<W;gx+=40){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke();}for(let gy=cy%40;gy<H;gy+=40){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();}
    ctx.strokeStyle='#2b3a4f';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(W,cy);ctx.moveTo(cx,0);ctx.lineTo(cx,H);ctx.stroke();
    ctx.strokeStyle='#3a4c66';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();
    const px=cx+R*Math.cos(th),py=cy-R*Math.sin(th);
    ctx.strokeStyle='#e2664f';ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px,cy);ctx.stroke();
    ctx.strokeStyle='#3fb98f';ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(cx,py);ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle='#7ab8ff';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(px,py);ctx.stroke();
    ctx.fillStyle='#e8b84b';ctx.beginPath();ctx.arc(px,py,6,0,7);ctx.fill();
    ctx.fillStyle='#e2664f';ctx.font='600 13px '+getComputedStyle(document.body).fontFamily;ctx.fillText('cos θ',(px+cx)/2-16,cy+16);
    ctx.fillStyle='#3fb98f';ctx.fillText('sin θ',px+ (Math.cos(th)>=0?8:-40),(py+cy)/2);
    let t=((th%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
    document.getElementById('tv').textContent=t.toFixed(3);
    document.getElementById('cv2').textContent=Math.cos(th).toFixed(3);
    document.getElementById('sv').textContent=Math.sin(th).toFixed(3);}
  let dragging=false;cv.style.touchAction='none';
  function setA(e){const r=cv.getBoundingClientRect();const mx=(e.clientX-r.left)*(W/Math.max(1,r.width))-cx;const my=cy-(e.clientY-r.top)*(H/Math.max(1,r.height));th=Math.atan2(my,mx);draw();}
  cv.addEventListener('pointerdown',e=>{dragging=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}setA(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(dragging){e.preventDefault();setA(e);}});
  const end=()=>dragging=false;cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  draw();
  numChk(stage.querySelector('.card'),1,()=>{addReveal(`<div class="rh">✓ sin(π/2) = 1</div><p>A quarter turn lands the point at the top of the circle, <span class="mono">(0, 1)</span> — so <span class="mono">cos(π/2) = 0</span> and <span class="mono">sin(π/2) = 1</span>. Reading sine and cosine straight off the coordinates is the whole definition. This geometric picture is what makes the derivative of sine provable in Module 3 — no circular reasoning, just the unit circle, radians, and the angle-addition formula stated above.</p>`);});
  setHints([`A quarter turn puts the point at the very top of the unit circle. What's the y-coordinate there?`,`The top point is (0, 1), so sin = 1.`]);
}
function c0_problems(){
  stage.innerHTML=`<div class="card"><h2>Problem set</h2>
    <p>Algebra/precalculus level — the foundation everything rests on. Paper first; solutions fold open.</p>

    <div class="prob"><span class="lvl">domain</span><div class="ph">Problem 1</div>
    <p>Find the domain of <span class="mono">f(x) = √(x − 2) / (x − 5)</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Two constraints. The root needs <span class="mono">x − 2 ≥ 0</span>, i.e. <span class="mono">x ≥ 2</span>. The denominator can't be zero, so <span class="mono">x ≠ 5</span>. Combined domain: <span class="mono">[2, 5) ∪ (5, ∞)</span> — everything from 2 up, with a hole punched at 5.</p></div></details></div>

    <div class="prob"><span class="lvl">composition</span><div class="ph">Problem 2</div>
    <p>With <span class="mono">f(x) = x²</span> and <span class="mono">g(x) = 2x + 1</span>, find both <span class="mono">f(g(x))</span> and <span class="mono">g(f(x))</span>, and confirm they differ.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p><span class="mono">f(g(x)) = (2x+1)² = 4x² + 4x + 1</span>. <span class="mono">g(f(x)) = 2(x²) + 1 = 2x² + 1</span>. Different functions — e.g. at x=1, the first is 9, the second is 3. Composition order matters, which the chain rule must respect.</p></div></details></div>

    <div class="prob"><span class="lvl">inverse</span><div class="ph">Problem 3</div>
    <p>Find the inverse of <span class="mono">f(x) = 3x − 1</span>, and verify <span class="mono">f(f⁻¹(x)) = x</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Set <span class="mono">y = 3x − 1</span> and solve for x: <span class="mono">x = (y+1)/3</span>. So <span class="mono">f⁻¹(x) = (x+1)/3</span>. Check: <span class="mono">f(f⁻¹(x)) = 3·(x+1)/3 − 1 = (x+1) − 1 = x</span> ✓. (Graphically, f⁻¹ is f reflected across y = x.)</p></div></details></div>

    <div class="prob"><span class="lvl">log laws</span><div class="ph">Problem 4</div>
    <p>Solve <span class="mono">2ˣ = 32</span> for x, then simplify <span class="mono">log(x³) − log(x)</span> to a single term.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p><span class="mono">32 = 2⁵</span>, so <span class="mono">2ˣ = 2⁵ ⟹ x = 5</span> (take log base 2, or recognize the power). For the second: <span class="mono">log(x³) − log(x) = 3log x − log x = 2log x</span> (power law, then subtract). Equivalently <span class="mono">log(x³/x) = log(x²) = 2log x</span>.</p></div></details></div>

    <div class="prob"><span class="lvl">unit circle</span><div class="ph">Problem 5</div>
    <p>Give the exact values of <span class="mono">cos θ</span> and <span class="mono">sin θ</span> at <span class="mono">θ = π/3</span> (60°), and verify the Pythagorean identity.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>At <span class="mono">π/3</span>: <span class="mono">cos(π/3) = 1/2</span>, <span class="mono">sin(π/3) = √3/2</span>. Check: <span class="mono">(1/2)² + (√3/2)² = 1/4 + 3/4 = 1</span> ✓ — the point lies on the unit circle, as it must.</p></div></details></div>

    <div class="prob"><span class="lvl">angle addition</span><div class="ph">Problem 6</div>
    <p>Use the angle-addition formula to simplify <span class="mono">sin(θ + π/2)</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p><span class="mono">sin(θ + π/2) = sin θ cos(π/2) + cos θ sin(π/2) = sin θ·0 + cos θ·1 = cos θ</span>. So shifting sine left by a quarter turn gives cosine — the two are the same wave, offset by π/2. (This is why "sine and cosine" are really one function seen from two starting points.)</p></div></details></div>

    <div class="prob"><span class="lvl">challenge</span><div class="ph">Problem 7</div>
    <p>Explain why <span class="mono">(cos t, sin t)</span>, as <span class="mono">t</span> runs from 0 to 2π, traces the entire unit circle exactly once, and why its speed around the circle is constant.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>By definition <span class="mono">(cos t, sin t)</span> is the point at angle t on the unit circle, so as t increases from 0 to 2π the angle sweeps one full turn — covering every point once and returning to the start. Distance <span class="mono">√(cos²t + sin²t) = 1</span> confirms it stays on the circle. Because t is measured in <em>radians</em> (arc length), equal increments of t sweep equal arc lengths, so the point moves at constant speed — the arc covered from 0 to t is exactly t. This constant-speed, radian parametrization is precisely what makes the calculus of sine and cosine clean.</p></div></details></div>
  </div>`;
  setHints([]);unlock();
}
/* ================= MODULE 1 — LIMITS & CONTINUITY ================= */
function c1_intro(){
  stage.innerHTML=`<div class="card"><h2>Calculus is built on one idea: getting arbitrarily close</h2>
    <p>All of calculus rests on two questions, and both are answered by the same tool. <b>How fast is something changing at an instant?</b> (the derivative) and <b>how much accumulates over an interval?</b> (the integral). Neither can be answered by ordinary algebra, because both ask about a process that never quite completes — and that process is the <b>limit</b>.</p>
    <p>Take instantaneous speed. Average speed over an interval is easy: distance ÷ time. But "speed at exactly <span class="mono">t = 2</span>" divides zero distance by zero time. The fix is to compute average speed over shorter and shorter intervals and ask what value it <em>approaches</em>. Same with the slope of a curve at a point: take the slope of a line through two nearby points (a secant), then slide the second point in — the secant slopes approach the <b>tangent</b> slope.</p>
    <div class="eqbox">slope of secant = <sup>f(x) − f(a)</sup>⁄<sub>x − a</sub>&nbsp;&nbsp;→&nbsp;&nbsp;slope of tangent, as x → a</div>
    <p>That arrow "→" is the whole subject in miniature: approach, never arrive, and take the value you're heading toward. This module makes "approach" precise — first intuitively, then with the rigorous <b>ε-δ</b> definition — and defines <b>continuity</b>, the property of having no breaks. Get this right and the derivative and integral become easy; skip it and they stay mysterious.</p></div>`;
  setHints([]);unlock();
}
function c1_intuitive(){
  stage.innerHTML=`<div class="card"><h2>Approaching a value — even where the function isn't defined</h2>
    <p>Here's the key subtlety the limit captures. Consider <span class="mono">f(x) = (x² − 1)/(x − 1)</span>. At <span class="mono">x = 1</span> it's <span class="mono">0/0</span> — <em>undefined</em>. But everywhere else it simplifies: <span class="mono">(x−1)(x+1)/(x−1) = x + 1</span>. So the graph is the line <span class="mono">x + 1</span> with a single <b>hole</b> punched at <span class="mono">x = 1</span>.</p>
    <p>The limit asks not "what is <span class="mono">f(1)</span>?" but "what value does <span class="mono">f(x)</span> approach as <span class="mono">x</span> nears 1?" Drag <span class="cy">x</span> toward 1 from either side and read <span class="mono">f(x)</span>.</p>
    <canvas id="cv" width="640" height="360"></canvas>
    <div class="readout"><div class="rdc"><div class="k">x</div><div class="v" id="xv">—</div></div><div class="rdc"><div class="k">f(x)</div><div class="v" id="fv">—</div></div></div>
    <div class="task"><b>Close in on the hole</b>Drag x to within 0.1 of 1 (from the left or the right) and watch where f is heading.</div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-1,xmax:3,ymin:-1,ymax:4.5});
  const f=x=>x+1;let xc=2.4,done=false;
  function draw(){pl.grid();pl.curve(f,'#7ab8ff');pl.point(1,2,'#7ab8ff',6,true);
    pl.vline(xc,'#3a4c66',true);pl.point(xc,f(xc),'#e8b84b',5);
    document.getElementById('xv').textContent=xc.toFixed(3);
    document.getElementById('fv').textContent=Math.abs(xc-1)<1e-9?'undefined':f(xc).toFixed(3);
    if(!done&&Math.abs(xc-1)<0.1&&Math.abs(xc-1)>1e-6){done=true;flash('✓ Heading to 2');
      addReveal(`<div class="rh">✓ The limit is 2, even though f(1) doesn't exist</div><p>From both sides <span class="mono">f(x) → 2</span>. We write <span class="mono">lim<sub>x→1</sub> f(x) = 2</span>. The value <span class="mono">f(1)</span> is irrelevant — the limit only cares about x <em>near</em> 1, never x <em>equal</em> to 1. That's exactly why it can measure instantaneous behavior, which always lands on a 0/0.</p><p>A limit <b>exists</b> only when both one-sided limits agree. It <em>fails</em> to exist when the two sides disagree (a jump), when the function blows up (→ ±∞), or when it oscillates without settling.</p>`);}}
  xdrag(cv,pl,x=>{xc=x;draw();});draw();
  setHints([`Slide the point along the axis until x reads about 0.9 or 1.1. What number is f closing in on?`]);
}
function c1_epsdelta(){
  stage.innerHTML=`<div class="card"><h2>Making "approaches" rigorous: the ε-δ definition</h2>
    <p>"Gets close" is intuition, not mathematics. The rigorous version is a challenge-response game. To claim <span class="mono">lim<sub>x→a</sub> f(x) = L</span> is to guarantee: <em>however close you demand the output be to L, I can force it by keeping the input close enough to a.</em> Formally:</p>
    <div class="eqbox">for every <span class="hl">ε &gt; 0</span> &nbsp;there exists&nbsp; <span class="hl">δ &gt; 0</span> &nbsp;such that&nbsp; 0 &lt; |x − a| &lt; δ &nbsp;⟹&nbsp; |f(x) − L| &lt; ε</div>
    <p>Read it as a game: <b>you</b> pick a tolerance <span class="cy">ε</span> (a horizontal band of half-width ε around L). <b>I</b> must produce a <span class="gld">δ</span> (a vertical band of half-width δ around a) so that the whole curve inside my δ-band lands inside your ε-band. If I can always win, the limit is L.</p>
    <p>Try it on <span class="mono">f(x) = x²</span> at <span class="mono">a = 1</span>, <span class="mono">L = 1</span>. The <span class="cy">ε-band</span> is fixed. Shrink <span class="gld">δ</span> until no part of the curve inside the δ-band pokes outside the ε-band.</p>
    <div class="ctrls"><span class="slabel" id="dl">δ = 0.50</span><input type="range" id="sl" min="4" max="60" value="50"></div>
    <canvas id="cv" width="640" height="360"></canvas>
    <p class="small" id="obs" style="margin-top:8px"></p></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:0,xmax:2,ymin:0,ymax:3});
  const f=x=>x*x, a=1, L=1, eps=0.4;const sl=document.getElementById('sl');let done=false;
  function draw(){const del=+sl.value/100;pl.grid();
    pl.bandY(L-eps,L+eps,'rgba(122,184,255,0.12)');pl.bandX(a-del,a+del,'rgba(232,184,75,0.10)');
    pl.hline(L-eps,'#7ab8ff',true);pl.hline(L+eps,'#7ab8ff',true);pl.vline(a-del,'#e8b84b',true);pl.vline(a+del,'#e8b84b',true);
    pl.curve(f,'#d6e0ee');
    // portion of curve inside δ-band that escapes ε-band, drawn red
    const{ctx}=pl;ctx.strokeStyle='#e2664f';ctx.lineWidth=3;ctx.beginPath();let st=false;
    for(let x=a-del;x<=a+del;x+=(2*del)/120){const y=f(x);const bad=Math.abs(y-L)>eps;if(bad){const X=pl.px(x),Y=pl.py(y);if(!st){ctx.moveTo(X,Y);st=true;}else ctx.lineTo(X,Y);}else st=false;}
    ctx.stroke();
    pl.point(a,L,'#7ab8ff',5);
    document.getElementById('dl').textContent='δ = '+del.toFixed(2);
    // check success: max deviation over [a-del,a+del]
    let maxdev=0;for(let x=a-del;x<=a+del;x+=(2*del)/200)maxdev=Math.max(maxdev,Math.abs(f(x)-L));
    const ok=maxdev<=eps+1e-9;
    document.getElementById('obs').innerHTML= ok
      ? '✓ The whole curve inside the δ-band stays within the ε-band — this δ works.'
      : 'The red arcs escape the ε-band — this δ is too big. Shrink it.';
    if(!done&&ok&&del<0.6){done=true;flash('✓ δ found');
      addReveal(`<div class="rh">✓ You won the ε-δ game</div><p>For this ε you found a δ that traps the curve inside the tolerance band. The definition demands you can do this for <em>every</em> ε — and here you can: for <span class="mono">f(x)=x²</span> at 1, choosing <span class="mono">δ = min(1, ε/3)</span> always works (a smaller ε just forces a smaller δ). That "always winnable" guarantee is exactly what <span class="mono">lim<sub>x→1</sub> x² = 1</span> <em>means</em> — no vague "gets close," just a promise you can always keep.</p>`);}}
  sl.addEventListener('input',draw);draw();
  setHints([`Drag the slider left to shrink δ. You're done when the observation line stops mentioning red arcs.`]);
}
function c1_laws(){
  stage.innerHTML=`<div class="card"><h2>The limit laws — and when you can just plug in</h2>
    <p>You rarely run the ε-δ game by hand; instead you use laws that ε-δ <em>justifies</em>. If <span class="mono">lim f</span> and <span class="mono">lim g</span> both exist, then limits pass through the arithmetic:</p>
    <div class="eqbox" style="line-height:2">lim(f + g) = lim f + lim g&nbsp;&nbsp;·&nbsp;&nbsp;lim(f·g) = (lim f)(lim g)<br>lim(c·f) = c·lim f&nbsp;&nbsp;·&nbsp;&nbsp;lim(f/g) = lim f / lim g&nbsp;&nbsp;<span style="color:#5d7186">(if lim g ≠ 0)</span></div>
    <p>The big consequence: for any function built from polynomials, roots, and the usual continuous pieces, <b>the limit is just the value</b> — you substitute. <span class="mono">lim<sub>x→a</sub> f(x) = f(a)</span> whenever f is continuous at a (which polynomials always are). The interesting limits are exactly the ones where substitution <em>fails</em> — the 0/0 cases from the last beat, handled next.</p>
    <div class="task"><b>Substitute</b>Evaluate <span class="mono">lim<sub>x→2</sub> (x² + 3x − 1)</span>.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  numChk(stage.querySelector('.card'),9,()=>{addReveal(`<div class="rh">✓ 9</div><p>The expression is a polynomial — continuous everywhere — so the limit is the value: <span class="mono">2² + 3·2 − 1 = 4 + 6 − 1 = 9</span>. No ε-δ needed; the laws (plus "polynomials are continuous") license the plug-in.</p>`);});
  setHints([`It's a polynomial, so lim = value. Put x = 2 into x² + 3x − 1.`,`4 + 6 − 1 = 9.`]);
}
function c1_indet(){
  stage.innerHTML=`<div class="card"><h2>When substitution gives 0/0: see the hole, then remove it</h2>
    <p>A <span class="mono">0/0</span> is called an <b>indeterminate form</b> — not "no limit," but "substitution is blind here; do algebra first." The graph shows exactly what's going on. Take <span class="mono">f(x) = (x²−9)/(x−3)</span>: at <span class="mono">x = 3</span> it's <span class="mono">0/0</span>, undefined — yet everywhere <em>else</em> it simplifies to <span class="mono">x + 3</span>. So the graph is the line <span class="mono">x+3</span> with a single <b>hole</b> punched at x = 3.</p>
    <p>Drag <span class="cy">x</span> toward 3 and watch <span class="mono">f</span> head straight for the hole's height — the limit is the height of the hole, not the (missing) value at it.</p>
    <canvas id="cv" width="640" height="330"></canvas>
    <div class="readout"><div class="rdc"><div class="k">x</div><div class="v" id="xv">—</div></div><div class="rdc"><div class="k">f(x)</div><div class="v" id="fv">—</div></div></div>
    <p style="margin-top:14px">Three techniques recover that hidden height algebraically:</p>
    <p><b>Factor & cancel.</b> <span class="mono">(x²−9)/(x−3) = (x−3)(x+3)/(x−3) = x+3</span> → limit <span class="mono">6</span>. The cancellation is legal because the limit ignores x = 3 itself.</p>
    <p><b>Rationalize.</b> For roots, multiply by the conjugate: <span class="mono">(√(x+1)−1)/x</span> → times <span class="mono">(√(x+1)+1)</span> to clear the 0/0.</p>
    <p><b>Squeeze.</b> Trap <span class="mono">g ≤ f ≤ h</span> with <span class="mono">g, h → L</span>; this proves the cornerstone <span class="mono">lim<sub>x→0</sub>(sin x)/x = 1</span>.</p>
    <div class="task"><b>Factor & cancel</b>Evaluate <span class="mono">lim<sub>x→4</sub> (x² − 16)/(x − 4)</span>.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:0,xmax:6,ymin:2,ymax:9});
  const f=x=>x+3;let xc=5.2,shown=false;
  function draw(){pl.grid();pl.curve(f,'#7ab8ff');pl.point(3,6,'#7ab8ff',6,true);
    pl.vline(xc,'#3a4c66',true);pl.point(xc,f(xc),'#e8b84b',5);
    document.getElementById('xv').textContent=xc.toFixed(3);
    document.getElementById('fv').textContent=Math.abs(xc-3)<1e-9?'undefined (0/0)':f(xc).toFixed(3);
    if(!shown&&Math.abs(xc-3)<0.15&&Math.abs(xc-3)>1e-6){shown=true;flash('✓ Heading to 6');
      addReveal(`<div class="rh">✓ The limit is the hole's height, 6</div><p>From both sides <span class="mono">f(x) → 6</span>, even though <span class="mono">f(3)</span> doesn't exist. The 0/0 was <em>removable</em> — the <span class="mono">(x−3)</span> factors cancel because we only ever care about x <em>near</em> 3, never x = 3. Factoring is just the algebra that fills in the hole.</p>`);}}
  xdrag(cv,pl,x=>{xc=x;draw();});draw();
  numChk(stage.querySelector('.card'),8,()=>{},s=>parseFloat(s));
  setHints([`Slide x toward 3 and read where f is heading. Then for the task, factor x²−16.`,`(x²−16)/(x−4)=(x−4)(x+4)/(x−4)=x+4; at 4 that's 8.`]);
}
function c1_continuity(){
  stage.innerHTML=`<div class="card"><h2>Continuity: the limit equals the value</h2>
    <p>Now that limits are precise, continuity is one clean line. <span class="mono">f</span> is <b>continuous at a</b> when three things hold and line up:</p>
    <div class="eqbox">f(a) exists&nbsp;&nbsp;·&nbsp;&nbsp;lim<sub>x→a</sub> f(x) exists&nbsp;&nbsp;·&nbsp;&nbsp;<span class="hl">lim<sub>x→a</sub> f(x) = f(a)</span></div>
    <p>Intuitively: no hole, no jump, no blow-up — you can draw it through a without lifting the pen. The failures have names, all visible below: a <b>removable</b> discontinuity (a hole — limit exists but ≠ f(a), or f(a) missing), a <b>jump</b> (one-sided limits disagree), and an <b>infinite</b> discontinuity (a vertical asymptote).</p>
    <canvas id="cv" width="640" height="360"></canvas>
    <div class="task"><b>Classify</b>At <span class="mono">x = 1</span> the graph has a hole: the curve approaches a value but the point sits elsewhere. Which discontinuity is that?</div>
    <div class="choices" id="ch"></div>
    <p class="small" style="margin-top:12px">Why it matters: continuity is the hypothesis that makes the big theorems run. The <b>Intermediate Value Theorem</b> says a function continuous on <span class="mono">[a,b]</span> hits every value between <span class="mono">f(a)</span> and <span class="mono">f(b)</span> — which is how you guarantee an equation has a root.</p></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-1,xmax:5,ymin:-1,ymax:4});
  pl.grid();
  // removable hole at x=1 on line y=x (approaches 1, point drawn at 2.5)
  pl.curve(x=>(x>=-1&&x<=2)?x:NaN,'#7ab8ff'); pl.point(1,1,'#7ab8ff',6,true); pl.point(1,2.5,'#e8b84b',5);
  // jump at x=3
  pl.curve(x=>(x>2&&x<3)?0.5:NaN,'#7ab8ff'); pl.curve(x=>(x>=3&&x<=5)?2.5:NaN,'#7ab8ff');
  pl.point(3,0.5,'#7ab8ff',5,true); pl.point(3,2.5,'#7ab8ff',5);
  pl.label(0.4,3.5,'hole (x=1)','#e8b84b'); pl.label(3.1,1.3,'jump (x=3)','#8095ab');
  const opts=[['a <span class="cm">removable</span> discontinuity','y'],['a <span class="cm">jump</span> discontinuity','n'],['an <span class="cm">infinite</span> discontinuity','n'],['it\'s actually continuous','n']];
  mcChoices(document.getElementById('ch'),opts,()=>{addReveal(`<div class="rh">✓ Removable</div><p>The two-sided limit exists (the curve heads to a single value), but the function's value there is missing or misplaced — a lone hole. It's called <em>removable</em> because redefining that one point patches it into a continuous function. A jump needs the one-sided limits to <em>disagree</em>; an infinite discontinuity needs the function to blow up. Here, only the point is off.</p>`);});
  setHints([`The two sides agree on a value — the curve heads to one place — but the plotted point is elsewhere. That single-point defect has a name.`]);
}
function c1_infinity(){
  stage.innerHTML=`<div class="card"><h2>Limits at infinity: chasing the horizontal asymptote</h2>
    <p>A <b>limit at infinity</b>, <span class="mono">lim<sub>x→∞</sub> f(x)</span>, asks what f settles toward as x grows without bound — its <b>horizontal asymptote</b>. For a ratio of polynomials, only the highest-degree terms survive (divide top and bottom by the largest power of x): equal degrees give the ratio of leading coefficients, a smaller top degree gives 0, a larger top degree diverges.</p>
    <p>Below is <span class="mono">f(x) = (3x² + 2x)/(x² − 5)</span>. Drag <span class="cy">x</span> to the right and watch f flatten onto the dashed asymptote <span class="mono">y = 3</span> — the ratio of the leading coefficients.</p>
    <canvas id="cv" width="640" height="330"></canvas>
    <div class="readout"><div class="rdc"><div class="k">x</div><div class="v" id="xv">—</div></div><div class="rdc"><div class="k">f(x)</div><div class="v" id="fv">—</div></div></div>
    <div class="eqbox" style="margin-top:14px">lim<sub>x→∞</sub> <sup>3x² + 2x</sup>⁄<sub>x² − 5</sub> = <sup>3</sup>⁄<sub>1</sub> = 3&nbsp;&nbsp;<span style="color:#5d7186">(leading coefficients; the rest vanishes)</span></div>
    <div class="task"><b>End behavior</b>Evaluate <span class="mono">lim<sub>x→∞</sub> (5x² − x)/(2x² + 7)</span>.</div>
    <div class="entry"><input id="ni" inputmode="decimal" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-1,xmax:25,ymin:-1,ymax:7});
  const f=x=>(3*x*x+2*x)/(x*x-5);let xc=3,shown=false;
  function draw(){pl.grid();pl.hline(3,'#3fb98f',true);pl.curve(f,'#7ab8ff');
    pl.vline(xc,'#3a4c66',true);const y=f(xc);if(isFinite(y)&&y>-2&&y<9)pl.point(xc,y,'#e8b84b',5);
    document.getElementById('xv').textContent=xc.toFixed(1);
    document.getElementById('fv').textContent=isFinite(y)?y.toFixed(3):'—';
    if(!shown&&xc>16){shown=true;flash('✓ Flattening to 3');
      addReveal(`<div class="rh">✓ f → 3, the horizontal asymptote</div><p>As x grows, <span class="mono">f</span> hugs the line <span class="mono">y = 3</span>. Why 3? Divide top and bottom by <span class="mono">x²</span>: <span class="mono">(3 + 2/x)/(1 − 5/x²) → 3/1</span> as the <span class="mono">1/x</span> terms die. Equal top and bottom degree ⟹ the limit is just the ratio of leading coefficients.</p>`);}}
  xdrag(cv,pl,x=>{xc=x;draw();});draw();
  numChk(stage.querySelector('.card'),2.5,()=>{},s=>parseFloat(s));
  setHints([`Drag x far to the right (past ~16) and watch f settle. For the task: same top/bottom degree → ratio of leading coefficients.`,`5/2 = 2.5.`]);
}
function c1_problems(){
  stage.innerHTML=`<div class="card"><h2>Problem set</h2>
    <p>Standard first-course rigor. Work on paper; solutions fold open.</p>

    <div class="prob"><span class="lvl">ε-δ proof</span><div class="ph">Problem 1</div>
    <p>Prove <span class="mono">lim<sub>x→2</sub> (3x − 1) = 5</span> directly from the ε-δ definition (find δ in terms of ε).</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Given ε &gt; 0, we need δ so that <span class="mono">0 &lt; |x−2| &lt; δ ⟹ |(3x−1) − 5| &lt; ε</span>. Simplify the target: <span class="mono">|(3x−1)−5| = |3x−6| = 3|x−2|</span>. So we need <span class="mono">3|x−2| &lt; ε</span>, i.e. <span class="mono">|x−2| &lt; ε/3</span>. Choose <span class="mono">δ = ε/3</span>. Then <span class="mono">|x−2| &lt; δ ⟹ |(3x−1)−5| = 3|x−2| &lt; 3(ε/3) = ε</span>. ∎ (For a line of slope m, δ = ε/|m| always works.)</p></div></details></div>

    <div class="prob"><span class="lvl">squeeze</span><div class="ph">Problem 2</div>
    <p>Evaluate <span class="mono">lim<sub>x→0</sub> x² sin(1/x)</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Since <span class="mono">−1 ≤ sin(1/x) ≤ 1</span>, multiplying by <span class="mono">x² ≥ 0</span> gives <span class="mono">−x² ≤ x² sin(1/x) ≤ x²</span>. Both bounds → 0 as x → 0, so by the squeeze theorem the middle → 0. The wild oscillation of <span class="mono">sin(1/x)</span> is crushed by the vanishing amplitude x².</p></div></details></div>

    <div class="prob"><span class="lvl">rationalize</span><div class="ph">Problem 3</div>
    <p>Evaluate <span class="mono">lim<sub>x→4</sub> (√x − 2)/(x − 4)</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>0/0 at x=4. Multiply by the conjugate <span class="mono">(√x + 2)/(√x + 2)</span>: numerator becomes <span class="mono">x − 4</span>, giving <span class="mono">(x−4)/[(x−4)(√x+2)] = 1/(√x+2)</span>. Now substitute x=4: <span class="mono">1/(2+2) = 1/4</span>.</p></div></details></div>

    <div class="prob"><span class="lvl">continuity</span><div class="ph">Problem 4</div>
    <p>Find the value of <span class="mono">c</span> that makes <span class="mono">f</span> continuous everywhere, where <span class="mono">f(x) = x + 1</span> for <span class="mono">x ≤ 2</span> and <span class="mono">f(x) = cx²</span> for <span class="mono">x &gt; 2</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Each piece is continuous on its own; the only risk is at the seam x=2. Continuity there needs the one-sided limits to agree with the value: left gives <span class="mono">2+1 = 3</span>, right gives <span class="mono">c·2² = 4c</span>. Set <span class="mono">4c = 3</span> ⟹ <span class="mono">c = 3/4</span>.</p></div></details></div>

    <div class="prob"><span class="lvl">IVT</span><div class="ph">Problem 5</div>
    <p>Show the equation <span class="mono">x³ − x − 1 = 0</span> has a solution in the interval <span class="mono">[1, 2]</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Let <span class="mono">g(x) = x³ − x − 1</span>, a polynomial, hence continuous on [1,2]. Evaluate the ends: <span class="mono">g(1) = 1 − 1 − 1 = −1 &lt; 0</span> and <span class="mono">g(2) = 8 − 2 − 1 = 5 &gt; 0</span>. Since 0 lies between g(1) and g(2), the Intermediate Value Theorem guarantees some <span class="mono">c ∈ (1,2)</span> with <span class="mono">g(c) = 0</span>. (It doesn't tell you where — just that a root exists.)</p></div></details></div>

    <div class="prob"><span class="lvl">limit at infinity</span><div class="ph">Problem 6</div>
    <p>Evaluate <span class="mono">lim<sub>x→∞</sub> (√(x² + x) − x)</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>This is ∞ − ∞, indeterminate. Rationalize by the conjugate <span class="mono">(√(x²+x) + x)</span>: the numerator becomes <span class="mono">(x²+x) − x² = x</span>, so the expression is <span class="mono">x / (√(x²+x) + x)</span>. Divide top and bottom by x (using <span class="mono">√(x²+x) = x√(1+1/x)</span> for x&gt;0): <span class="mono">1 / (√(1 + 1/x) + 1) → 1/(1+1) = 1/2</span>.</p></div></details></div>

    <div class="prob"><span class="lvl">challenge — ε-δ, quadratic</span><div class="ph">Problem 7</div>
    <p>Prove <span class="mono">lim<sub>x→3</sub> x² = 9</span> from the ε-δ definition.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>We need <span class="mono">|x² − 9| &lt; ε</span> from <span class="mono">|x − 3| &lt; δ</span>. Factor: <span class="mono">|x²−9| = |x−3||x+3|</span>. The <span class="mono">|x−3|</span> we control; we must bound <span class="mono">|x+3|</span>. First restrict δ ≤ 1, so <span class="mono">|x−3| &lt; 1</span> ⟹ <span class="mono">2 &lt; x &lt; 4</span> ⟹ <span class="mono">|x+3| &lt; 7</span>. Then <span class="mono">|x²−9| &lt; 7|x−3|</span>, which is <span class="mono">&lt; ε</span> whenever <span class="mono">|x−3| &lt; ε/7</span>. So choose <span class="mono">δ = min(1, ε/7)</span>: both conditions hold at once, giving <span class="mono">|x²−9| &lt; 7·(ε/7) = ε</span>. ∎ (The "restrict δ first, then bound the extra factor" trick is the standard pattern for nonlinear ε-δ proofs.)</p></div></details></div>
  </div>`;
  setHints([]);unlock();
}
/* ================= MODULE 2 — THE DERIVATIVE ================= */
function c2_intro(){
  stage.innerHTML=`<div class="card"><h2>The derivative is one specific limit</h2>
    <p>Module 1's very first beat previewed the secant→tangent picture. The <b>derivative</b> just names that limit. The average rate of change of $f$ from $a$ to a nearby point is the secant slope; letting the second point slide in gives the instantaneous rate — the tangent slope:</p>
    <div class="eqbox">$$f'(a) = \\lim_{h\\to 0} \\frac{f(a+h) - f(a)}{h} \\qquad \\color{#5d7186}{\\small(h=\\text{the gap } x-a)}$$</div>
    <p>That's the entire definition. Everything else — the power, product, quotient, and chain rules — is this one limit, computed once for a family of functions and then reused so you never touch the limit again. Watch the secant become the tangent: drag the moving point toward <span class="cy">$a$</span> and read both slopes.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">h</div><div class="v" id="hv">—</div></div><div class="rdc"><div class="k">secant slope</div><div class="v" id="sv">—</div></div><div class="rdc"><div class="k">tangent f′(a)</div><div class="v" id="tv">2.0</div></div></div>
    <div class="task"><b>Slide it in</b>Drag the moving point toward <span class="cy">$a = 1$</span> and watch the secant slope approach the tangent slope, $f'(1) = 2$.</div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-0.5,xmax:2.7,ymin:-1,ymax:7});
  const f=x=>x*x, a=1;let xh=2.3,done=false;
  function draw(){pl.grid();pl.curve(f,'#7ab8ff');
    const{ctx}=pl;const m=(f(xh)-f(a))/(xh-a);
    ctx.strokeStyle='#e8b84b';ctx.lineWidth=2;ctx.beginPath();
    const y0=f(a)+m*(pl.xmin-a),y1=f(a)+m*(pl.xmax-a);ctx.moveTo(pl.px(pl.xmin),pl.py(y0));ctx.lineTo(pl.px(pl.xmax),pl.py(y1));ctx.stroke();
    ctx.strokeStyle='#3fb98f';ctx.lineWidth=1.5;ctx.setLineDash([5,4]);ctx.beginPath();
    const t0=f(a)+2*(pl.xmin-a),t1=f(a)+2*(pl.xmax-a);ctx.moveTo(pl.px(pl.xmin),pl.py(t0));ctx.lineTo(pl.px(pl.xmax),pl.py(t1));ctx.stroke();ctx.setLineDash([]);
    pl.point(a,f(a),'#7ab8ff',5);pl.point(xh,f(xh),'#e8b84b',5);
    document.getElementById('hv').textContent=(xh-a).toFixed(3);
    document.getElementById('sv').textContent=m.toFixed(3);
    if(!done&&Math.abs(xh-a)<0.15&&Math.abs(xh-a)>1e-6){done=true;flash('✓ Secant → tangent');
      addReveal(`<div class="rh">✓ The secant slope → 2, the tangent slope</div><p>As $h \\to 0$ the secant collapses onto the tangent (green). For $f(x)=x^2$ the limit computes cleanly: $\\frac{(1+h)^2 - 1}{h} = \\frac{2h + h^2}{h} = 2 + h \\to 2$. So $f'(1) = 2$. We could divide by $h$ only because the limit ignores $h = 0$ itself — the same "approach, never arrive" that made the $0/0$ removable in Module 1.</p>`);}}
  xdrag(cv,pl,x=>{if(Math.abs(x-a)>1e-3)xh=x;draw();});draw();
  setHints([`Drag the gold point left toward a=1. The secant slope in the readout should head toward 2.`]);
}
function c2_slopefn(){
  stage.innerHTML=`<div class="card"><h2>The derivative is itself a function</h2>
    <p>Here's the idea that makes calculus click. $f'(a)$ is a single number — the slope at one point. But you can compute it at <em>every</em> point, and the slopes themselves form a <b>new function</b>, $f'(x)$ — the derivative.</p>
    <p>Watch it happen. The blue curve is $f(x) = \\tfrac{x^3}{3} - x$. Drag the point along it; the <span class="gld">gold tangent</span> shows the local slope, and the <span class="grn">green dot</span> plots that slope value at the same $x$. As you sweep across, the green dot <em>traces out a whole new curve</em> — that curve is $f'$.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">x</div><div class="v" id="xv">—</div></div><div class="rdc"><div class="k">slope f′(x)</div><div class="v" id="sv">—</div></div></div>
    <div class="task"><b>Find the flat spots</b>Drag until the tangent is <b>horizontal</b> (slope 0). That happens at two $x$-values — enter the <em>positive</em> one.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-2.6,xmax:2.6,ymin:-2.5,ymax:2.5});
  const f=x=>x*x*x/3-x, fp=x=>x*x-1;let a=-2,trail=[];
  function draw(){pl.grid();
    const{ctx}=pl;ctx.globalAlpha=0.35;pl.curve(fp,'#3fb98f',1.5);ctx.globalAlpha=1;
    pl.curve(f,'#7ab8ff');
    trail.forEach(p=>pl.point(p[0],p[1],'#3fb98f',2.5));
    const m=fp(a);ctx.strokeStyle='#e8b84b';ctx.lineWidth=2;ctx.beginPath();
    const y0=f(a)+m*(pl.xmin-a),y1=f(a)+m*(pl.xmax-a);ctx.moveTo(pl.px(pl.xmin),pl.py(y0));ctx.lineTo(pl.px(pl.xmax),pl.py(y1));ctx.stroke();
    pl.point(a,f(a),'#e8b84b',5);pl.point(a,fp(a),'#3fb98f',6);
    document.getElementById('xv').textContent=a.toFixed(2);
    document.getElementById('sv').textContent=m.toFixed(2);}
  xdrag(cv,pl,x=>{a=x;const last=trail[trail.length-1];if(!last||Math.abs(last[0]-a)>0.06)trail.push([a,fp(a)]);draw();});draw();
  numChk(stage.querySelector('.card'),1,()=>{addReveal(`<div class="rh">✓ Flat at x = ±1</div><p>The tangent is horizontal where the green derivative curve crosses zero — at $x = -1$ and $x = +1$. Those are the curve's <b>peak and valley</b>, and the derivative <em>detects them as its own zeros</em>. The green trace you drew is exactly $f'(x) = x^2 - 1$ — a brand-new parabola, born from the slopes of a cubic. That "slopes become a function, and its zeros are the flat spots" is the whole engine of Module 4 (finding maxima and minima).</p>`);});
  setHints([`Slide the point until the gold tangent is perfectly level — the slope readout hits 0. It happens on both sides of center.`,`Flat where f′(x)=x²−1=0, i.e. x=±1. Enter the positive one: 1.`]);
}
function c2_notation(){
  stage.innerHTML=`<div class="card"><h2>Two notations for the same object</h2>
    <p>The derivative gets written several ways, and reading papers means recognizing all of them. The two you'll meet most:</p>
    <div class="eqbox" style="line-height:2.2"><b>Lagrange</b>:&nbsp; $f'(x)$&nbsp;&nbsp;<span style="color:#5d7186">"f-prime" — compact, good for stating rules</span><br><b>Leibniz</b>:&nbsp; $\\dfrac{dy}{dx}$&nbsp; or&nbsp; $\\dfrac{d}{dx}f(x)$&nbsp;&nbsp;<span style="color:#5d7186">"dy dx" — shows the variables, good for chain rule &amp; substitution</span></div>
    <p>They mean exactly the same thing. Lagrange's $f'(x)$ is terse; Leibniz's $\\frac{dy}{dx}$ makes the input and output explicit, which is why it wins for the chain rule (the pieces visibly "cancel") and for integration later. A value at a point is $f'(a)$ or $\\frac{dy}{dx}\\big|_{x=a}$. (You may also see Newton's $\\dot{y}$ in physics for time derivatives, and $Df$ in operator-style texts — same object, different costume.)</p>
    <p>Second derivatives likewise: $f''(x)$ in Lagrange, $\\frac{d^2y}{dx^2}$ in Leibniz. We'll use whichever reads best — Lagrange for stating rules, Leibniz when the variables matter — and always mean the same limit from the last beat.</p>
    <div class="task"><b>Match them</b>Which pair below names the <em>same</em> quantity — the derivative of $y$ with respect to $x$?</div>
    <div class="choices" id="ch"></div></div>`;
  const opts=[['$f\'(x)$ and $\\frac{dy}{dx}$','y'],['$f\'(x)$ and $f(x)\\,dx$','n'],['$\\frac{dy}{dx}$ and $\\frac{\\Delta y}{\\Delta x}$ (they\'re identical)','n'],['$f\'\'(x)$ and $\\frac{dy}{dx}$','n']];
  mcChoices(document.getElementById('ch'),opts,()=>{addReveal(`<div class="rh">✓ f′(x) = dy/dx</div><p>Same object, two notations. Watch the near-miss: $\\frac{\\Delta y}{\\Delta x}$ is the <em>average</em> rate (a secant slope, a genuine ratio); $\\frac{dy}{dx}$ is its <em>limit</em> (the instantaneous rate). Leibniz's notation deliberately echoes the ratio it came from, but the "$d$"s are not literally a fraction — they're a limit that, conveniently, often behaves like one.</p>`);});
  setHints([`Lagrange's prime and Leibniz's dy/dx are the same derivative. Δy/Δx (deltas) is only the average rate, before the limit.`]);
}
function c2_powerrule(){
  stage.innerHTML=`<div class="card"><h2>Deriving the power rule</h2>
    <p>Time to actually <em>earn</em> the rules from the definition — no more taking them on faith. Start with $f(x) = x^n$ for a positive integer $n$. The engine is the <b>binomial theorem</b>, which expands $(x+h)^n$:</p>
    <div class="eqbox">$$(x+h)^n = x^n + n\\,x^{n-1}h + \\frac{n(n-1)}{2}x^{n-2}h^2 + \\cdots + h^n$$</div>
    <p>Every term past the first two carries an $h^2$ or higher. Drop it into the difference quotient — the $x^n$ cancels, then divide by $h$:</p>
    <div class="eqbox">$$\\frac{(x+h)^n - x^n}{h} = n\\,x^{n-1} + \\frac{n(n-1)}{2}x^{n-2}h + \\cdots + h^{n-1}$$</div>
    <p>Now let $h \\to 0$: every remaining term still has a factor of $h$ and vanishes, leaving only the first:</p>
    <div class="eqbox">$$\\color{#e8b84b}{(x^n)' = n\\,x^{n-1}}$$</div>
    <p>That's the power rule, derived. (It extends to negative and fractional exponents once we have the quotient and chain rules; the fully general real-exponent version waits for logarithms in Module 6.) With it, every polynomial differentiates term by term.</p>
    <div class="task"><b>Use it</b>Let $f(x) = x^3 - 4x + 7$. Compute $f'(2)$.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  numChk(stage.querySelector('.card'),8,()=>{addReveal(`<div class="rh">✓ 8</div><p>Term by term: $(x^3)' = 3x^2$, $(-4x)' = -4$, $(7)' = 0$ (a flat constant has no slope). So $f'(x) = 3x^2 - 4$, and $f'(2) = 12 - 4 = 8$ — the tangent's slope at $x = 2$.</p>`);});
  setHints([`Power rule on each term: (x³)′=3x², (−4x)′=−4, (7)′=0.`,`f′(x)=3x²−4; at x=2, 12−4=8.`]);
}
function c2_prodquot(){
  stage.innerHTML=`<div class="card"><h2>Product &amp; quotient rules — the add-and-subtract trick</h2>
    <p>A tempting guess is $(fg)' = f'g'$. It's <em>wrong</em> — check $f = g = x$: $(x^2)' = 2x$, not $1\\cdot 1 = 1$. So the product rule can't be that simple. The real one comes from the limit definition plus a single clever move: in the difference quotient for $fg$, <b>add and subtract</b> the same middle term $f(x+h)g(x)$.</p>
    <div class="eqbox">$$\\frac{f(x+h)g(x+h) - f(x)g(x)}{h}$$</div>
    <p>Insert $-f(x+h)g(x) + f(x+h)g(x)$ in the numerator (it changes nothing) and regroup into two familiar difference quotients:</p>
    <div class="eqbox">$$= f(x+h)\\cdot\\frac{g(x+h) - g(x)}{h} + g(x)\\cdot\\frac{f(x+h) - f(x)}{h}$$</div>
    <p>As $h \\to 0$: the two quotients become $g'$ and $f'$, and $f(x+h) \\to f(x)$ (differentiable ⟹ continuous, proven next beat). That leaves the rule:</p>
    <div class="eqbox">$$\\color{#e8b84b}{(fg)' = f'g + f g'}$$</div>
    <p>The <b>quotient rule</b> comes out of the identical trick applied to $f/g$ — add and subtract $f(x)g(x)$ in the numerator:</p>
    <div class="eqbox">$$\\color{#e8b84b}{\\left(\\frac{f}{g}\\right)' = \\frac{f'g - f g'}{g^2}}$$</div>
    <div class="task"><b>Apply the product rule</b>Let $f(x) = (x^2 + 1)(x - 2)$. Using the product rule (don't expand first), compute $f'(2)$.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  numChk(stage.querySelector('.card'),5,()=>{addReveal(`<div class="rh">✓ 5</div><p>With $u = x^2+1$ ($u' = 2x$) and $v = x-2$ ($v' = 1$): $f' = u'v + uv' = 2x(x-2) + (x^2+1)$. At $x = 2$: $2\\cdot 2\\cdot 0 + (4+1) = 0 + 5 = 5$. (Expanding first and using the power rule gives $3x^2-4x+1 \\to 5$ — same answer; the product rule just saves the multiplication.)</p>`);},s=>parseFloat(s));
  setHints([`Product rule: f′ = (first)′·(second) + (first)·(second)′, with first = x²+1, second = x−2.`,`2x(x−2) + (x²+1); at x=2 the first term is 0, leaving 5.`]);
}
function c2_chain(){
  stage.innerHTML=`<div class="card"><h2>The chain rule: differentiating a composition</h2>
    <p>The rule that unlocks everything nested. For $y = f(g(x))$ — an outer function of an inner one — set $u = g(x)$. Over a small step, the changes multiply like gears: $\\frac{\\Delta y}{\\Delta x} = \\frac{\\Delta y}{\\Delta u}\\cdot\\frac{\\Delta u}{\\Delta x}$. Taking the limit gives:</p>
    <div class="eqbox">$$\\color{#e8b84b}{(f\\circ g)'(x) = f'(g(x))\\cdot g'(x)} \\qquad \\color{#5d7186}{\\text{Leibniz: } \\tfrac{dy}{dx} = \\tfrac{dy}{du}\\cdot\\tfrac{du}{dx}}$$</div>
    <p>The Leibniz form is why this notation earns its keep: the intermediate $du$ visibly "cancels." (Strictly it's a theorem, not literal cancellation — and the one gap in the gear argument, when $\\Delta u = 0$ for nearby $x$, is patched by a short separate case; the notation is just built to look inevitable.) Read it as: <em>rate of the whole = rate of the outer × rate of the inner</em>.</p>
    <p>Example: $\\big((x^2+1)^3\\big)'$. Outer $u^3$ (derivative $3u^2$) at $u=x^2+1$, times inner derivative $2x$: $3(x^2+1)^2\\cdot 2x = 6x(x^2+1)^2$.</p>
    <div class="task"><b>Differentiate a composition</b>Let $f(x) = (3x + 1)^5$. Compute $f'(x)$ and enter $f'(0)$.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  numChk(stage.querySelector('.card'),15,()=>{addReveal(`<div class="rh">✓ 15</div><p>Outer $u^5 \\to 5u^4$ at $u = 3x+1$, times inner derivative $3$: $f'(x) = 5(3x+1)^4\\cdot 3 = 15(3x+1)^4$. At $x = 0$: $15\\cdot 1 = 15$. Forget the $\\cdot 3$ (the inner derivative) and you'd get 5 — the single most common chain-rule slip.</p>`);});
  setHints([`Outer is u⁵ (derivative 5u⁴), inner is 3x+1 (derivative 3). Multiply, then set x=0.`,`f′(x)=5(3x+1)⁴·3 = 15(3x+1)⁴; at 0 that's 15.`]);
}
function c2_trig(){
  stage.innerHTML=`<div class="card"><h2>Deriving (sin x)′ = cos x</h2>
    <p>The trig derivatives don't fall out of algebra alone — they need one geometric limit and the angle-addition formula. First the limit, proven by the <b>squeeze theorem</b> (Module 1) on the unit circle. For a small angle $h &gt; 0$, comparing a triangle, a circular sector, and a larger triangle gives the areas/lengths inequality $\\sin h &lt; h &lt; \\tan h$. Divide through by $\\sin h$ and flip:</p>
    <div class="eqbox">$$\\cos h &lt; \\frac{\\sin h}{h} &lt; 1 \\quad\\Longrightarrow\\quad \\color{#e8b84b}{\\lim_{h\\to 0}\\frac{\\sin h}{h} = 1}$$</div>
    <p>A companion limit follows from it: $\\frac{\\cos h - 1}{h} = -\\frac{\\sin h}{h}\\cdot\\frac{\\sin h}{\\cos h+1} \\to -(1)(0) = 0$. Now differentiate $\\sin$ from the definition, using $\\sin(x+h) = \\sin x\\cos h + \\cos x\\sin h$ (angle addition):</p>
    <div class="eqbox">$$\\frac{\\sin(x+h) - \\sin x}{h} = \\sin x\\cdot\\frac{\\cos h - 1}{h} + \\cos x\\cdot\\frac{\\sin h}{h} \\;\\to\\; \\sin x\\cdot 0 + \\cos x\\cdot 1$$</div>
    <p>So $\\color{#e8b84b}{(\\sin x)' = \\cos x}$, and the identical computation on cosine gives $\\color{#e8b84b}{(\\cos x)' = -\\sin x}$. Every other trig derivative ($\\tan$, $\\sec$, …) now follows from the quotient rule.</p>
    <div class="task"><b>Combine the rules</b>Let $f(x) = 3\\sin x - 2\\cos x$. Compute $f'(0)$.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  numChk(stage.querySelector('.card'),3,()=>{addReveal(`<div class="rh">✓ 3</div><p>$f'(x) = 3\\cos x - 2(-\\sin x) = 3\\cos x + 2\\sin x$. At $x = 0$: $3\\cdot 1 + 2\\cdot 0 = 3$. Both trig derivatives, both earned from the same squeeze limit and angle-addition — no hand-waving.</p>`);});
  setHints([`(sin x)′ = cos x and (cos x)′ = −sin x. Differentiate each term, then set x = 0.`,`f′(x)=3cos x + 2sin x; at 0 that's 3.`]);
}
function c2_diffcont(){
  stage.innerHTML=`<div class="card"><h2>Differentiable ⟹ continuous (but not the reverse)</h2>
    <p>One clean theorem links this module to the last, and it's the fact the product rule quietly used. <b>If $f$ is differentiable at $a$, then $f$ is continuous at $a$.</b> A curve can't have a well-defined tangent at a break — a jump or hole leaves no single slope to approach. (Proof: $f(x)-f(a) = \\frac{f(x)-f(a)}{x-a}\\cdot(x-a) \\to f'(a)\\cdot 0 = 0$, so $f(x) \\to f(a)$ — exactly continuity.)</p>
    <p>The converse <em>fails</em>. The graph of $|x|$ is continuous everywhere — you can draw it without lifting the pen — but at the corner $x = 0$ the slope is $-1$ on the left and $+1$ on the right. Drag across and watch the tangent slope <b>jump</b> as you cross 0: no single value to approach, so no derivative there.</p>
    <canvas id="cv" width="640" height="330"></canvas>
    <div class="readout"><div class="rdc"><div class="k">x</div><div class="v" id="xv">—</div></div><div class="rdc"><div class="k">slope</div><div class="v" id="sv">—</div></div></div>
    <div class="eqbox" style="margin-top:12px">$$\\text{differentiable at } a \\;\\Longrightarrow\\; \\text{continuous at } a \\qquad \\text{continuous} \\;\\not\\Rightarrow\\; \\text{differentiable}$$<div style="text-align:center;color:#5d7186;font-size:13px;margin-top:2px">(corners, cusps, vertical tangents)</div></div>
    <div class="task"><b>Where does $|x|$ fail to be differentiable?</b></div>
    <div class="choices" id="ch"></div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-3,xmax:3,ymin:-0.6,ymax:3});
  const f=x=>Math.abs(x);let a=-1.6;
  function draw(){pl.grid();pl.curve(f,'#7ab8ff');
    const{ctx}=pl;const m=a<0?-1:(a>0?1:0);
    if(Math.abs(a)>0.02){ctx.strokeStyle='#e8b84b';ctx.lineWidth=2;ctx.beginPath();const y0=f(a)+m*(pl.xmin-a),y1=f(a)+m*(pl.xmax-a);ctx.moveTo(pl.px(pl.xmin),pl.py(y0));ctx.lineTo(pl.px(pl.xmax),pl.py(y1));ctx.stroke();}
    pl.point(a,f(a),'#e8b84b',5);
    document.getElementById('xv').textContent=a.toFixed(2);
    document.getElementById('sv').textContent=Math.abs(a)<0.02?'undefined':(m>0?'+1':'−1');}
  xdrag(cv,pl,x=>{a=x;draw();});draw();
  const opts=[['at $x = 0$, where the corner makes the left and right slopes disagree','y'],['nowhere — it\'s made of straight lines so it\'s smooth','n'],['everywhere, because it\'s not continuous','n'],['only for $x &lt; 0$','n']];
  mcChoices(document.getElementById('ch'),opts,()=>{addReveal(`<div class="rh">✓ At the corner, x = 0</div><p>Away from 0, $|x|$ is just $\\pm x$ — perfectly differentiable (slope $\\pm 1$, as the tangent showed). Only at the corner do the one-sided derivatives ($-1$ and $+1$) disagree, so the two-sided limit defining $f'(0)$ doesn't exist. Continuous there, but not smooth. Corners, cusps, and vertical tangents are the three ways continuity survives while differentiability dies.</p>`);});
  setHints([`Drag the point across 0 and watch the slope flip from −1 to +1 with nothing in between. That sudden jump is the problem.`]);
}
function c2_problems(){
  stage.innerHTML=`<div class="card"><h2>Problem set</h2>
    <p>Within Modules 1–2 (no $e^x$ or $\\ln$ yet — those arrive with integration). Paper first; solutions fold open.</p>

    <div class="prob"><span class="lvl">from the definition</span><div class="ph">Problem 1</div>
    <p>Using the limit definition (not the power rule), compute $f'(x)$ for $f(x) = x^2$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$f'(x) = \\lim_{h\\to 0}\\frac{(x+h)^2 - x^2}{h} = \\lim_{h\\to 0}\\frac{x^2 + 2xh + h^2 - x^2}{h} = \\lim_{h\\to 0}\\frac{2xh + h^2}{h} = \\lim_{h\\to 0}(2x + h) = 2x$. The $h$ cancels because the limit ignores $h = 0$; substitution finishes it. This is the power rule for $n=2$, derived.</p></div></details></div>

    <div class="prob"><span class="lvl">proof</span><div class="ph">Problem 2</div>
    <p>Prove the product rule $(fg)' = f'g + fg'$ from the limit definition.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Start from $(fg)'(x) = \\lim_{h\\to 0}\\frac{f(x+h)g(x+h) - f(x)g(x)}{h}$. Add and subtract $f(x+h)g(x)$ in the numerator: $= \\lim\\frac{f(x+h)(g(x+h)-g(x)) + g(x)(f(x+h)-f(x))}{h} = \\lim\\left[f(x+h)\\cdot\\frac{g(x+h)-g(x)}{h} + g(x)\\cdot\\frac{f(x+h)-f(x)}{h}\\right]$. As $h\\to 0$: $\\frac{g(x+h)-g(x)}{h} \\to g'(x)$, $\\frac{f(x+h)-f(x)}{h} \\to f'(x)$, and $f(x+h) \\to f(x)$ ($f$ is continuous, being differentiable). So the limit is $f(x)g'(x) + g(x)f'(x)$. ∎</p></div></details></div>

    <div class="prob"><span class="lvl">product rule</span><div class="ph">Problem 3</div>
    <p>Differentiate $f(x) = x^2\\sin x$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Product rule with $u=x^2$ ($u'=2x$), $v=\\sin x$ ($v'=\\cos x$): $f'(x) = 2x\\sin x + x^2\\cos x$.</p></div></details></div>

    <div class="prob"><span class="lvl">quotient rule</span><div class="ph">Problem 4</div>
    <p>Differentiate $f(x) = \\dfrac{x}{x^2 + 1}$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Quotient rule with $f=x$ ($f'=1$), $g=x^2+1$ ($g'=2x$): numerator $1\\cdot(x^2+1) - x\\cdot 2x = 1 - x^2$. So $f'(x) = \\dfrac{1 - x^2}{(x^2 + 1)^2}$.</p></div></details></div>

    <div class="prob"><span class="lvl">chain rule</span><div class="ph">Problem 5</div>
    <p>Differentiate $f(x) = \\sin(3x^2)$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Outer $\\sin$ (derivative $\\cos$) at the inner $3x^2$, times the inner derivative $6x$: $f'(x) = \\cos(3x^2)\\cdot 6x = 6x\\cos(3x^2)$.</p></div></details></div>

    <div class="prob"><span class="lvl">nested chain</span><div class="ph">Problem 6</div>
    <p>Differentiate $f(x) = \\sin(\\cos x)$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Outer $\\sin$ (derivative $\\cos$) at the inner $\\cos x$, times the inner derivative $(\\cos x)' = -\\sin x$: $f'(x) = \\cos(\\cos x)\\cdot(-\\sin x) = -\\sin x\\,\\cos(\\cos x)$.</p></div></details></div>

    <div class="prob"><span class="lvl">tangent line</span><div class="ph">Problem 7</div>
    <p>Find the equation of the tangent line to $y = x^3$ at $x = 2$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Point: $(2, 8)$. Slope: $y' = 3x^2$, so $y'(2) = 12$. Point-slope: $y - 8 = 12(x - 2)$, i.e. $y = 12x - 16$.</p></div></details></div>

    <div class="prob"><span class="lvl">challenge — non-differentiability</span><div class="ph">Problem 8</div>
    <p>Show that $f(x) = x^{1/3}$ (cube root) is continuous at 0 but not differentiable there. What does the graph do at 0?</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Continuous: $\\lim_{x\\to 0}x^{1/3} = 0 = f(0)$ ✓. The difference quotient $\\frac{x^{1/3} - 0}{x - 0} = x^{-2/3} \\to +\\infty$ as $x \\to 0$, so no finite derivative exists. Geometrically the tangent is <b>vertical</b> at 0 — a vertical tangent, the third way (after corners and cusps) a continuous function fails to be differentiable.</p></div></details></div>
  </div>`;
  setHints([]);unlock();
}

function c3_recall(){recallFrom(`Module 4 puts the derivative to work — so first rebuild what it <em>is</em>, and the limit-and-function machinery beneath it. Every application below is just this toolkit, aimed at a question.`,['c0','c1','c2'],RECALL_HINT);}

function c3_intro(){
  stage.innerHTML=`<div class="card"><h2>The sign of f′ is the direction of travel</h2>
    <p>You <em>built</em> the derivative in Module 3; now you'll <em>use</em> it. The whole module rests on one reading of $f'$: it is a signed rate, so its <b>sign</b> says which way the curve is heading.</p>
    <div class="eqbox">$$f'(x) > 0 \\;\\Rightarrow\\; f \\text{ rising} \\qquad f'(x) < 0 \\;\\Rightarrow\\; f \\text{ falling} \\qquad f'(x)=0 \\;\\Rightarrow\\; f \\text{ momentarily flat}$$</div>
    <p>Below is $f(x)=\\tfrac{x^3}{3}-x$. The background is tinted <span class="grn">green where $f'>0$</span> and <span class="rd">red where $f'<0$</span>. Drag the point across and watch the tangent tilt up in green zones, down in red — then find the red zone yourself.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">x</div><div class="v" id="xv">—</div></div><div class="rdc"><div class="k">f′(x)</div><div class="v" id="sv">—</div></div><div class="rdc"><div class="k">motion</div><div class="v" id="dv">—</div></div></div>
    <div class="task"><b>Explore</b>Drag into the red band (between the peak and the valley) and see the tangent point downhill.</div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-2.6,xmax:2.6,ymin:-2.2,ymax:2.2});
  const f=x=>x*x*x/3-x, fp=x=>x*x-1;let a=1.75,seen=false;
  function draw(){pl.grid();
    pl.bandX(pl.xmin,-1,'rgba(63,185,143,0.10)');pl.bandX(-1,1,'rgba(226,102,79,0.11)');pl.bandX(1,pl.xmax,'rgba(63,185,143,0.10)');
    pl.vline(-1,'#2b3a4f',true);pl.vline(1,'#2b3a4f',true);
    pl.curve(f,'#7ab8ff');
    const m=fp(a),{ctx}=pl;ctx.strokeStyle='#e8b84b';ctx.lineWidth=2;ctx.beginPath();
    const y0=f(a)+m*(pl.xmin-a),y1=f(a)+m*(pl.xmax-a);ctx.moveTo(pl.px(pl.xmin),pl.py(y0));ctx.lineTo(pl.px(pl.xmax),pl.py(y1));ctx.stroke();
    pl.point(a,f(a),'#e8b84b',5);
    document.getElementById('xv').textContent=a.toFixed(2);
    document.getElementById('sv').textContent=m.toFixed(2);
    document.getElementById('dv').textContent=m>0.03?'rising ↗':(m<-0.03?'falling ↘':'flat →');
    if(!seen&&a>-1&&a<1){seen=true;flash('✓ Falling');
      addReveal(`<div class="rh">✓ In the red band, $f' < 0$ and the curve descends</div><p>Between $x=-1$ and $x=+1$ the derivative is negative, and the curve runs downhill — every tangent there tilts down. Cross either dashed line and $f'$ flips sign; the curve turns around. That single fact drives the whole module: the <b>zeros of $f'$</b> (where green meets red) locate the peaks and valleys, its <b>sign</b> maps out rising vs. falling, and — with the second derivative — the bending. Three questions, one function.</p>`);}}
  xdrag(cv,pl,x=>{a=x;draw();});draw();
  setHints([`Drag the gold point to somewhere between x = −1 and x = +1 — the shaded red middle. Watch the tangent point downhill and f′ read negative.`]);
}

function c3_critical(){
  stage.innerHTML=`<div class="card"><h2>Extrema hide at critical points (Fermat's idea)</h2>
    <p>Calculus's first big payoff is locating a function's peaks and valleys. Start by pinning down exactly what we're hunting for:</p>
    <div class="defn"><span class="dt">Definition — local maximum / minimum (extremum)</span>$f$ has a <b>local maximum</b> at $c$ if $f(c)\\ge f(x)$ for every $x$ near $c$, and a <b>local minimum</b> if $f(c)\\le f(x)$ nearby. Either one is an <b>extremum</b> — a crest or a trough of the graph.</div>
    <p>If such a peak or valley sits at an interior point where the curve is smooth, the tangent there must be <em>level</em>: if it tilted, you could still climb higher just to one side. That is <b>Fermat's theorem</b> — at an interior extremum $c$, $f'(c)=0$. (A corner, where $f'$ fails to exist, is the other way a peak can form — picture the point of $|x|$.) Together those two cases name the one term this module hunts for:</p>
    <div class="defn"><span class="dt">Definition — critical point</span>A point $c$ in the domain of $f$ where either $f'(c)=0$ <em>or</em> $f'(c)$ does not exist. By Fermat, <em>every</em> interior extremum is a critical point — so the critical points are the complete list of candidates, and nowhere else needs checking.</div>
    <p>Here $f(x)=\\tfrac{x^3}{3}-x$ has $f'(x)=x^2-1=0$ at the two hollow marks. Drag to one and level the tangent.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">x</div><div class="v" id="xv">—</div></div><div class="rdc"><div class="k">f′(x)</div><div class="v" id="sv">—</div></div></div>
    <div class="task"><b>Find the peak</b>One critical point is a local <em>maximum</em> (the curve's crest). Enter its $x$-value.</div>
    <div class="entry"><input id="ni" inputmode="text" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-2.6,xmax:2.6,ymin:-2.2,ymax:2.2});
  const f=x=>x*x*x/3-x, fp=x=>x*x-1;let a=-2;
  function draw(){pl.grid();pl.curve(f,'#7ab8ff');
    const m=fp(a),{ctx}=pl;ctx.strokeStyle=Math.abs(m)<0.05?'#3fb98f':'#e8b84b';ctx.lineWidth=2;ctx.beginPath();
    const y0=f(a)+m*(pl.xmin-a),y1=f(a)+m*(pl.xmax-a);ctx.moveTo(pl.px(pl.xmin),pl.py(y0));ctx.lineTo(pl.px(pl.xmax),pl.py(y1));ctx.stroke();
    pl.point(-1,f(-1),'#e8b84b',6,true);pl.point(1,f(1),'#e8b84b',6,true);
    pl.point(a,f(a),'#e8b84b',5);
    document.getElementById('xv').textContent=a.toFixed(2);
    document.getElementById('sv').textContent=m.toFixed(2);}
  xdrag(cv,pl,x=>{a=x;draw();});draw();
  numChk(stage.querySelector('.card'),-1,()=>{addReveal(`<div class="rh">✓ Local max at x = −1</div><p>At $x=-1$, $f'=0$ and the curve crests (the left hollow mark); at $x=+1$ it bottoms out. Fermat guarantees extrema <em>can only</em> sit at critical points — but the converse fails: $x=0$ for $f(x)=x^3$ has $f'(0)=0$ yet is no extremum, just a flat spot the curve slides straight through. So critical points are <b>suspects, not convictions</b> — the next beat gives the test that decides.</p>`);});
  setHints([`Both critical points solve x²−1=0, i.e. x=±1. The crest (local max) is on the left.`,`x = −1.`]);
}

function c3_firsttest(){
  stage.innerHTML=`<div class="card"><h2>The first-derivative test: read the sign change</h2>
    <p>A critical point is a max, a min, or neither — and $f'$ itself tells you which. Walk across the critical point and watch how $f'$ changes sign:</p>
    <div class="eqbox">$$+ \\to -\\;:\\ \\text{local max} \\qquad - \\to +\\;:\\ \\text{local min} \\qquad \\text{no change}\\;:\\ \\text{neither}$$</div>
    <p>Below is the <em>derivative</em> $f'(x)=x^2-1$ (green), not $f$. It is a parabola with roots at $\\pm 1$. Drag along it and read the sign; notice how it plunges through zero at $-1$ and climbs through zero at $+1$.</p>
    <canvas id="cv" width="640" height="360"></canvas>
    <div class="readout"><div class="rdc"><div class="k">x</div><div class="v" id="xv">—</div></div><div class="rdc"><div class="k">f′(x)</div><div class="v" id="sv">—</div></div><div class="rdc"><div class="k">sign</div><div class="v" id="gv">—</div></div></div>
    <div class="task"><b>Classify it</b>At $x=+1$, $f'$ changes from negative to positive. So $f$ has a local ___ there.</div>
    <div class="choices" id="ch"></div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-2.6,xmax:2.6,ymin:-1.6,ymax:3.2});
  const fp=x=>x*x-1;let a=-2;
  function draw(){pl.grid();
    pl.bandX(pl.xmin,-1,'rgba(63,185,143,0.10)');pl.bandX(-1,1,'rgba(226,102,79,0.11)');pl.bandX(1,pl.xmax,'rgba(63,185,143,0.10)');
    pl.curve(fp,'#3fb98f');pl.point(-1,0,'#e8b84b',6,true);pl.point(1,0,'#e8b84b',6,true);
    pl.point(a,fp(a),'#3fb98f',5);
    document.getElementById('xv').textContent=a.toFixed(2);
    const v=fp(a);document.getElementById('sv').textContent=v.toFixed(2);
    document.getElementById('gv').textContent=v>0.02?'positive (f ↗)':(v<-0.02?'negative (f ↘)':'zero');}
  xdrag(cv,pl,x=>{a=x;draw();});draw();
  const opts=[['<b>minimum</b> — f was falling, then rising, so this is a valley','y'],['<b>maximum</b> — this is a crest','n'],['neither — f just flattens and continues','n'],['can\'t tell from the sign change alone','n']];
  mcChoices(document.getElementById('ch'),opts,()=>{addReveal(`<div class="rh">✓ Local minimum at x = +1</div><p>$f'$ going $-\\to+$ means $f$ was falling and then rises — a valley. At $x=-1$ the opposite ($+\\to-$) marks the crest. This <b>sign chart</b> is the first-derivative test: split the line at the critical points, check $f'$'s sign in each interval, and read off the shape. No second derivative required — it even handles critical points where $f''$ is awkward or zero.</p>`);});
  setHints([`Falling then rising traces a valley shape ∪ — that's a minimum.`]);
}

function c3_concavity(){
  stage.innerHTML=`<div class="card"><h2>The second derivative reads the bending</h2>
    <p>Take the derivative <em>of the derivative</em>. $f''=(f')'$ measures how the <em>slope</em> is changing — the <b>concavity</b>, or which way the curve bows:</p>
    <div class="eqbox">$$f''>0 \\;\\Rightarrow\\; \\text{concave up } (\\smile) \\qquad f''<0 \\;\\Rightarrow\\; \\text{concave down } (\\frown)$$</div>
    <div class="defn"><span class="dt">Definition — inflection point</span>A point where concavity switches sign — the curve stops bowing one way and starts bowing the other. This needs $f''=0$ there <em>and</em> a genuine sign change: $f''=0$ on its own isn't enough (for $f(x)=x^4$, $f''(0)=0$ but the curve stays concave up).</div>
    <p>For $f(x)=\\tfrac{x^3}{3}-x$: $f'=x^2-1$, so $f''=2x$. Drag the point — the tangent is drawn, and the curve lies <em>above</em> it where concave up, <em>below</em> where concave down. Watch the bowing flip as you cross the center.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">x</div><div class="v" id="xv">—</div></div><div class="rdc"><div class="k">f″(x) = 2x</div><div class="v" id="sv">—</div></div><div class="rdc"><div class="k">concavity</div><div class="v" id="cvc">—</div></div></div>
    <div class="task"><b>Find the inflection point</b>Where does concavity switch (so $f''=0$)? Enter that $x$.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-2.6,xmax:2.6,ymin:-2.2,ymax:2.2});
  const f=x=>x*x*x/3-x, fp=x=>x*x-1, fpp=x=>2*x;let a=-1.4;
  function draw(){pl.grid();
    pl.bandX(pl.xmin,0,'rgba(226,102,79,0.09)');pl.bandX(0,pl.xmax,'rgba(63,185,143,0.09)');
    pl.vline(0,'#2b3a4f',true);pl.curve(f,'#7ab8ff');
    const m=fp(a),{ctx}=pl;ctx.strokeStyle='#e8b84b';ctx.lineWidth=1.8;ctx.setLineDash([5,4]);ctx.beginPath();

    pl.point(0,f(0),'#8095ab',5,true);pl.point(a,f(a),'#e8b84b',5);

  numChk(stage.querySelector('.card'),0,()=>{addReveal(`<div class="rh">✓ Inflection at x = 0</div><p>$f''=2x$ is negative left of 0 (concave down, curve below its tangents) and positive to the right (concave up), switching sign at the grey mark — an <b>inflection point</b>. This also hands you the <b>second-derivative test</b>: at a critical point, $f''>0$ means a valley, $f''<0$ a crest. Check it — critical $x=+1$ gives $f''=2>0$ (min ✓); $x=-1$ gives $f''=-2<0$ (max ✓). One evaluation classifies, no sign chart needed.</p>`);});
  setHints([`f″ = 2x. Set it to zero: 2x = 0.`,`x = 0.`]);
