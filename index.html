function c7_optproblems(){
  stage.innerHTML=`<div class="card"><h2>Problem set</h2>
    <p>Locating critical points, classifying them with the Hessian, convexity, gradient descent, Newton's step, and Lagrange multipliers. Paper first; solutions fold open.</p>

    <div class="prob"><span class="lvl">critical points</span><div class="ph">Problem 1</div>
    <p>Find every critical point of $f(x,y)=x^2+y^2-4x+6y$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Set $\\nabla f=\\mathbf 0$: $f_x=2x-4=0\\Rightarrow x=2$, and $f_y=2y+6=0\\Rightarrow y=-3$. One critical point, $(2,-3)$. (Completing the square, $f=(x-2)^2+(y+3)^2-13$, shows it's the global minimum, value $-13$.)</p></div></details></div>

    <div class="prob"><span class="lvl">classify · second-derivative test</span><div class="ph">Problem 2</div>
    <p>Find and classify all critical points of $f(x,y)=x^3-3x+y^2$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\nabla f=(3x^2-3,\\;2y)=\\mathbf 0\\Rightarrow x=\\pm1,\\ y=0$ — two critical points. The Hessian is $H=\\begin{pmatrix}6x&0\\\\0&2\\end{pmatrix}$, so $D=\\det H=12x$.</p>
    <p>At $(1,0)$: $D=12&gt;0$ and $f_{xx}=6&gt;0$ — a <b>local minimum</b>. At $(-1,0)$: $D=-12&lt;0$ — a <b>saddle</b>. (The $x$-slice $x^3-3x$ has a min then a max; the $y^2$ makes the max a saddle.)</p></div></details></div>

    <div class="prob"><span class="lvl">Hessian with a cross-term</span><div class="ph">Problem 3</div>
    <p>Classify the critical point of $f(x,y)=x^2+xy+y^2$ at the origin.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\nabla f=(2x+y,\\;x+2y)=\\mathbf 0$ gives $(0,0)$. Second partials: $f_{xx}=2,\\ f_{yy}=2,\\ f_{xy}=1$, so $H=\\begin{pmatrix}2&1\\\\1&2\\end{pmatrix}$ and $D=\\det H=2\\cdot2-1^2=3&gt;0$ with $f_{xx}=2&gt;0$ — a <b>local minimum</b>. The cross-term tilts the bowl but doesn't open a downhill direction.</p></div></details></div>

    <div class="prob"><span class="lvl">reading a saddle off the determinant</span><div class="ph">Problem 4</div>
    <p>Show that $f(x,y)=x^2-y^2$ has a saddle at the origin, using $\\det H$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\nabla f=(2x,-2y)=\\mathbf 0\\Rightarrow(0,0)$. $H=\\begin{pmatrix}2&0\\\\0&-2\\end{pmatrix}$, so $D=\\det H=(2)(-2)=-4&lt;0$ — a <b>saddle</b>. A negative determinant means the two curvatures have opposite signs: uphill along $x$, downhill along $y$.</p></div></details></div>

    <div class="prob"><span class="lvl">convexity</span><div class="ph">Problem 5</div>
    <p>Is $f(x,y)=x^2+xy+y^2$ convex? If so, what does that tell you about the critical point from Problem 3?</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>The Hessian $H=\\begin{pmatrix}2&1\\\\1&2\\end{pmatrix}$ is constant. For any direction $\\mathbf p=(a,b)$, $\\mathbf p^{\\mathsf T}H\\mathbf p=2a^2+2ab+2b^2=a^2+b^2+(a+b)^2\\ge 0$ — positive-semidefinite (here strictly positive unless $\\mathbf p=\\mathbf 0$). So $f$ is <b>convex</b>, and a convex function has no saddles or false valleys: the single critical point $(0,0)$ is the <b>global minimum</b>.</p></div></details></div>

    <div class="prob"><span class="lvl">gradient descent · the learning rate</span><div class="ph">Problem 6</div>
    <p>Minimizing $f(x,y)=x^2+y^2$ by gradient descent from $(2,2)$, take one step with learning rate $\\alpha$. Which single $\\alpha$ lands exactly on the minimum $(0,0)$?</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\nabla f=(2x,2y)=(4,4)$ at $(2,2)$. The step is $\\mathbf x\\leftarrow\\mathbf x-\\alpha\\nabla f=(2-4\\alpha,\\;2-4\\alpha)$. This is $(0,0)$ when $2-4\\alpha=0$, i.e. $\\alpha=\\tfrac12$. Smaller $\\alpha$ undershoots (crawls in); larger overshoots past the floor and can diverge.</p></div></details></div>

    <div class="prob"><span class="lvl">Newton's method</span><div class="ph">Problem 7</div>
    <p>For $f(x,y)=x^2+4y^2$, take one Newton step $\\mathbf x\\leftarrow\\mathbf x-H^{-1}\\nabla f$ from $(3,1)$. Where does it land, and why in one step?</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\nabla f=(2x,8y)=(6,8)$; $H=\\begin{pmatrix}2&0\\\\0&8\\end{pmatrix}$, so $H^{-1}\\nabla f=\\left(\\tfrac{6}{2},\\tfrac{8}{8}\\right)=(3,1)$. The step gives $(3,1)-(3,1)=(0,0)$ — the exact minimum. Newton lands in one step on any quadratic, because the quadratic model <em>is</em> the function. Note how $H^{-1}$ rescales each direction by its own curvature — something a single learning rate can't do.</p></div></details></div>

    <div class="prob"><span class="lvl">Lagrange · closest point</span><div class="ph">Problem 8</div>
    <p>Find the point on the line $x+2y=5$ closest to the origin, by minimizing $f=x^2+y^2$ subject to $g=x+2y=5$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\nabla f=\\lambda\\nabla g$: $(2x,2y)=\\lambda(1,2)$, so $2x=\\lambda$ and $2y=2\\lambda=4x\\Rightarrow y=2x$. Drop into the constraint: $x+2(2x)=5\\Rightarrow x=1,\\ y=2$. The closest point is $(1,2)$, at distance $\\sqrt{1^2+2^2}=\\sqrt5$. (As expected, the line from the origin to $(1,2)$ is perpendicular to the constraint line.)</p></div></details></div>

    <div class="prob"><span class="lvl">challenge · Lagrange on a circle</span><div class="ph">Problem 9</div>
    <p>Maximize $f(x,y)=xy$ subject to $x^2+y^2=8$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\nabla f=(y,x)$, $\\nabla g=(2x,2y)$. From $y=\\lambda\\,2x$ and $x=\\lambda\\,2y$: substituting, $x=2\\lambda(2\\lambda x)=4\\lambda^2 x$, so $4\\lambda^2=1$, $\\lambda=\\pm\\tfrac12$. Taking $\\lambda=\\tfrac12$ gives $y=x$; on the circle $x^2+x^2=8\\Rightarrow x=\\pm2$, so $(2,2)$ or $(-2,-2)$, each with $f=4$ — the <b>maximum</b>. ($\\lambda=-\\tfrac12$ gives $y=-x$ and $f=-4$, the minimum.) The product is largest where the level hyperbola $xy=4$ just kisses the circle.</p></div></details></div>
  </div>`;
  setHints([]);unlock();
}
function c7_polar(){
  stage.innerHTML=`<div class="card"><h2>Polar coordinates: the $r$ that makes round regions easy</h2>
    <p>Disks, rings, wedges — anything round — are painful to integrate in $x,y$ (the limits involve $\\sqrt{1-x^2}$). Polar coordinates $x=r\\cos\\theta,\\ y=r\\sin\\theta$ describe them effortlessly. But you can't just swap $dx\\,dy$ for $dr\\,d\\theta$: a little polar cell is not the same size as a little square. Below is the polar grid — drag the gold cell outward and watch its area <em>grow</em> even though $dr$ and $d\\theta$ never change.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">radius r</div><div class="v" id="rv">—</div></div><div class="rdc"><div class="k">arc = r·dθ</div><div class="v" id="arcv">—</div></div><div class="rdc"><div class="k">cell area ≈ r·dr·dθ</div><div class="v" id="cav">—</div></div></div>
    <div class="task"><b>The payoff integral</b>With $dA=r\\,dr\\,d\\theta$, the unit disk's area is $\\int_0^{2\\pi}\\!\\!\\int_0^1 r\\,dr\\,d\\theta$. Do the inner piece first: evaluate $\\int_0^1 r\\,dr$.</div>
    <div class="entry"><input id="ni" inputmode="decimal" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>

    <p style="margin-top:16px"><b>Why the cell area is $r\\,dr\\,d\\theta$.</b> Look at one polar cell — between radii $r$ and $r+dr$, and angles $\\theta$ and $\\theta+d\\theta$. Two of its sides are straight radial segments of length $dr$. The other two are little arcs, and an arc that subtends angle $d\\theta$ at radius $r$ has length $r\\,d\\theta$ (arc $=$ radius $\\times$ angle). For a thin cell it's almost a rectangle:</p>
    <div class="eqbox">$$dA\\approx(\\text{radial side})\\times(\\text{arc side})=dr\\cdot(r\\,d\\theta)=r\\,dr\\,d\\theta.$$</div>
    <p>Same $dr$, same $d\\theta$ — but a cell far out at large $r$ has a longer arc, so it is bigger. That growing factor <em>is</em> the extra $r$, and it's exactly the arc-growth you dragged through.</p>
    <p><b>The payoff.</b> The unit disk's area now falls out in two one-line integrals:</p>
    <div class="eqbox">$$\\int_0^{2\\pi}\\!\\!\\int_0^1 r\\,dr\\,d\\theta=\\Big(\\int_0^{2\\pi}\\!d\\theta\\Big)\\Big(\\int_0^1 r\\,dr\\Big)=2\\pi\\cdot\\tfrac12=\\pi,$$</div>
    <p>the familiar $\\pi r^2$ with $r=1$ — where Cartesian coordinates would have fought those square-root limits the whole way. Next we'll ask the same question for <em>any</em> change of coordinates, not just polar.</p></div>`;
  const cv=document.getElementById('cv');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height,S=40,cx=W/2,cy=H/2;
  const dth=Math.PI/6,dr=0.6,th0=Math.PI/6;
  const P=(r,t)=>[cx+r*Math.cos(t)*S,cy-r*Math.sin(t)*S];
  let r0=1;
  function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='#1c2838';ctx.lineWidth=1;
    for(let r=1;r<=4;r++){ctx.beginPath();for(let i=0;i<=80;i++){const t=i/80*2*Math.PI;const p=P(r,t);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.stroke();}
    for(let k=0;k<12;k++){const t=k*Math.PI/6;ctx.beginPath();const a=P(0,t),b=P(4.3,t);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
    ctx.fillStyle='rgba(232,184,75,0.28)';ctx.strokeStyle='#e8b84b';ctx.lineWidth=2;ctx.beginPath();
    for(let i=0;i<=20;i++){const t=th0+dth*i/20;const p=P(r0,t);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}
    for(let i=20;i>=0;i--){const t=th0+dth*i/20;const p=P(r0+dr,t);ctx.lineTo(p[0],p[1]);}
    ctx.closePath();ctx.fill();ctx.stroke();
    const mid=th0+dth/2;ctx.fillStyle='#dbe6f4';ctx.font='12px sans-serif';
    const pa=P(r0+dr+0.15,mid);ctx.fillText('r·dθ',pa[0]-6,pa[1]);
    const pdr=P(r0+dr/2,th0-0.12);ctx.fillText('dr',pdr[0]+2,pdr[1]+4);
    ctx.fillStyle='#5d7186';ctx.fillText('x',P(4.4,0)[0],P(4.4,0)[1]+4);ctx.fillText('y',P(4.4,Math.PI/2)[0]-4,P(4.4,Math.PI/2)[1]-4);
    document.getElementById('rv').textContent=r0.toFixed(2);
    document.getElementById('arcv').textContent=(r0*dth).toFixed(2);
    document.getElementById('cav').textContent=(r0*dr*dth).toFixed(2);}
  cv.style.touchAction='none';let drg=false;
  function setP(e){const r=cv.getBoundingClientRect();const X=(e.clientX-r.left)*(W/Math.max(1,r.width));r0=Math.max(0.3,Math.min(3.2,X/W*3.5));draw();}
  cv.addEventListener('pointerdown',e=>{drg=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}setP(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(drg){e.preventDefault();setP(e);}});
  const end=()=>drg=false;cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  draw();
  numChk(stage.querySelector('.card'),0.5,()=>{addReveal(`<div class="rh">✓ 1/2</div><p>$\\int_0^1 r\\,dr=\\big[\\tfrac{r^2}{2}\\big]_0^1=\\tfrac12$. The outer integral just sweeps the angle, $\\int_0^{2\\pi}d\\theta=2\\pi$, so the disk area is $2\\pi\\cdot\\tfrac12=\\pi$. The whole trick was replacing $dx\\,dy$ with $r\\,dr\\,d\\theta$ — and that extra $r$ is the arc-growth you dragged.</p>`);});
  setHints([`∫₀¹ r dr = [r²/2] from 0 to 1.`,`(1²/2) − 0 = 1/2 = 0.5.`]);
}

function c7_jacobian(){
  stage.innerHTML=`<div class="card"><h2>The Jacobian: the area factor for <em>any</em> change of variables</h2>
    <p>Polar handed us the factor $r$ by looking at one cell. But polar is just one map among many — you might stretch coordinates to fit an ellipse, shear them, or invent coordinates $(u,v)$ tailored to a region (that's all $u,v$ are: <em>your</em> chosen replacements for $x,y$). Every such change bends straight grid lines into curves, and curved maps are hard to work with head-on. Calculus gets around that the way it always does — by <b>zooming in</b>. Shrink your attention to a microscopic patch around one point and the bending flattens out: on that scale the map looks like a single <b>linear</b> transformation — a plain matrix that carries a small input displacement to a small output displacement. That matrix is the <b>Jacobian</b>, a local linear stand-in for the curved map, and this beat builds it, reads its geometry, and extracts the one number integration needs: the factor by which it rescales area. The one-variable case already shows the shape of the answer.</p>
    <div class="eqbox">$$\\int f(x)\\,dx=\\int f(g(u))\\,\\underbrace{|g'(u)|}_{\\text{length stretch}}\\,du.$$</div>
    <p>That's $u$-substitution from Module 6, and it already carries the whole idea in miniature. Substituting $x=g(u)$ turns $dx$ into $|g'(u)|\\,du$: zoom into one point and the map is just "multiply by the number $g'(u)$," so a length $du$ is rescaled by $|g'(u)|$. In two variables the local multiplier can't be a single number — two inputs feed two outputs — so it grows into a <b>matrix</b>, and "rescaled length" becomes "rescaled <b>area</b>." Build it in two moves: first a geometric fact about area, then the matrix itself.</p>

    <p><b>Move 1 — the area a cell maps to is a determinant.</b> Set the curved maps aside for a moment for one pure geometry fact we'll need. If a little cell's two edges are the vectors $\\mathbf e_1$ and $\\mathbf e_2$, what area do they enclose? Drag the tip of $\\mathbf e_2$ and watch.</p>
    <canvas id="cv" width="640" height="360"></canvas>
    <div class="readout"><div class="rdc"><div class="k">e&#8321;</div><div class="v" id="e1v">(2, 0)</div></div><div class="rdc"><div class="k">e&#8322;</div><div class="v" id="e2v">—</div></div><div class="rdc"><div class="k">area = |e&#8321;&#8339;e&#8322;&#7527; &#8722; e&#8321;&#7527;e&#8322;&#8339;|</div><div class="v" id="arv">—</div></div></div>
    <div class="task"><b>Read off the area rule</b>With edges $\\mathbf e_1=(2,0)$ and $\\mathbf e_2=(1,3)$, what area do they span? (Drag to check, or compute $|e_{1x}e_{2y}-e_{1y}e_{2x}|$.)</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>
    <p style="margin-top:14px">The parallelogram from $\\mathbf e_1=(a,b)$ and $\\mathbf e_2=(c,d)$ has area $|ad-bc|$ — largest when the edges are perpendicular, shrinking to $0$ as they line up (a flattened, degenerate cell). That combination is the <b>$2\\times2$ determinant</b>:</p>
    <div class="eqbox">$$\\text{area}=\\Big|\\det\\begin{pmatrix}a&c\\\\ b&d\\end{pmatrix}\\Big|=|ad-bc|.$$</div>

    <p><b>Move 2 — the matrix, from total differentials.</b> First, a word on what just became a function of what. Before the swap, $x$ and $y$ were the two <em>independent</em> variables you integrated over; a change of variables demotes them to <em>outputs</em> — each is now a scalar function of the new coordinates, $x(u,v)$ and $y(u,v)$, that eats the pair $(u,v)$ and returns one number. So the genuinely free variables are now $(u,v)$ — <b>two</b> of them, the same count as before, since renaming the plane can't change its dimension — and $x,y$ ride along. (The path in the vector-calculus module is the tighter cousin: a single knob $t$ drives both $x(t)$ and $y(t)$ — just <b>one</b> free variable, which is why a line integral collapses to one $\\int\\,dt$. Here there are two, so we sweep an area.)</p>
    <p>Now <b>zoom in</b> around one point and nudge the inputs by microscopic amounts $\\Delta u$ and $\\Delta v$. How far does each output move? On this flattened scale the outputs respond linearly, and each input acts <em>independently</em>, so the total change in an output is the sum of the two separate contributions — each a rate (a partial derivative) times a step:</p>
    <div class="eqbox">$$\\Delta x\\approx\\frac{\\partial x}{\\partial u}\\,\\Delta u+\\frac{\\partial x}{\\partial v}\\,\\Delta v,\\qquad \\Delta y\\approx\\frac{\\partial y}{\\partial u}\\,\\Delta u+\\frac{\\partial y}{\\partial v}\\,\\Delta v.$$</div>
    <p>Each coefficient, like $\\partial x/\\partial u$, is just the rate the $x$-output climbs per unit of $u$ with $v$ held still — the ordinary one-input linear approximation, change $\\approx$ rate $\\times$ step, applied one output at a time. Those two lines are a linear system; pulling the coefficients out front repackages them as a single <b>matrix</b> times the input-displacement vector:</p>
    <div class="eqbox">$$\\begin{pmatrix}\\Delta x\\\\ \\Delta y\\end{pmatrix}\\approx\\underbrace{\\begin{pmatrix}\\dfrac{\\partial x}{\\partial u}&\\dfrac{\\partial x}{\\partial v}\\\\[6pt]\\dfrac{\\partial y}{\\partial u}&\\dfrac{\\partial y}{\\partial v}\\end{pmatrix}}_{J}\\begin{pmatrix}\\Delta u\\\\ \\Delta v\\end{pmatrix},\\qquad \\Delta\\mathbf y\\approx J\\,\\Delta\\mathbf u.$$</div>
    <p>That matrix of first partials <em>is</em> the <b>Jacobian</b> $J$: the local linear map that carries an input displacement to the matching output displacement, the flat stand-in for the curved map near this point. (It holds only <em>first</em> derivatives — the rates of this map — so don't confuse it with the Hessian from Module 9, which collects <em>second</em> derivatives to measure the curvature of a single scalar field.)</p>
    <p><b>Its columns are the edges a grid cell maps to.</b> Freeze $v$ and move along $u$ alone (set $\\Delta v=0$): only the first column survives, so the displacement is $\\big(\\tfrac{\\partial x}{\\partial u},\\tfrac{\\partial y}{\\partial u}\\big)\\,du$ — the little arrow the $u$-grid line turns into. Freezing $u$ and moving along $v$ gives the second column. Writing the infinitesimal steps as $du,dv$, the two edge vectors are</p>
    <div class="eqbox">$$\\mathbf e_1=\\Big(\\frac{\\partial x}{\\partial u},\\ \\frac{\\partial y}{\\partial u}\\Big)\\,du,\\qquad \\mathbf e_2=\\Big(\\frac{\\partial x}{\\partial v},\\ \\frac{\\partial y}{\\partial v}\\Big)\\,dv.$$</div>
    <p>They are the two columns of $J$ (each scaled by its step), and the sides of the little parallelogram a grid square becomes. Place the gold cell in the input grid on the left and watch where it lands on the right — the two arrows are exactly these edges. (For polar, stepping $r$ gives $(\\cos\\theta,\\sin\\theta)\\,dr$, a short move straight out along the radius — just what raising $r$ does.)</p>
    <div class="seg" id="segm"></div>
    <canvas id="cvm" width="640" height="360"></canvas>
    <p class="small" id="obsm" style="margin-top:6px;color:#9fb0c4"></p>
    <div class="readout"><div class="rdc"><div class="k">u-edge ∂(x,y)/∂u · du</div><div class="v" id="juv">—</div></div><div class="rdc"><div class="k">v-edge ∂(x,y)/∂v · dv</div><div class="v" id="jvv">—</div></div><div class="rdc"><div class="k">area factor |det J|</div><div class="v" id="detv">—</div></div></div>

    <p style="margin-top:16px"><b>Assemble it.</b> Move 2 built the Jacobian $J$ and showed its two columns are the edge vectors a grid cell maps to; Move 1 says the area those edges enclose is the absolute determinant. Put them together and a cell of area $du\\,dv$ becomes a patch of area $|\\det J|\\,du\\,dv$:</p>
    <div class="eqbox">$$dx\\,dy=|\\det J|\\,du\\,dv,\\qquad J=\\begin{pmatrix}\\tfrac{\\partial x}{\\partial u}&\\tfrac{\\partial x}{\\partial v}\\\\[3pt]\\tfrac{\\partial y}{\\partial u}&\\tfrac{\\partial y}{\\partial v}\\end{pmatrix}.$$</div>
    <p>It's the exact 2-D version of the 1-D line: $|g'(u)|$ rescaled length, $|\\det J|$ rescales area. The columns are the two edge arrows in the picture; the determinant turns them into the area they enclose.</p>

    <p><b>A frame change, seen locally.</b> If you've met a <b>basis change</b> in linear algebra, this is its cousin. A basis change is one fixed linear map: it sends the whole plane through a single matrix whose columns are the new basis vectors, and it always pins the origin. A change of variables is looser — it can be <em>curved</em> (polar bends straight grid lines into circles) and it need not fix the origin (a shift like $x=u+3$ slides everything over). But zoom into one tiny cell and all that curving and shifting is invisible: locally the map looks like a single linear transformation, whose matrix is the Jacobian $J$ and whose columns $\\mathbf e_1,\\mathbf e_2$ are the local basis vectors the grid lines turn into. So $J$ is the basis change the map performs <em>at that point</em>, and $|\\det J|$ is how much that local basis inflates or shrinks area — exactly the role $|\\det|$ plays for an honest linear map. A linear change of variables is the special case where that local picture is the same everywhere.</p>

    <p><b>What the determinant means — a local area tax.</b> Because the map is curved, these rates aren't fixed numbers; they depend on where you stand, so $|\\det J|$ is a <em>local</em> quantity — the factor by which a tiny patch of area is stretched, sheared, or squeezed as it crosses between the two coordinate systems. Polar makes the position-dependence vivid: swing the angle $\\theta$ by a sliver and your physical point is flung a long way out if you're far from the origin, but barely stirs near the center — so cells at large $r$ balloon while cells near the middle stay small. That is exactly why integration needs the factor: it taxes each cell by how much the coordinates stretch it there.</p>
    <p><b>Check it against polar.</b> For $x=r\\cos\\theta,\\ y=r\\sin\\theta$ (so $u=r,\\ v=\\theta$), the two edge vectors are exactly the arrows you dragged: stepping $r$ gives $(\\cos\\theta,\\sin\\theta)$ — a unit radial step — and stepping $\\theta$ gives $(-r\\sin\\theta,\\ r\\cos\\theta)$ — a sideways step of length $r$. They're perpendicular, so the area is base $\\times$ height $=1\\cdot r$, and the determinant agrees:</p>
    <div class="eqbox">$$\\det J=\\cos\\theta\\,(r\\cos\\theta)-(-r\\sin\\theta)\\,\\sin\\theta=r(\\cos^2\\theta+\\sin^2\\theta)=r.$$</div>
    <p>That's the same $r$ the polar beat found by measuring the arc — now you can see why: the sideways edge <em>is</em> the arc $r\\,d\\theta$, and it grows with $r$ while the radial edge stays fixed. The formula reproduces it, and will hand you the factor for a stretch, a shear, or any coordinates you cook up.</p>

    <p><b>The full change-of-variables rule.</b> Swapping an integral into new coordinates, you replace $dx\\,dy$ by $|\\det J|\\,du\\,dv$ and re-express the region:</p>
    <div class="eqbox">$$\\iint_R f(x,y)\\,dx\\,dy=\\iint_S f\\big(x(u,v),y(u,v)\\big)\\,|\\det J|\\,du\\,dv.$$</div>
    <p>(ML echo: this is the machinery behind <b>normalizing flows</b>, where a network warps a simple distribution into a complex one and the log-likelihood picks up a $\\log|\\det J|$ term — the same Jacobian, tracking how the map stretches probability mass.)</p></div>`;

  const arrow=(c,X0,Y0,X1,Y1,col,w)=>{if(!c)return;c.strokeStyle=col;c.lineWidth=w||2.5;c.beginPath();c.moveTo(X0,Y0);c.lineTo(X1,Y1);c.stroke();const a=Math.atan2(Y1-Y0,X1-X0);c.fillStyle=col;c.beginPath();c.moveTo(X1,Y1);c.lineTo(X1-11*Math.cos(a-0.4),Y1-11*Math.sin(a-0.4));c.lineTo(X1-11*Math.cos(a+0.4),Y1-11*Math.sin(a+0.4));c.closePath();c.fill();};

  // ============ Move 1: parallelogram area = determinant ============
  const cv=document.getElementById('cv');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height,S=44,ox=150,oy=250;
  const px=x=>ox+x*S,py=y=>oy-y*S;
  const e1=[2,0];let e2=[1,2];
  function drawPar(){if(!ctx)return;ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='#16202f';ctx.lineWidth=1;for(let g=-1;g<=8;g++){ctx.beginPath();ctx.moveTo(px(g),py(-1));ctx.lineTo(px(g),py(4.5));ctx.stroke();ctx.beginPath();ctx.moveTo(px(-1),py(g));ctx.lineTo(px(8),py(g));ctx.stroke();}
    ctx.strokeStyle='#2b3a4f';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(px(-1),py(0));ctx.lineTo(px(8),py(0));ctx.moveTo(px(0),py(-1));ctx.lineTo(px(0),py(4.5));ctx.stroke();
    const O=[px(0),py(0)],A=[px(e1[0]),py(e1[1])],B=[px(e1[0]+e2[0]),py(e1[1]+e2[1])],C=[px(e2[0]),py(e2[1])];
    ctx.fillStyle='rgba(122,184,255,0.16)';ctx.beginPath();ctx.moveTo(O[0],O[1]);ctx.lineTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.lineTo(C[0],C[1]);ctx.closePath();ctx.fill();

  // ============ Move 2: dual-grid map, cell -> parallelogram ============
  const MAPS={

  let mkey='polar', u0=MAPS.polar.u0, v0=MAPS.polar.v0;

    // input isotropic

    const Lx=u=>Cx+(u-uc)*sIn, Ly=v=>Cy-(v-vc)*sIn;
    // output isotropic
    const [xm,xM,ym,yM]=M.view;const sOut=Math.min(OW/(xM-xm),OH/(yM-ym));const Ox=OXp+OW/2,Oy=OYp+OH/2,xc=(xm+xM)/2,yc=(ym+yM)/2;
    const Rx=x=>Ox+(x-xc)*sOut, Ry=y=>Oy-(y-yc)*sOut;
    // pane frames

    for(let u=M.umin;u<=M.umax+1e-9;u+=M.ug){cm.beginPath();let st=false;for(let v=M.vmin;v<=M.vmax+1e-9;v+=(M.vmax-M.vmin)/60){const p=M.f(u,v);const X=Rx(p[0]),Y=Ry(p[1]);st?cm.lineTo(X,Y):cm.moveTo(X,Y);st=true;}cm.stroke();}
    for(let v=M.vmin;v<=M.vmax+1e-9;v+=M.vg){cm.beginPath();let st=false;for(let u=M.umin;u<=M.umax+1e-9;u+=(M.umax-M.umin)/60){const p=M.f(u,v);const X=Rx(p[0]),Y=Ry(p[1]);st?cm.lineTo(X,Y):cm.moveTo(X,Y);st=true;}cm.stroke();}
    // highlighted input cell
    cm.fillStyle='rgba(232,184,75,0.22)';cm.strokeStyle='#e8b84b';cm.lineWidth=2;
    cm.beginPath();cm.rect(Lx(u0),Ly(v0+M.dv),(Lx(u0+M.du)-Lx(u0)),(Ly(v0)-Ly(v0+M.dv)));cm.fill();cm.stroke();
    // mapped cell (sample edges for curvature)
    const edge=(ua,va,ub,vb)=>{const pts=[];for(let i=0;i<=12;i++){const p=M.f(ua+(ub-ua)*i/12, va+(vb-va)*i/12);pts.push([Rx(p[0]),Ry(p[1])]);}return pts;};
    const loop=[].concat(edge(u0,v0,u0+M.du,v0),edge(u0+M.du,v0,u0+M.du,v0+M.dv),edge(u0+M.du,v0+M.dv,u0,v0+M.dv),edge(u0,v0+M.dv,u0,v0));
    cm.fillStyle='rgba(232,184,75,0.22)';cm.strokeStyle='#e8b84b';cm.lineWidth=2;cm.beginPath();loop.forEach((p,i)=>i?cm.lineTo(p[0],p[1]):cm.moveTo(p[0],p[1]));cm.closePath();cm.fill();cm.stroke();
    // edge vectors from mapped corner
    const O=M.f(u0,v0),ju=M.Ju(u0,v0),jv=M.Jv(u0,v0);
    const Oc=[Rx(O[0]),Ry(O[1])];
    const uend=[Rx(O[0]+ju[0]*M.du),Ry(O[1]+ju[1]*M.du)],vend=[Rx(O[0]+jv[0]*M.dv),Ry(O[1]+jv[1]*M.dv)];
    arrow(cm,Oc[0],Oc[1],uend[0],uend[1],'#7ab8ff');arrow(cm,Oc[0],Oc[1],vend[0],vend[1],'#e8b84b');
    cm.fillStyle='#dbe6f4';cm.beginPath();cm.arc(Oc[0],Oc[1],3.5,0,7);cm.fill();

  function buildSeg(){const el=document.getElementById('segm');if(!el)return;

  buildSeg();
  cvm.style.touchAction='none';let dm=false;
  function setMap(e){const M=MAPS[mkey];const r=cvm.getBoundingClientRect();const X=(e.clientX-r.left)*(Wm/Math.max(1,r.width)),Y=(e.clientY-r.top)*(Hm/Math.max(1,r.height));
    if(X>IX+IW+6)return;                 // only the input pane drives the cell
    const sIn=Math.min(IW/(M.umax-M.umin),IH/(M.vmax-M.vmin));const Cx=IX+IW/2,Cy=IY+IH/2,uc=(M.umin+M.umax)/2,vc=(M.vmin+M.vmax)/2;
    u0=Math.max(M.umin,Math.min(M.umax-M.du, uc+(X-Cx)/sIn));
    v0=Math.max(M.vmin,Math.min(M.vmax-M.dv, vc-(Y-Cy)/sIn));

  cvm.addEventListener('pointerdown',e=>{dm=true;try{cvm.setPointerCapture(e.pointerId);}catch(x){}setMap(e);e.preventDefault();});
  cvm.addEventListener('pointermove',e=>{if(dm){e.preventDefault();setMap(e);}});
  const endm=()=>dm=false;cvm.addEventListener('pointerup',endm);cvm.addEventListener('pointercancel',endm);
  drawMap();

  numChk(stage.querySelector('.card'),6,()=>{addReveal(`<div class="rh">✓ 6</div><p>$|e_{1x}e_{2y}-e_{1y}e_{2x}|=|2\\cdot3-0\\cdot1|=6$. With $\\mathbf e_1$ flat along the $x$-axis, that's just base $2$ times height $3$ — and the determinant $ad-bc$ is exactly "base times perpendicular height" for edges pointing any direction. Slide $\\mathbf e_2$ down onto the axis and the area collapses to $0$: the cell is squashed flat, the determinant vanishes, and the map is degenerate there.</p>`);});
  setHints([`Area = |e1x·e2y − e1y·e2x| with e1=(2,0), e2=(1,3).`,`|2·3 − 0·1| = 6.`]);
}
function c7_intproblems(){
  stage.innerHTML=`<div class="card"><h2>Problem set</h2>
    <p>Double integrals as volume, Fubini and order-swapping, non-rectangular regions, polar coordinates, and the Jacobian. Paper first; solutions fold open.</p>

    <div class="prob"><span class="lvl">constant integrand</span><div class="ph">Problem 1</div>
    <p>Evaluate $\\displaystyle\\iint_{[0,2]\\times[0,3]} 6\\,dA$.</p>
    <details><summary>Show solution</summary><div class="sol"><p>A constant height $6$ over a rectangle of area $2\\cdot3=6$ gives a box of volume $6\\cdot6=36$. (Or: $\\int_0^3\\!\\int_0^2 6\\,dx\\,dy=\\int_0^3 12\\,dy=36$.)</p></div></details></div>

    <div class="prob"><span class="lvl">Fubini · separable</span><div class="ph">Problem 2</div>
    <p>Evaluate $\\displaystyle\\iint_{[0,1]\\times[0,2]} xy\\,dA$.</p>
    <details><summary>Show solution</summary><div class="sol"><p>The integrand factors and the region is a rectangle, so the double integral splits: $\\big(\\int_0^1 x\\,dx\\big)\\big(\\int_0^2 y\\,dy\\big)=\\tfrac12\\cdot2=1$.</p></div></details></div>

    <div class="prob"><span class="lvl">order swap</span><div class="ph">Problem 3</div>
    <p>Evaluate $\\displaystyle\\int_0^1\\!\\!\\int_0^2 (x+2y)\\,dy\\,dx$, then redo it in the order $dx\\,dy$ to confirm Fubini.</p>
    <details><summary>Show solution</summary><div class="sol"><p>Inner over $y$: $\\int_0^2(x+2y)\\,dy=[xy+y^2]_0^2=2x+4$. Outer: $\\int_0^1(2x+4)\\,dx=[x^2+4x]_0^1=5$. Other order — inner over $x$: $\\int_0^2(\\tfrac12+2y)\\,dy$ where $\\int_0^1(x+2y)dx=\\tfrac12+2y$; then $[\\tfrac12 y+y^2]_0^2=1+4=5$. Same answer.</p></div></details></div>

    <div class="prob"><span class="lvl">non-rectangular region</span><div class="ph">Problem 4</div>
    <p>Set up and evaluate $\\displaystyle\\iint_T 1\\,dA$ over the triangle $0\\le x\\le1,\\ 0\\le y\\le x$.</p>
    <details><summary>Show solution</summary><div class="sol"><p>The inner limit depends on the outer variable: for each $x$, $y$ runs $0$ to $x$. $\\int_0^1\\!\\int_0^x 1\\,dy\\,dx=\\int_0^1 x\\,dx=\\tfrac12$ — the triangle's area, as it must be. (Variable inner limits are how non-rectangular regions enter.)</p></div></details></div>

    <div class="prob"><span class="lvl">polar · disk area</span><div class="ph">Problem 5</div>
    <p>Find the area of the disk of radius $2$ using $dA=r\\,dr\\,d\\theta$.</p>
    <details><summary>Show solution</summary><div class="sol"><p>$\\int_0^{2\\pi}\\!\\int_0^2 r\\,dr\\,d\\theta=\\big(\\int_0^{2\\pi}d\\theta\\big)\\big(\\int_0^2 r\\,dr\\big)=2\\pi\\cdot\\big[\\tfrac{r^2}{2}\\big]_0^2=2\\pi\\cdot2=4\\pi=\\pi(2)^2.$ The extra $r$ is the arc-growth factor.</p></div></details></div>

    <div class="prob"><span class="lvl">polar · weighted</span><div class="ph">Problem 6</div>
    <p>Evaluate $\\displaystyle\\iint_{D}(x^2+y^2)\\,dA$ over the unit disk $D$.</p>
    <details><summary>Show solution</summary><div class="sol"><p>In polar $x^2+y^2=r^2$ and $dA=r\\,dr\\,d\\theta$, so the integrand becomes $r^2\\cdot r=r^3$: $\\int_0^{2\\pi}\\!\\int_0^1 r^3\\,dr\\,d\\theta=2\\pi\\cdot\\big[\\tfrac{r^4}{4}\\big]_0^1=2\\pi\\cdot\\tfrac14=\\tfrac{\\pi}{2}.$</p></div></details></div>

    <div class="prob"><span class="lvl">polar · the Gaussian</span><div class="ph">Problem 7</div>
    <p>Evaluate $\\displaystyle\\iint_{\\mathbb R^2} e^{-(x^2+y^2)}\\,dA$ over the whole plane.</p>
    <details><summary>Show solution</summary><div class="sol"><p>Cartesian is stuck; polar is clean. With $x^2+y^2=r^2$ and $dA=r\\,dr\\,d\\theta$: $\\int_0^{2\\pi}\\!\\int_0^\\infty e^{-r^2}r\\,dr\\,d\\theta$. The inner integral: let $w=r^2$, $dw=2r\\,dr$, giving $\\tfrac12\\int_0^\\infty e^{-w}dw=\\tfrac12$. Times $\\int_0^{2\\pi}d\\theta=2\\pi$: total $\\pi$. (This is the trick behind $\\int_{-\\infty}^\\infty e^{-x^2}dx=\\sqrt\\pi$ — the normalization of the Gaussian.)</p></div></details></div>

    <div class="prob"><span class="lvl">challenge · Jacobian</span><div class="ph">Problem 8</div>
    <p>Using the change of variables $x=au,\\ y=bv$, find the area of the ellipse $\\tfrac{x^2}{a^2}+\\tfrac{y^2}{b^2}\\le1$.</p>
    <details><summary>Show solution</summary><div class="sol"><p>The map sends the unit disk $u^2+v^2\\le1$ onto the ellipse. Its Jacobian is $\\det\\begin{pmatrix}a&0\\\\0&b\\end{pmatrix}=ab$, so $dx\\,dy=ab\\,du\\,dv$. Hence area $=\\iint_{\\text{ellipse}}dx\\,dy=ab\\iint_{\\text{unit disk}}du\\,dv=ab\\cdot\\pi=\\pi ab$. The Jacobian rescales the disk's area $\\pi$ by the stretch factor $ab$.</p></div></details></div>
  </div>`;
  setHints([]);unlock();
}
function c10_recall(){recallFrom(`Module 11 promotes functions from returning a single <em>number</em> to returning a whole <em>vector</em> at every point — and its grand theorems tie together nearly everything you've built. Roll up the three pillars first: the Fundamental Theorem the big theorems generalize, the gradient (your first vector field), and the multiple integrals that line and surface integrals extend.`,['c4','c7','c9'],RECALL_HINT);}

function c10_fields(){
  stage.innerHTML=`<div class="card"><h2>Vector fields: an arrow at every point</h2>
    <p>Until now a function pinned a single <b>number</b> to each point — a height $f(x,y)$, a temperature, a density. A <b>vector field</b> pins a whole <b>arrow</b>: a magnitude <em>and</em> a direction at every point. Picture wind on a weather map, the current in a river, or the pull of gravity around a planet — at each spot there's not just an amount but a way it points.</p>
    <p>Write it with one component formula per arrow-coordinate:</p>
    <div class="eqbox">$$\\mathbf F(x,y)=\\big(P(x,y),\\ Q(x,y)\\big)$$</div>
    <p>$P$ is how far the arrow reaches in $x$, $Q$ how far in $y$ — two ordinary scalar functions bundled into one arrow-valued function. And you've already built one without naming it: the <b>gradient</b> $\\nabla f=(f_x,f_y)$ hands every point its steepest-uphill arrow. Every contour map you drew in Module 8 was secretly carrying a vector field.</p>

    <p><b>Is a field just a map?</b> Yes. A point in the plane <em>is</em> its position vector $(x,y)$, so $\\mathbf F$ takes a vector in and hands a vector out — a function $\\mathbf F:\\mathbb R^2\\to\\mathbb R^2$, the very same kind of object as the change-of-variables map from the last module. The only difference is how you read the output: a <em>map</em> says "the point moves <b>to</b> here," a <em>field</em> says "an arrow <b>sits at</b> here" (a force, a velocity), pinned to the point rather than naming a destination. Same function, two pictures.</p>
    <p><b>Must the dimensions match?</b> For a <em>field</em>, yes — the output is an arrow you want to draw <em>at</em> the point, so it has to live in the same space, $\\mathbb R^n\\to\\mathbb R^n$ (a planar field gives planar arrows, a spatial field spatial arrows). A function with <em>different</em> dimensions, $\\mathbb R^n\\to\\mathbb R^m$, is a perfectly good <b>map</b> — a path $\\mathbb R\\to\\mathbb R^3$, a parametrized surface $\\mathbb R^2\\to\\mathbb R^3$, a neural-network layer $\\mathbb R^n\\to\\mathbb R^m$ — but its output can't be pinned as an arrow on the input, so it isn't called a field. Its derivative is then a non-square Jacobian <em>matrix</em>, which is exactly where Module 12 (matrix calculus) picks up.</p>
    <p><b>Flip between fields below and drag the sample point</b> to read the arrow there.</p>
    <div class="seg" id="segf"></div>
    <canvas id="cvf" width="640" height="400"></canvas>
    <p class="small" id="obsf" style="margin-top:6px;color:#9fb0c4"></p>
    <div class="readout"><div class="rdc"><div class="k">point (x, y)</div><div class="v" id="pf">—</div></div><div class="rdc"><div class="k">arrow F = (P, Q)</div><div class="v" id="ff">—</div></div><div class="rdc"><div class="k">length |F|</div><div class="v" id="mf">—</div></div></div>
    <div class="task"><b>Read an arrow's length</b>Switch to the <b>gradient</b> field $\\mathbf F=\\nabla f$ of $f=x^2+y^2$ and drag the sample to $(1.5,\\,2)$. Its components are $(2x,2y)=(3,4)$. What is the arrow's length $|\\mathbf F|$ there?</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>

    <p style="margin-top:16px"><b>Three families cover most of what you'll meet.</b></p>
    <p>&bull; <b>Gradient (conservative)</b> fields $\\mathbf F=\\nabla f$ — arrows point straight uphill on some scalar $f$, perpendicular to its contours. The "uphill" field above is $\\nabla(x^2+y^2)=(2x,2y)$.</p>
    <p>&bull; <b>Rotational</b> fields like $(-y,\\,x)$ — arrows wrap around in circles, a vortex or a storm. No hill has these as its gradient: water can swirl forever, but you can't walk uphill forever and return to where you started.</p>
    <p>&bull; <b>Radial source / sink</b> fields like $(x,y)$ or $(-x,-y)$ — arrows stream straight out of or into a point, like fluid from a spring or toward a drain.</p>
    <p>That first distinction — a field that <em>is</em> someone's gradient versus one that only swirls — is the hinge the rest of the module turns on. The next beats add up a field's push along a path (a <b>line integral</b>), which for a gradient field depends only on the endpoints (just like the Fundamental Theorem), and measure the leftover swirl (<b>circulation</b> and <b>curl</b>) that the rotational field has and the gradient field doesn't.</p></div>`;

  const cv=document.getElementById('cvf');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height,S=52,cx=W/2,cy=H/2;

  const FIELDS={

    <p>The steps below are coloured by sign: <span style="color:#3fb98f">green</span> where the field helps ($\\mathbf F\\cdot d\\mathbf r&gt;0$) and <span style="color:#d98f8f">red</span> where it fights ($\\mathbf F\\cdot d\\mathbf r&lt;0$). <b>Refine</b> the chopping and watch the running total converge.</p>

    <canvas id="cvchop" width="640" height="300"></canvas>

    <p>This is the single-variable integral with one upgrade. There, $\\int f\\,dx$ summed height $\\times$ a step $dx$ along the $x$-axis. Here the step $d\\mathbf r$ is a <em>vector</em> along a curve and $\\mathbf F$ is a vector, so plain multiplication becomes the dot product — keeping only the aligned component.</p>

function c10_conservative(){
  stage.innerHTML=`<div class="card"><h2>Conservative fields: when the route doesn't matter</h2>
    <p>Last beat left a cliffhanger: for the swirling field the work depended on the path, but for the gradient field $\\mathbf F=\\nabla f$ every route gave the same total. That's not luck — it's the Fundamental Theorem, lifted from the number line to paths. This beat is about the special fields that are some scalar's gradient: the <b>conservative</b> ones.</p>

    <p><b>Start in one dimension — it's almost too simple, which is the point.</b> On a line you can only go one way or the other, so a "loop" is just walking out from $a$ to $b$ and straight back. <b>Drag the trip below</b>: the height is a potential $f(x)$, the ball is you, and the readout is the work done so far, $f(\\text{here})-f(a)$.</p>
    <canvas id="cv1d" width="640" height="240"></canvas>
    <p class="small" id="obs1" style="margin-top:6px;color:#9fb0c4"></p>
    <p>Out to $b$ it reaches $f(b)-f(a)$; walking back, every step is reversed, so it unwinds to exactly $0$ — any round trip does zero net work. Two things to notice. In 1-D <em>every</em> field is conservative: $F$ is always the derivative of its own area function $f$, nothing else it could be. And there is only one route between two points, so "the path doesn't matter" is trivially true. Path-dependence needs room — only in 2-D can two routes enclose <em>area</em>, letting a field <b>swirl</b> around it and do net work on a loop. That swirl is the genuinely new thing, with no 1-D counterpart, and it is what the picture below is really about.</p>

    <p><b>See it first.</b> Below, $\\mathbf F=\\nabla f$ comes from the bowl $f(x,y)=x^2+y^2$. Picture $f$ as <b>elevation</b> — a height over each point — but note the field $\\nabla f=(2x,2y)$ is a <b>flat 2-D vector field on the input plane</b>, not arrows climbing a 3-D hillside. Each arrow lies on the map and points the compass direction that is steepest-uphill, longer where the ground is steeper — the "which way is up" of the landscape, drawn on the floor. (Right as you suspected: a gradient lives in the input plane, same dimensions in and out.) Point $A$ is fixed; <b>drag $B$</b>. Two routes are drawn — a straight line and a bowed detour — and the readout shows the work each does. Flip to the swirl field to see the contrast.</p>
    <div class="seg" id="segF"></div>
    <canvas id="cv" width="640" height="420"></canvas>
    <p class="small" id="obs" style="margin-top:6px;color:#9fb0c4"></p>
    <div class="readout"><div class="rdc"><div class="k">work · straight</div><div class="v" id="ws">—</div></div><div class="rdc"><div class="k">work · detour</div><div class="v" id="wa">—</div></div><div class="rdc"><div class="k">loop (out &amp; back)</div><div class="v" id="wl">—</div></div><div class="rdc"><div class="k">f(B) − f(A)</div><div class="v" id="wd">—</div></div></div>

    <p style="margin-top:16px"><b>Why the route washes out.</b> Walk any path $\\mathbf r(t)$ from $A$ to $B$ and feed $\\mathbf F=\\nabla f$ into the line integral. The integrand is $\\nabla f\\cdot\\mathbf r'$ — and that is <em>exactly</em> the multivariable chain rule from Module 8, which says $\\nabla f\\cdot\\mathbf r'=\\dfrac{d}{dt}f(\\mathbf r(t))$. The messy field dotted with the velocity collapses into the plain time-derivative of your <em>height</em> $f$ along the walk:</p>
    <div class="eqbox">$$\\int_C\\nabla f\\cdot d\\mathbf r=\\int_a^b \\nabla f\\cdot\\mathbf r'\\,dt=\\int_a^b \\frac{d}{dt}f(\\mathbf r(t))\\,dt.$$</div>
    <p>Now the integrand is a pure derivative, so the <em>ordinary</em> Fundamental Theorem from Module 5 finishes the job — the inside only shows up at the two ends. This result has a name, the <b>gradient theorem</b> (or the Fundamental Theorem for line integrals):</p>
    <div class="eqbox">$$\\int_C\\nabla f\\cdot d\\mathbf r=f(\\mathbf r(b))-f(\\mathbf r(a))=f(B)-f(A).$$</div>
    <p>It's the FTC with one swap: $\\displaystyle\\int_a^b f'(x)\\,dx=f(b)-f(a)$ becomes $\\displaystyle\\int_C\\nabla f\\cdot d\\mathbf r=f(B)-f(A)$, the single derivative $f'$ promoted to the gradient $\\nabla f$ and the interval to a path. The whole trip's work is just the <b>change in height</b> between the ends — so every route ties, and a <b>closed loop</b> ($B=A$) does zero net work. Climb a hill by any trail: your net elevation gain depends only on where you start and finish.</p>

    <div class="task"><b>Use the shortcut</b>For $\\mathbf F=\\nabla f$ with $f=x^2+y^2$, what is the work from $A=(1,0)$ to $B=(2,2)$ along <em>any</em> path?</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>

    <p style="margin-top:16px"><b>Which fields are conservative — and how do you recover the potential?</b> Not all are: the swirl $(-y,x)$ isn't, as the loop readout shows. Being a gradient says something strong about the two components $\\mathbf F=(P,Q)$ (with $P(x,y)$ the $x$-part, $Q(x,y)$ the $y$-part — the same $P,Q$ used throughout vector calculus): they aren't two independent functions but <em>two faces of one</em> scalar, since $\\mathbf F=\\nabla f=(f_x,f_y)$ forces $P=f_x$ and $Q=f_y$. That shared parent leaves a fingerprint. Differentiate <em>crosswise</em>: $P_y=f_{xy}$ and $Q_x=f_{yx}$, which are equal because the mixed partials of $f$ agree (the Clairaut fact from the Hessian). So every conservative field satisfies</p>
    <div class="eqbox">$$\\frac{\\partial P}{\\partial y}=\\frac{\\partial Q}{\\partial x}.$$</div>
    <p>The test differentiates <em>across</em> the components ($P_y$ against $Q_x$); rebuilding the hidden $f$ runs the other way — <em>integrate</em> each component against the variable it was differentiated by: $f=\\int P\\,dx$ (plus an unknown function of $y$) and $f=\\int Q\\,dy$ (plus an unknown function of $x$). Both must rebuild the <em>same</em> $f$, so forcing them to agree pins down the leftover piece — the whole recipe for a potential (Problem 4 runs it end to end). Integrating the <em>wrong</em> way, $P$ by $y$ or $Q$ by $x$, rebuilds nothing: that pairing is the crosswise derivative, the test, not the undo. The slogan: <b>cross-differentiate to test, straight-integrate to build.</b></p>
    <p>Check the two fields: the gradient $(2x,2y)$ has $P_y=0=Q_x$ — it passes, and a potential exists ($f=x^2+y^2$). The swirl $(-y,x)$ has $P_y=-1$ but $Q_x=+1$ — it fails, so no $f$ can exist, and the two half-built potentials refuse to agree. That mismatch $Q_x-P_y$ measures the field's built-in <em>swirl</em> at a point; in the next beat it gets a name — the <b>curl</b> — and a theorem (Green's) tying the swirl inside a loop to the circulation around it. (On a domain with no holes, passing the test is also enough to <em>be</em> conservative.)</p></div>`;

  // ===== single-variable lead-in: out-and-back round trip =====
  (function(){const c=document.getElementById('cv1d');const g=c&&c.getContext&&c.getContext('2d');if(!g)return;const Wd=c.width,Hd=c.height;
    const f=x=>2-0.25*(x-2.5)*(x-2.5), fp=x=>-0.5*(x-2.5);

      // axis

  const cv=document.getElementById('cv');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height,S=78,cx=320,cy=212;

  let fk='grad';const A=[-1.3,-0.8];let B=[1.2,0.9];
  function arrow(X0,Y0,X1,Y1,col,w){if(!ctx)return;ctx.strokeStyle=col;ctx.lineWidth=w||1.6;ctx.beginPath();ctx.moveTo(X0,Y0);ctx.lineTo(X1,Y1);ctx.stroke();const a=Math.atan2(Y1-Y0,X1-X0),hl=Math.min(10,Math.hypot(X1-X0,Y1-Y0));ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(X1,Y1);ctx.lineTo(X1-hl*Math.cos(a-0.4),Y1-hl*Math.sin(a-0.4));ctx.lineTo(X1-hl*Math.cos(a+0.4),Y1-hl*Math.sin(a+0.4));ctx.closePath();ctx.fill();}

    for(let i=0;i<=60;i++){const t=i/60;let x,y;if(kind==='straight'){x=A[0]+t*d[0];y=A[1]+t*d[1];}else{x=A[0]+t*d[0]+bow*Math.sin(Math.PI*t)*n[0];y=A[1]+t*d[1]+bow*Math.sin(Math.PI*t)*n[1];}pts.push([x,y]);}return pts;}
  function work(kind){const F=FIELDS[fk].F,d=[B[0]-A[0],B[1]-A[1]],dm=Math.hypot(d[0],d[1])||1;const n=[-d[1]/dm,d[0]/dm],bow=0.5*dm;const N=400;let s=0,dt=1/N;
    for(let i=0;i<N;i++){const t=(i+0.5)*dt;let x,y,vx,vy;if(kind==='straight'){x=A[0]+t*d[0];y=A[1]+t*d[1];vx=d[0];vy=d[1];}else{x=A[0]+t*d[0]+bow*Math.sin(Math.PI*t)*n[0];y=A[1]+t*d[1]+bow*Math.sin(Math.PI*t)*n[1];vx=d[0]+bow*Math.PI*Math.cos(Math.PI*t)*n[0];vy=d[1]+bow*Math.PI*Math.cos(Math.PI*t)*n[1];}const Fv=F(x,y);s+=(Fv[0]*vx+Fv[1]*vy)*dt;}return s;}
  function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);const F=FIELDS[fk].F,cons=FIELDS[fk].cons;

    // field arrows
    for(let gx=-2;gx<=2;gx+=0.5)for(let gy=-2;gy<=2;gy+=0.5){const v=F(gx,gy),mag=Math.hypot(v[0],v[1]);if(mag<1e-9)continue;const L=Math.max(0.1,Math.min(0.34,mag*0.08));arrow(px(gx),py(gy),px(gx+v[0]/mag*L),py(gy+v[1]/mag*L),'#243a52',1.2);}
    // two paths

    // A and B
    ctx.fillStyle='#dbe6f4';ctx.beginPath();ctx.arc(px(A[0]),py(A[1]),6,0,7);ctx.fill();ctx.beginPath();ctx.arc(px(B[0]),py(B[1]),6,0,7);ctx.fill();

function c10_curl(){
  stage.innerHTML=`<div class="card"><h2>Curl: a field's spin at a point</h2>
    <p>A flow can <b>spin</b> things. Drop a tiny paddlewheel at a point and let the field turn it — some fields spin it fast, some not at all, some the other way. We want a single number at each point for this local rate of rotation. It is the "swirl" that stopped the field $(-y,x)$ from being any hill's gradient.</p>

    <p><b>How do you measure spin? Walk a tiny loop.</b> Rotation can't be read off one arrow. Instead ring the point with a small loop, walk once around it counter-clockwise, and add up the field's push <em>along</em> your motion — the tangential part of $\\mathbf F$. That running total is the <b>circulation</b>, the closed-loop line integral $\\oint\\mathbf F\\cdot d\\mathbf r$. If the field mostly pushes you forward around the loop, it circulates that way. <b>Drag the loop, flip the field</b>: green marks where the field helps you go counter-clockwise, red where it fights you.</p>
    <div class="seg" id="segS"></div>
    <canvas id="cvspin" width="640" height="360"></canvas>
    <p class="small" id="obsS" style="margin-top:6px;color:#9fb0c4"></p>
    <div class="readout"><div class="rdc"><div class="k">circulation ∮F·dr (this loop)</div><div class="v" id="cS">—</div></div><div class="rdc"><div class="k">spins?</div><div class="v" id="sS">—</div></div></div>
    <p>The swirl pushes you forward the whole way around (all green) — strong circulation. The gradient field helps on one side and fights on the other by exactly as much (green and red balance to zero) — no spin, which is why a gradient was conservative: it never circulates.</p>

    <p><b>From a loop to a point: circulation per area.</b> Circulation around a big loop blends together the spin of everything inside it. To isolate the spin <em>at</em> the point, shrink the loop and divide by the area it still encloses — circulation per unit area. That limit is the <b>curl</b>:</p>
    <div class="eqbox">$$\\operatorname{curl}\\mathbf F=\\lim_{\\text{area}\\to 0}\\frac{\\oint \\mathbf F\\cdot d\\mathbf r}{\\text{area enclosed}}.$$</div>

    <p><b>Derive it on a tiny rectangle.</b> Take a box with bottom-left corner $(x,y)$, width $dx$, height $dy$, and walk it counter-clockwise. On a <b>horizontal</b> step $d\\mathbf r=(dx,0)$ only $P\\,dx$ counts; on a <b>vertical</b> step $d\\mathbf r=(0,dy)$ only $Q\\,dy$ counts — so the bottom and top edges carry $P$, the two sides carry $Q$.</p>
    <canvas id="cvcell" width="640" height="250"></canvas>
    <p>Direction sets each sign: the <em>bottom</em> is walked rightward ($+P\\,dx$), the <em>top</em> leftward ($-P\\,dx$); the <em>right</em> side up ($+Q\\,dy$), the <em>left</em> down ($-Q\\,dy$). Group the matching pair on each axis:</p>
    <p style="margin:4px 0 2px">&bull; the two <b>vertical</b> edges: $Q(x{+}dx)\\,dy-Q(x)\\,dy$ — the same $Q$ read a step $dx$ apart;</p>
    <p style="margin:2px 0 4px">&bull; the two <b>horizontal</b> edges: $P(x,y)\\,dx-P(x,y{+}dy)\\,dx$ — the same $P$ a step $dy$ apart, landing <em>minus</em> because the top runs backward.</p>
    <p>Each pair is one function's change over a small step, so it collapses by the linear approximation $\\text{change}\\approx\\text{rate}\\times\\text{step}$ — $[Q(x{+}dx)-Q(x)]\\approx Q_x\\,dx$ and $[P(y{+}dy)-P(y)]\\approx P_y\\,dy$:</p>
    <div class="eqbox">$$\\oint_{\\text{cell}}\\mathbf F\\cdot d\\mathbf r=\\underbrace{\\big[Q(x{+}dx)-Q(x)\\big]}_{Q_x\\,dx}\\,dy-\\underbrace{\\big[P(y{+}dy)-P(y)\\big]}_{P_y\\,dy}\\,dx=\\big(Q_x-P_y\\big)\\,dx\\,dy.$$</div>
    <p>Divide by the cell's area $dx\\,dy$ and the circulation density — the curl — falls out:</p>

function c10_green(){

    <p>The curl measures a field's spin at a single point. <b>Green's theorem</b> adds that spin up over a whole region and finds it equals something on the region's boundary — the circulation around the edge. It is the Fundamental Theorem pattern once more: what happens <em>inside</em> a region is bookkept by what happens on its <em>boundary</em>.</p>

    <p><b>Tile the region with tiny loops.</b> Cover $R$ with a grid of little cells and give each its own counter-clockwise loop. From the last beat, each cell's circulation is $(Q_x-P_y)\\,dA$ — its curl times its area — so adding over all the cells gives the total enclosed curl, $\\iint_R(Q_x-P_y)\\,dA$.</p>

    <p><b>The interior cancels.</b> Every edge <em>inside</em> the region is shared by two neighbouring cells and gets walked once in each direction, so those two pushes are equal and opposite — they cancel in pairs. Only the <em>outer</em> edges, walked once, survive, and together they trace one loop around the boundary $C$: the circulation $\\oint_C\\mathbf F\\cdot d\\mathbf r$. <b>Flip the switch</b> to watch the interior erase itself down to the boundary.</p>

function c10_divflux(){
  stage.innerHTML=`<div class="card"><h2>Divergence: how fast a field spreads out</h2>
    <p>Spin is only half of what a field does at a point. It can also push fluid <b>out</b> — a source, like a spring — or draw it <b>in</b> — a sink, like a drain. We want one number for the net rate fluid leaves a point. Curl read the field's <em>tangent</em> around a loop; divergence reads its <em>normal</em> — the same field, measured the perpendicular way.</p>

    <p><b>Measure outflow with flux across a loop.</b> Ring the point with a small loop and ask how much flow crosses <em>out</em> through it. Only the part of $\\mathbf F$ pointing <em>through</em> the boundary — along the outward normal $\\mathbf n$ — actually crosses; the part running along the boundary slides past without leaving. So the outward <b>flux</b> across the loop is $\\oint \\mathbf F\\cdot\\mathbf n\\,ds$. <b>Drag the loop, flip the field</b>: green marks flow leaving, red flow entering.</p>
    <div class="seg" id="segX"></div>
    <canvas id="cvfx" width="640" height="360"></canvas>
    <p class="small" id="obsX" style="margin-top:6px;color:#9fb0c4"></p>
    <div class="readout"><div class="rdc"><div class="k">flux ∮F·n ds (this loop)</div><div class="v" id="xF">—</div></div><div class="rdc"><div class="k">source / sink?</div><div class="v" id="xS">—</div></div></div>
    <p>The source pushes out all the way around (all green) — positive flux. The swirl is all grey: it circulates <em>along</em> the loop but never crosses it, so its flux is zero. Spread and spin are independent — a field can do one, the other, both, or neither.</p>

    <p><b>The outward normal, written down.</b> Walk the loop counter-clockwise with unit tangent $\\mathbf T=(dx/ds,\\,dy/ds)$. The outward normal is $\\mathbf T$ turned $90^\\circ$ clockwise, $\\mathbf n=(dy/ds,\\,-dx/ds)$. So the flux integrand is $\\mathbf F\\cdot\\mathbf n\\,ds=(P,Q)\\cdot(dy,-dx)=P\\,dy-Q\\,dx$:</p>
    <div class="eqbox">$$\\text{flux across the loop}=\\oint_C\\big(P\\,dy-Q\\,dx\\big).$$</div>

    <p><b>From a loop to a point: flux per area.</b> Flux through a big loop blends the outflow of everything inside. To get the outflow <em>at</em> the point, shrink the loop and divide by the area it encloses. That limit is the <b>divergence</b>:</p>
    <div class="eqbox">$$\\operatorname{div}\\mathbf F=\\lim_{\\text{area}\\to 0}\\frac{\\oint \\mathbf F\\cdot\\mathbf n\\,ds}{\\text{area enclosed}}.$$</div>

    <p><b>Derive it on a tiny rectangle.</b> Box with corner $(x,y)$, width $dx$, height $dy$. Count the outward flux through each edge — the field component through it times the edge length, outward positive:</p>
    <canvas id="cvcellf" width="640" height="250"></canvas>
    <p style="margin:4px 0 2px">&bull; the two <b>vertical</b> edges (outward normals $\\pm x$): $P(x{+}dx)\\,dy-P(x)\\,dy$ — the $x$-flow out the right minus in the left;</p>
    <p style="margin:2px 0 4px">&bull; the two <b>horizontal</b> edges (outward normals $\\pm y$): $Q(y{+}dy)\\,dx-Q(y)\\,dx$ — the $y$-flow out the top minus in the bottom.</p>
    <p>Each pair is one function's change over a small step — $\\text{change}\\approx\\text{rate}\\times\\text{step}$ — so $[P(x{+}dx)-P(x)]\\approx P_x\\,dx$ and $[Q(y{+}dy)-Q(y)]\\approx Q_y\\,dy$:</p>
    <div class="eqbox">$$\\oint_{\\text{cell}}\\mathbf F\\cdot\\mathbf n\\,ds=\\underbrace{[P(x{+}dx)-P(x)]}_{P_x\\,dx}\\,dy+\\underbrace{[Q(y{+}dy)-Q(y)]}_{Q_y\\,dy}\\,dx=\\big(P_x+Q_y\\big)\\,dx\\,dy.$$</div>
    <p>Divide by the area $dx\\,dy$ and the outflow density — the divergence — falls out:</p>

    <p style="margin-top:16px"><b>Next.</b> Divergence is the outflow at one point. Tile a region with these tiny loops and the flux through each shared interior edge cancels — leaving only the boundary. That is Green's second form.</p></div>`;

function c10_greenflux(){
  stage.innerHTML=`<div class="card"><h2>Green's theorem, flux form: outflow across = divergence inside</h2>
    <p>Divergence is the outflow at a single point. <b>Green's flux form</b> adds it over a whole region and finds it equals the total flux out through the region's boundary. It is the circulation story again, with the field dotted into the <em>normal</em> instead of the tangent — and it is the plane's <b>divergence theorem</b>.</p>

    <p><b>Tile the region with tiny loops.</b> Cover $R$ with little cells, each with its own small boundary loop. From the last beat, each cell's outward flux is $(\\operatorname{div}\\mathbf F)\\,dA=(P_x+Q_y)\\,dA$, so adding over all the cells gives the total enclosed divergence, $\\iint_R(P_x+Q_y)\\,dA$.</p>

    <p><b>The interior cancels.</b> Every edge <em>inside</em> the region is shared by two neighbouring cells, and their outward normals through it point <em>opposite</em> ways: what leaves one cell enters the other, so the two fluxes are equal and opposite and cancel in pairs. Only the <em>outer</em> edges survive, and together they are the flux out through the boundary, $\\oint_C\\mathbf F\\cdot\\mathbf n\\,ds$. <b>Flip the switch</b> to watch the interior cancel.</p>

    <p>That one sum, counted two ways — cell by cell the enclosed divergence, surviving-edge by surviving-edge the boundary flux — gives Green's flux form:</p>
    <div class="eqbox">$$\\oint_C\\mathbf F\\cdot\\mathbf n\\,ds=\\iint_R\\Big(\\frac{\\partial P}{\\partial x}+\\frac{\\partial Q}{\\partial y}\\Big)\\,dA.$$</div>

    <p><b>See it live.</b> The background shades the divergence (<span style="color:#d98f8f">red</span> source, <span style="color:#7ab8ff">blue</span> sink). <b>Drag the loop</b>: the flux measured out through its edge matches the divergence totalled over its inside. Flip the field.</p>
    <div class="seg" id="segF"></div>

    <div class="task"><b>Use the theorem</b>The source field $\\mathbf F=(x,y)$ has divergence $P_x+Q_y=2$. By Green's flux form, what is the outward flux across the boundary of the unit square $[0,1]\\times[0,1]$? (div $\\times$ area)</div>

    <p><b>Where it goes.</b> These two flat theorems now lift off the plane: the circulation form becomes <b>Stokes'</b> (a curved surface spanning a wire loop), and this flux form becomes the <b>divergence theorem</b> (a closed surface around a volume). The surface integral in the next beat is exactly this flux across a curve, raised one dimension — flow through a sheet instead of across a loop.</p></div>`;

function c10_surface(){
  stage.innerHTML=`<div class="card"><h2>Surface integrals: how much flows through</h2>
    <p>In the plane you measured a field's <b>flux across a curve</b> — the flow crossing a loop, dotting $\\mathbf F$ with the curve's outward normal. A <b>surface integral</b> lifts that one dimension: the flow <em>through a surface</em> in space — water through a net, wind through a window, field lines through a sheet. The same lesson returns: only the part of the field that actually crosses the surface counts. Hold a net face-on to a river and it catches the full current; turn it edge-on and the water slips past, catching nothing.</p>

    <p><b>One flat patch.</b> Flow streams in from the left (blue arrows). <b>Drag to tilt the panel.</b> Its <span style="color:#3fb98f">normal</span> $\\mathbf n$ is the direction it faces; the flux is the flow speed times the area times how squarely it faces the stream — the dot product $\\mathbf F\\cdot\\mathbf n$ times area.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <p class="small" id="obs" style="margin-top:6px;color:#9fb0c4"></p>
    <div class="readout"><div class="rdc"><div class="k">tilt from face-on</div><div class="v" id="th">—</div></div><div class="rdc"><div class="k">flux = (F·n)·area</div><div class="v" id="fx">—</div></div></div>
    <div class="eqbox">$$\\text{flux through a patch}=\\mathbf F\\cdot\\mathbf n\\,\\,dS=|\\mathbf F|\\,\\cos\\theta\\;dS.$$</div>
    <p>Face-on ($\\theta=0$, normal pointing straight into the flow) catches the most; edge-on ($\\theta=90^\\circ$) catches nothing, because then $\\mathbf F$ runs <em>along</em> the surface and never crosses it. It's the line-integral move turned sideways: there we dotted with the step direction to keep the push <em>along</em> the path; here we dot with the <b>normal</b> to keep the flow <em>through</em> the surface.</p>

    <p><b>A whole surface is a quilt of patches.</b> Curve the surface and tile it into tiny patches; each has its own little area $dS$ and its own outward normal $\\mathbf n$, so each catches $\\mathbf F\\cdot\\mathbf n\\,dS$. Add them up. On the dome below in an upward flow, the top patches face the flow squarely (full flux, green) while the sides are edge-on (no flux, grey).</p>
    <canvas id="cvs" width="640" height="300"></canvas>
    <div class="eqbox">$$\\iint_S \\mathbf F\\cdot\\mathbf n\\,\\,dS=\\lim\\sum \\mathbf F\\cdot\\mathbf n\\,\\,dS.$$</div>

    <p><b>Making it computable.</b> Describe the surface by two parameters, $\\mathbf r(u,v)$ (a sheet with its own grid). Stepping $du$ and $dv$ traces two edge vectors $\\mathbf r_u\\,du$ and $\\mathbf r_v\\,dv$; their <b>cross product</b> is perpendicular to both — the normal — and its length is the little patch's area. So the cross product delivers $\\mathbf n$ and $dS$ in one stroke (the 3-D cousin of the Jacobian's area factor):</p>
    <div class="eqbox">$$\\iint_S \\mathbf F\\cdot\\mathbf n\\,\\,dS=\\iint \\mathbf F\\cdot(\\mathbf r_u\\times\\mathbf r_v)\\,\\,du\\,dv.$$</div>

    <div class="task"><b>Tilt and compute</b>A flat panel of area $2$ sits in a flow of speed $|\\mathbf F|=1$, tilted $60^\\circ$ from face-on. What is the flux $|\\mathbf F|\\,(\\cos\\theta)\\,(\\text{area})$?</div>
    <div class="entry"><input id="ni" inputmode="decimal" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>

    <p style="margin-top:16px"><b>Where this is heading.</b> Two surfaces matter next. Wrap the surface into a <b>closed</b> bag around a volume and the total outward flux measures what the volume produces — the <b>divergence theorem</b>, $\\iint_{\\partial V}\\mathbf F\\cdot\\mathbf n\\,dS=\\iiint_V \\operatorname{div}\\mathbf F\\,dV$, the flux-form of Green lifted to 3-D. Or stretch a surface across a loop and push the field's <b>curl</b> through it — <b>Stokes' theorem</b>, $\\oint_{\\partial S}\\mathbf F\\cdot d\\mathbf r=\\iint_S(\\operatorname{curl}\\mathbf F)\\cdot\\mathbf n\\,dS$, the circulation-form of Green lifted to 3-D. Both are the one idea you've seen all chapter: what happens <em>inside</em> a region is bookkept by what crosses its <em>boundary</em>.</p></div>`;

  // ===== tilt panel =====
  const A=mk('cv',235);const AREA=2,HALF=Math.sqrt(AREA)/2;

    ctx.fillStyle='rgba(232,184,75,0.22)';ctx.strokeStyle='#e8b84b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);ctx.lineTo(p3[0],p3[1]);ctx.lineTo(p4[0],p4[1]);ctx.closePath();ctx.fill();ctx.stroke();
    // normal arrow from panel center

    ctx.fillStyle='#3fb98f';ctx.font='13px sans-serif';const ne=P(n[0]*1.0,n[1]*1.0,0.4);ctx.fillText('n',ne[0]+6,ne[1]);
    ctx.fillStyle='#8095ab';ctx.font='12px sans-serif';ctx.fillText('flow F →',P(-1.7,0,1.5)[0],P(-1.7,0,1.5)[1]);
    const flux=AREA*Math.cos(th);

    const ob=document.getElementById('obs');if(ob)ob.textContent=th<0.08?'Face-on: the panel faces straight into the flow and catches all of it — flux = area = '+AREA.toFixed(2)+'.':(th>1.5?'Edge-on: the flow slides along the panel and crosses nothing — flux ≈ 0.':'Tilted '+(th*180/Math.PI).toFixed(0)+'°: it catches area × cos θ = '+flux.toFixed(2)+'.');}
  A.cv.style.touchAction='none';let drg=false;
  function setP(e){const r=A.cv.getBoundingClientRect();const X=(e.clientX-r.left)*(A.W/Math.max(1,r.width));th=Math.max(0,Math.min(Math.PI/2,(X-60)/(A.W-120)*Math.PI/2));drawPanel();}
  A.cv.addEventListener('pointerdown',e=>{drg=true;try{A.cv.setPointerCapture(e.pointerId);}catch(x){}setP(e);e.preventDefault();});
  A.cv.addEventListener('pointermove',e=>{if(drg){e.preventDefault();setP(e);}});
  const end=()=>drg=false;A.cv.addEventListener('pointerup',end);A.cv.addEventListener('pointercancel',end);
  drawPanel();

  // ===== dome of patches =====
  (function(){const B=mk('cvs',250);const {ctx,W,H,P}=B;if(!ctx)return;ctx.clearRect(0,0,W,H);
    // floor disk
    ctx.strokeStyle='#1a2534';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<=60;i++){const a=i/60*2*Math.PI;const p=P(Math.cos(a),Math.sin(a),0);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.stroke();

function c10_stokes(){
  stage.innerHTML=`<div class="card"><h2>Stokes' theorem: Green lifted off the plane</h2>
    <p>Green's theorem tied the circulation around a flat loop to the curl totalled over the flat region it bounds. <b>Stokes' theorem</b> is the same statement with the floor removed: the loop can be a bent wire in space, the region a <em>curved surface</em> stretched across it, and the curl is now a <b>vector</b>. The circulation around the wire equals the flux of that curl vector through the surface.</p>
    <div class="eqbox">$$\\oint_{\\partial S}\\mathbf F\\cdot d\\mathbf r=\\iint_S (\\operatorname{curl}\\mathbf F)\\cdot\\mathbf n\\,\\,dS.$$</div>
    <p>In 3-D the curl is a vector, $\\operatorname{curl}\\mathbf F=(R_y-Q_z,\\;P_z-R_x,\\;Q_x-P_y)$ — it points along the axis the field spins around (right-hand rule), and its length is the spin rate. Its $k$-component $Q_x-P_y$ is exactly the flat curl from Green; Stokes just dots the whole vector with the surface's normal $\\mathbf n$, keeping the spin that pokes <em>through</em> the surface.</p>

    <p><b>The surprise: the surface doesn't matter.</b> The loop below is a fixed wire (gold). The field $\\mathbf F=(-y,x,0)$ swirls counter-clockwise, so its curl is the constant upward vector $(0,0,2)$ (cyan). <b>Drag to bulge</b> the spanning surface from a flat disk into a tall dome — and the flux of curl through it never budges from the loop's circulation. Any surface with the same rim gives the same answer.</p>
    <canvas id="cv" width="640" height="360"></canvas>
    <p class="small" id="obs" style="margin-top:6px;color:#9fb0c4"></p>
    <div class="readout"><div class="rdc"><div class="k">circulation ∮ F·dr (the rim)</div><div class="v" id="circ">—</div></div><div class="rdc"><div class="k">flux of curl ∬(curl F)·n dS</div><div class="v" id="flux">—</div></div><div class="rdc"><div class="k">bulge height</div><div class="v" id="hv">—</div></div></div>

    <p><b>Why it holds — the same tiling proof.</b> Tile the surface into tiny patches. Each little patch, walked counter-clockwise, has circulation equal to the curl's component through it times the patch area, $(\\operatorname{curl}\\mathbf F)\\cdot\\mathbf n\\,dS$ — the micro-Stokes from the cell argument, now reading the curl through a tilted patch. Add all the patches: interior edges are shared by two and cancel in pairs, leaving only the rim. Sum of patch fluxes $=\\iint_S(\\operatorname{curl}\\mathbf F)\\cdot\\mathbf n\\,dS$; surviving edges $=\\oint_{\\partial S}\\mathbf F\\cdot d\\mathbf r$. Same sum.</p>
    <canvas id="cvp" width="640" height="190"></canvas>

    <p><b>And why the surface is free to move.</b> Two surfaces sharing a rim enclose a sealed volume between them; the curl has zero divergence everywhere ($\\operatorname{div}\\operatorname{curl}\\mathbf F=0$ always), so no curl-flux is created or lost inside — whatever flows through one surface flows through the other. It's a soap film on a loop of wire: blow it into any shape you like, the rim is unchanged, so the circulation is unchanged.</p>

    <div class="task"><b>Use Stokes</b>$\\mathbf F=(-y,x,0)$ has curl $(0,0,2)$. A loop in the $xy$-plane encircles an area of $3$. By Stokes, its circulation — the flux of curl through the flat disk — is $(\\operatorname{curl}\\mathbf F\\cdot\\mathbf k)\\times\\text{area}$. What is it?</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>

    <p style="margin-top:16px"><b>The pattern, nearly complete.</b> Flat loop (Green) was the special case $\\mathbf n=\\mathbf k$ and a flat $S$. One theorem remains in the family: seal the surface into a closed bag around a <em>volume</em>, and the outward flux equals the <b>divergence</b> totalled inside — the <b>divergence theorem</b>, the flux-form of Green lifted the same way. That's the last beat.</p></div>`;

  const AX=70,AY=30,BX=-55,BY=34,CZ=72,CX=320,CY=250;
  const P=(x,y,z)=>[CX+x*AX+y*BX, CY+x*AY+y*BY-z*CZ];
  function arr(ctx,a,b,col,w){if(!ctx)return;ctx.strokeStyle=col;ctx.lineWidth=w||1.8;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();const an=Math.atan2(b[1]-a[1],b[0]-a[0]),hl=Math.min(10,Math.hypot(b[0]-a[0],b[1]-a[1]));ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(b[0],b[1]);ctx.lineTo(b[0]-hl*Math.cos(an-0.4),b[1]-hl*Math.sin(an-0.4));ctx.lineTo(b[0]-hl*Math.cos(an+0.4),b[1]-hl*Math.sin(an+0.4));ctx.closePath();ctx.fill();}

  // ===== main interactive: loop + deformable cap + curl flux =====
  const cv=document.getElementById('cv');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height;
  let hgt=0.0;  // bulge height
  function capZ(r){return hgt*(1-r*r);}
  function fluxCurl(){ // ∬ curl·(R_r×R_θ) dr dθ with curl=(0,0,2); integrand = 2r
    const N=40;let s=0;for(let i=0;i<N;i++){const r=(i+0.5)/N;s+=2*r*(1/N)*2*Math.PI;}return s;}
  function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);

    for(const rr of [0.25,0.5,0.75,1]){ctx.beginPath();for(let i=0;i<=60;i++){const a=i/60*2*Math.PI;const p=P(rr*Math.cos(a),rr*Math.sin(a),capZ(rr));i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.stroke();}
    for(let k=0;k<8;k++){const a=k*Math.PI/4;ctx.beginPath();for(let i=0;i<=20;i++){const r=i/20;const p=P(r*Math.cos(a),r*Math.sin(a),capZ(r));i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.stroke();}
    // curl arrows (cyan, upward) through the cap at a few points
    for(const [x,y] of [[0,0],[0.6,0],[-0.6,0],[0,0.6],[0,-0.6]]){const r=Math.hypot(x,y);const z0=capZ(r);arr(ctx,P(x,y,z0),P(x,y,z0+0.55),'#56c7d6',2);}
    // the rim loop (gold) with CCW direction arrows
    ctx.strokeStyle='#e8b84b';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<=60;i++){const a=i/60*2*Math.PI;const p=P(Math.cos(a),Math.sin(a),0);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.stroke();
    for(const a of [0.3,2.4,4.5]){const p=P(Math.cos(a),Math.sin(a),0);const t=P(Math.cos(a+0.25),Math.sin(a+0.25),0);arr(ctx,p,t,'#e8b84b',2.5);}
    ctx.fillStyle='#56c7d6';ctx.font='12px sans-serif';ctx.fillText('curl F = (0,0,2)',P(0,0,capZ(0)+0.62)[0]-30,P(0,0,capZ(0)+0.62)[1]-6);
    ctx.fillStyle='#caa64e';ctx.fillText('rim: the wire loop ∂S',P(0,-1,0)[0]-40,P(0,-1,0)[1]+18);
    const circ=2*Math.PI,fx=fluxCurl();
    document.getElementById('circ').textContent=circ.toFixed(3);
    document.getElementById('flux').textContent=fx.toFixed(3);
    document.getElementById('hv').textContent=hgt.toFixed(2);
    const ob=document.getElementById('obs');if(ob)ob.textContent=hgt<0.05?'Flat disk (bulge 0): here the surface lies in the plane and Stokes is exactly Green — curl·k over a flat region. Circulation = flux = 6.28.':'Bulged to '+hgt.toFixed(2)+': the surface is now a curved dome, yet the flux of curl through it is still 6.28 — equal to the rim’s circulation. The shape didn’t matter.';}
  cv.style.touchAction='none';let drg=false;
  function setP(e){const r=cv.getBoundingClientRect();const X=(e.clientX-r.left)*(W/Math.max(1,r.width));hgt=Math.max(0,Math.min(1.5,(X-40)/(W-80)*1.5));draw();}
  cv.addEventListener('pointerdown',e=>{drg=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}setP(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(drg){e.preventDefault();setP(e);}});
  const end=()=>drg=false;cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  draw();

  // ===== static patch diagram =====
  (function(){const c=document.getElementById('cvp');const g=c&&c.getContext&&c.getContext('2d');if(!g)return;const Wp=c.width,Hp=c.height;g.clearRect(0,0,Wp,Hp);
    const cx=Wp/2,cy=120,s=70;
    // a tilted patch (parallelogram)
    const u=[s,24],v=[-40,-30];const o=[cx,cy];
    const p1=[o[0]-u[0]/2-v[0]/2,o[1]-u[1]/2-v[1]/2],p2=[p1[0]+u[0],p1[1]+u[1]],p3=[p2[0]+v[0],p2[1]+v[1]],p4=[p1[0]+v[0],p1[1]+v[1]];

    // CCW micro-loop arrows on the edges
    arr(g,p1,p2,'#e8b84b',2);arr(g,p2,p3,'#e8b84b',2);arr(g,p3,p4,'#e8b84b',2);arr(g,p4,p1,'#e8b84b',2);
    // normal + curl poking through

    arr(g,[o[0]-nrm[0]*0.4,o[1]-nrm[1]*0.4],[o[0]+nrm[0]*1.1,o[1]+nrm[1]*1.1],'#56c7d6',2);

    g.fillStyle='#56c7d6';g.fillText('curl F',o[0]+nrm[0]*1.1+6,o[1]+nrm[1]*1.1+4);
